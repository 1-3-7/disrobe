name: JavaScript recovery tests
description: Run high-preset corpus recovery modules in release and retain debug coverage for every other test
runs:
  using: composite
  steps:
    - name: Run the complete JavaScript test inventory
      shell: pwsh
      env:
        RELEASE_TEST_MODULES: |
          obfuscator_io_e2e
          obfuscator_io_differential_oracle
          reeval_corpus_oracle
      run: |
        Set-StrictMode -Version Latest
        $ErrorActionPreference = 'Stop'
        $PSNativeCommandUseErrorActionPreference = $false
        [string[]]$metadataLines = @(& cargo metadata --format-version 1 --no-deps --all-features)
        if ($LASTEXITCODE -ne 0) { throw "Cargo metadata failed with exit code $LASTEXITCODE" }
        [object]$metadata = ($metadataLines -join "`n") | ConvertFrom-Json
        [object[]]$packages = @($metadata.packages | Where-Object { $_.name -ceq 'disrobe-pass-js-deob' })
        if ($packages.Count -ne 1) { throw 'Cargo metadata must identify exactly one JavaScript package' }
        foreach ($target in $packages[0].targets) {
          foreach ($kind in $target.kind) {
            if ($kind -cnotin @('lib', 'test', 'bench', 'custom-build')) {
              throw "JavaScript target kind $kind needs an explicit coverage route"
            }
          }
        }
        [string[]]$integrationTargets = @($packages[0].targets | Where-Object { $_.kind -ccontains 'test' } | ForEach-Object { $_.name })
        if ($integrationTargets.Count -ne 1 -or $integrationTargets[0] -cne 'it') {
          throw 'Cargo metadata must expose exactly the consolidated JavaScript integration target named it'
        }
        [string[]]$releaseModules = @($env:RELEASE_TEST_MODULES -split '\s+' | Where-Object { $_.Length -gt 0 })
        if ($releaseModules.Count -eq 0 -or $releaseModules.Count -ne @($releaseModules | Sort-Object -CaseSensitive -Unique).Count) {
          throw 'The release recovery-oracle group must contain distinct integration modules'
        }
        [string]$integrationSource = Get-Content -LiteralPath 'crates/disrobe-pass-js-deob/tests/it/main.rs' -Raw
        foreach ($module in $releaseModules) {
          [string]$modulePattern = "(?m)^mod $([regex]::Escape($module));\r?$"
          if ([regex]::Matches($integrationSource, $modulePattern).Count -ne 1) {
            throw "Release recovery oracle module $module must appear exactly once in tests/it/main.rs"
          }
        }
        Write-Host "JavaScript inventory: one integration target, $($releaseModules.Count) release recovery modules, remaining integration tests in debug, unit tests and doctests"
        [string[]]$commonArguments = @('test', '-p', 'disrobe-pass-js-deob', '--all-features', '--no-fail-fast')
        [string[]]$debugArguments = $commonArguments + @('--lib', '--test', 'it', '--', '--nocapture')
        foreach ($module in $releaseModules) {
          $debugArguments += @('--skip', "${module}::")
        }
        [object[]]$phases = @(
          @{ Name = 'debug unit and integration tests'; Arguments = $debugArguments },
          @{ Name = 'debug doctests'; Arguments = $commonArguments + @('--doc', '--', '--nocapture') }
        )
        [int]$firstFailure = 0
        foreach ($phase in $phases) {
          Write-Host "Running JavaScript $($phase.Name)"
          [string[]]$testArguments = $phase.Arguments
          & cargo @testArguments
          [int]$phaseExitCode = $LASTEXITCODE
          if ($phaseExitCode -ne 0) {
            Write-Host "JavaScript $($phase.Name) failed with exit code $phaseExitCode"
            if ($firstFailure -eq 0) { $firstFailure = $phaseExitCode }
          }
        }
        foreach ($module in $releaseModules) {
          Write-Host "Running JavaScript release recovery module $module"
          [string[]]$releaseArguments = $commonArguments + @('--release', '--test', 'it', "${module}::", '--', '--nocapture')
          & cargo @releaseArguments
          [int]$moduleExitCode = $LASTEXITCODE
          if ($moduleExitCode -ne 0) {
            Write-Host "JavaScript release recovery module $module failed with exit code $moduleExitCode"
            if ($firstFailure -eq 0) { $firstFailure = $moduleExitCode }
          }
        }
        exit $firstFailure
