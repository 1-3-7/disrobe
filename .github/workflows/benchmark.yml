name: benchmark

on:
  push:
    branches: [main]

jobs:
  bench:
    name: benchmark
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.96.1
      - uses: Swatinem/rust-cache@v2
      - name: run benchmarks
        shell: bash
        run: |
          set -o pipefail
          cargo bench --workspace --features disrobe-pass-native/benchmarks 2>&1 | tee bench-output.txt
      - name: upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bench-${{ github.sha }}
          path: bench-output.txt
