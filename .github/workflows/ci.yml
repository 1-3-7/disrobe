name: ci

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  PYO3_USE_ABI3_FORWARD_COMPATIBILITY: "1"

jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        id: setup-python
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@1.96.1
      - uses: Swatinem/rust-cache@v2
      - name: export PYO3_PYTHON
        shell: bash
        run: echo "PYO3_PYTHON=${{ steps.setup-python.outputs.python-path }}" >> "$GITHUB_ENV"
      - run: cargo check --workspace --all-targets --all-features

  fmt:
    name: fmt
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.96.1
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        id: setup-python
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@1.96.1
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: export PYO3_PYTHON
        run: echo "PYO3_PYTHON=${{ steps.setup-python.outputs.python-path }}" >> "$GITHUB_ENV"
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings -W unreachable_pub -W missing_debug_implementations -W unused

  graphs:
    name: graphs
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        id: setup-python
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@1.96.1
      - uses: Swatinem/rust-cache@v2
      - name: export PYO3_PYTHON
        run: echo "PYO3_PYTHON=${{ steps.setup-python.outputs.python-path }}" >> "$GITHUB_ENV"
      - name: every generated artifact is byte-fresh (schemas, bindings, error docs, graphs, demo, card, plugins, evidence, README stat cross-check)
        run: cargo run -p xtask -- regen --check
      - name: documentation metric markers match xtask/data/recovery.json (README + mdBook)
        run: cargo run -p xtask -- metrics --check

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    env:
      CARGO_PROFILE_TEST_DEBUG: "0"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - name: free disk space (linux runner)
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/lib/android /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force 2>/dev/null || true
          df -h /
      - uses: actions/setup-python@v6
        id: setup-python
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: provision cpython 3.8-3.14 for the py-decompile construct matrix
        run: uv python install 3.8 3.9 3.10 3.11 3.12 3.13 3.14
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: export PYO3_PYTHON
        shell: bash
        run: echo "PYO3_PYTHON=${{ steps.setup-python.outputs.python-path }}" >> "$GITHUB_ENV"
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
      - name: provision the smt solver the mba corpus is graded against
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check z3-solver
          SCRIPTS="$(python -c "import sysconfig; print(sysconfig.get_path('scripts'))")"
          echo "$SCRIPTS" >> "$GITHUB_PATH"
          if command -v cygpath >/dev/null 2>&1; then
            PROBE="$(cygpath -u "$SCRIPTS")"
          else
            PROBE="$SCRIPTS"
          fi
          if [ -x "$PROBE/z3" ]; then
            "$PROBE/z3" --version
          elif [ -x "$PROBE/z3.exe" ]; then
            "$PROBE/z3.exe" --version
          else
            echo "z3 was installed but no executable is present in $SCRIPTS"
            ls -la "$PROBE" | head -40
            exit 1
          fi
          echo "DISROBE_REQUIRE_SOLVER=1" >> "$GITHUB_ENV"
      - name: require the committed packer fixtures so an absent one fails instead of skipping
        shell: bash
        run: |
          for pair in \
            corpus/native/packers/fsg/Hash.packed.fsg.exe \
            corpus/native/packers/nspack/hash.packed.nspack.exe \
            corpus/native/packers/petite/hello.exe; do
            if [ ! -f "$pair" ]; then
              echo "committed packer fixture missing from the checkout: $pair"
              exit 1
            fi
          done
          echo "DISROBE_REQUIRE_PACKER_FIXTURES=1" >> "$GITHUB_ENV"
      - name: provision erlang so the beam differentials run instead of returning early
        if: runner.os == 'Linux'
        uses: erlef/setup-beam@v1
        with:
          otp-version: "27"
      - name: provision the dotnet sdk the il-equivalence floors are measured with
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"
      - name: confirm the dotnet sdk is callable before the suite depends on it
        shell: bash
        run: dotnet --info
      - name: confirm erlc is callable before the suite depends on it
        if: runner.os == 'Linux'
        shell: bash
        run: |
          erl -noshell -eval 'io:format("otp ~s~n",[erlang:system_info(otp_release)]),halt().'
          erlc -v
      - run: cargo test --workspace --all-features
      - name: stage this OS leg's cross-platform determinism hash file
        shell: bash
        run: |
          set -euo pipefail
          test -f target/determinism-hashes.txt
          cp target/determinism-hashes.txt "target/determinism-hashes-${{ matrix.os }}.txt"
          cat "target/determinism-hashes-${{ matrix.os }}.txt"
      - uses: actions/upload-artifact@v7
        with:
          name: determinism-hashes-${{ matrix.os }}
          path: target/determinism-hashes-${{ matrix.os }}.txt
      - name: batch worker-pool determinism (--jobs 1 vs --jobs 4, same fixtures, one leg only)
        if: matrix.os == 'ubuntu-latest'
        run: cargo test -p disrobe-cli --test determinism_cross_platform -- --ignored batch_jobs_does_not_change_recovered_output --nocapture
      - name: aarch64 decompiler recompile-execution differential (one leg only)
        if: matrix.os == 'ubuntu-latest'
        run: cargo test -p disrobe-pass-native --test aarch64_recovery_grade -- --ignored --nocapture

  determinism-cross-platform:
    name: determinism cross-platform proof
    needs: [test]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v6
        with:
          pattern: determinism-hashes-*
          merge-multiple: true
          path: determinism-hashes
      - name: assert identical input yields byte-identical output on every OS leg
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob
          import sys

          files = sorted(glob.glob("determinism-hashes/determinism-hashes-*.txt"))
          if len(files) < 2:
              sys.exit(f"expected a hash file from every OS leg, found {files}")

          by_os = {}
          for path in files:
              os_name = path.rsplit("determinism-hashes-", 1)[-1]
              if os_name.endswith(".txt"):
                  os_name = os_name[:-4]
              entries = {}
              for line in open(path):
                  line = line.strip()
                  if not line:
                      continue
                  name, digest = line.rsplit(" ", 1)
                  entries[name] = digest
              by_os[os_name] = entries

          oses = sorted(by_os)
          baseline_os = oses[0]
          baseline = by_os[baseline_os]
          mismatches = []
          for os_name in oses[1:]:
              entries = by_os[os_name]
              if entries.keys() != baseline.keys():
                  mismatches.append(
                      f"{os_name} vs {baseline_os}: fixture set differs "
                      f"({sorted(entries)} vs {sorted(baseline)})"
                  )
                  continue
              for fixture, digest in baseline.items():
                  other = entries[fixture]
                  if other != digest:
                      mismatches.append(
                          f"{fixture}: {baseline_os}={digest} != {os_name}={other}"
                      )

          if mismatches:
              sys.exit("cross-platform determinism violated:\n" + "\n".join(mismatches))
          print(f"determinism proof ok: {len(baseline)} fixture(s) byte-identical across {oses}")
          PY

  py-recompile-gate:
    name: py recompile-equivalence gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/lib/android /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force 2>/dev/null || true
          df -h /
      - uses: actions/setup-python@v6
        id: setup-python
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: provision cpython 3.14 (pinned corpus interpreter)
        run: uv python install 3.14
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: export PYO3_PYTHON
        shell: bash
        run: echo "PYO3_PYTHON=${{ steps.setup-python.outputs.python-path }}" >> "$GITHUB_ENV"
      - name: build the disrobe cli the harness drives
        run: cargo build --release -p disrobe-cli --bin disrobe
      - name: per-code-object recompile-equivalence floor (>= 96.60% on the pinned 3.14 corpus)
        run: cargo test -p disrobe-pass-py-decompile --test arbitrary_recompile_gate -- --nocapture

  execution-differentials:
    name: execution differentials
    runs-on: ubuntu-latest
    env:
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@v6
      - name: free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/lib/android /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force 2>/dev/null || true
          df -h /
      - name: install lua5.4 and luajit
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends lua5.4 luajit
          lua5.4 -v
          luajit -v
      - name: install luau 0.725 (matches the committed decompile fixtures)
        run: |
          curl -fsSL -o luau-ubuntu.zip \
            https://github.com/luau-lang/luau/releases/download/0.725/luau-ubuntu.zip
          mkdir -p "$HOME/.local/bin"
          unzip -o luau-ubuntu.zip -d "$HOME/.local/bin"
          chmod +x "$HOME/.local/bin/luau" "$HOME/.local/bin/luau-compile"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/luau" --help >/dev/null 2>&1 || true
          "$HOME/.local/bin/luau-compile" --help >/dev/null 2>&1 || true
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: opcache
          tools: none
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: locate the opcache zend_extension the op_array emitter loads
        run: |
          ext_dir="$(php -r 'echo ini_get("extension_dir");')"
          dll="${ext_dir}/opcache.so"
          if [ ! -f "$dll" ]; then
            echo "opcache.so not found at ${dll}; the php op_array differential cannot emit without it" >&2
            ls -la "$ext_dir" || true
            exit 1
          fi
          echo "DZOA_OPCACHE_DLL=${dll}" >> "$GITHUB_ENV"
          echo "resolved opcache: ${dll}"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: wasmtime re-execution differential (recovered wasm runs identically to clean)
        run: cargo test -p disrobe-pass-wasm-deob --features sandbox -- --nocapture
      - name: lua interpreter re-execution differential
        run: cargo test -p disrobe-pass-lua --test ironbrew2_real_oracle -- --nocapture
      - name: luajit decompile re-execution differential
        run: cargo test -p disrobe-pass-lua --test luajit_decompile_oracle -- --nocapture
      - name: luau decompile re-execution differential
        run: cargo test -p disrobe-pass-lua --test luau_decompile_oracle -- --nocapture
      - name: ruby yarv recompile differential
        run: cargo test -p disrobe-pass-ruby --test yarv_recompile_oracle -- --nocapture
      - name: php op_array behavioral differential
        run: cargo test -p disrobe-pass-php --test oparray_behavioral -- --nocapture
      - name: php loader re-execution differential
        run: cargo test -p disrobe-pass-php --test loader_behavioral -- --nocapture
      - name: node re-execution differential for the js deobfuscator
        run: cargo test -p disrobe-pass-js-deob --test jsconfuser_node_oracle -- --nocapture
      - name: node packager carve checks
        run: cargo test -p disrobe-pass-js-deob --test node_sea_pkg_nexe --test real_node_packagers -- --nocapture
      - name: v8 code-serializer fixture differential
        run: cargo test -p disrobe-pass-js-deob --test v8_codeserializer_real -- --nocapture

  deny:
    name: deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.96.1
      - uses: taiki-e/install-action@cargo-deny
      - run: cargo deny --all-features check

  audit:
    name: audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.96.1
      - uses: taiki-e/install-action@cargo-deny
      - run: cargo deny --all-features check advisories

  typos:
    name: typos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: crate-ci/typos@master

  msrv:
    name: msrv
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        id: setup-python
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: Swatinem/rust-cache@v2
      - name: export PYO3_PYTHON
        run: echo "PYO3_PYTHON=${{ steps.setup-python.outputs.python-path }}" >> "$GITHUB_ENV"
      - run: cargo +1.95.0 check --workspace --all-features

  slim:
    name: slim (no-default-features)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        id: setup-python
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@1.96.1
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: export PYO3_PYTHON
        shell: bash
        run: echo "PYO3_PYTHON=${{ steps.setup-python.outputs.python-path }}" >> "$GITHUB_ENV"
      - name: slim compiles (lib, bin, tests)
        run: cargo check -p disrobe-cli --no-default-features --all-targets
      - name: slim is clippy-clean
        run: cargo clippy -p disrobe-cli --no-default-features --all-targets -- -D warnings -W unreachable_pub -W missing_debug_implementations -W unused
      - name: the graceful-bail seam fires when a pass is compiled out
        run: cargo test -p disrobe-cli --no-default-features --test slim_wasm_bail -- --nocapture
      - name: build the slim release binary
        run: cargo build -p disrobe-cli --release --no-default-features --bin disrobe
      - name: the wasm decompiler tree is absent from the slim binary
        shell: bash
        run: |
          set -euo pipefail
          tree="$(cargo tree -p disrobe-cli --no-default-features -e normal --prefix none | sort -u)"
          for crate in walrus wasm-tools wasmtime; do
            if printf '%s\n' "$tree" | grep -qE "(^| )${crate} v[0-9]"; then
              echo "structural gate failed: ${crate} is in the slim disrobe-cli dependency tree" >&2
              exit 1
            fi
            echo "ok: ${crate} absent from the slim disrobe-cli dependency tree"
          done
      - name: slim binary runs an always-on pass
        shell: bash
        run: |
          set -euo pipefail
          printf 'hello\x00 disrobe SLIM_SMOKE_TOKEN world' > slim-smoke.bin
          ./target/release/disrobe strings slim-smoke.bin | tee slim-smoke.out
          grep -q "SLIM_SMOKE_TOKEN" slim-smoke.out
