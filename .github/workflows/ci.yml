name: ci

on:
  push:
    branches: [main]
    tags: ['v[0-9]+.[0-9]+.[0-9]*']
  schedule:
    - cron: '0 6 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'schedule' && 'schedule' || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  PYO3_USE_ABI3_FORWARD_COMPATIBILITY: "1"

jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        id: setup-python
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@1.96.1
      - uses: Swatinem/rust-cache@v2
      - name: export PYO3_PYTHON
        shell: bash
        run: echo "PYO3_PYTHON=${{ steps.setup-python.outputs.python-path }}" >> "$GITHUB_ENV"
      - run: cargo check --workspace --all-targets --all-features

  fmt:
    name: fmt
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.96.1
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        id: setup-python
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@1.96.1
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: export PYO3_PYTHON
        run: echo "PYO3_PYTHON=${{ steps.setup-python.outputs.python-path }}" >> "$GITHUB_ENV"
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings -W unreachable_pub -W missing_debug_implementations -W unused

  graphs:
    name: graphs
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        id: setup-python
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@1.96.1
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "24.16.0"
      - name: install graph renderer test dependencies
        working-directory: xtask/graphgen
        run: corepack enable && pnpm install --frozen-lockfile
      - name: test graph renderer contracts
        working-directory: xtask/graphgen
        run: pnpm test
      - name: verify CI routing contract
        run: cargo test -p xtask --no-default-features --test ci_routing
      - name: export PYO3_PYTHON
        run: echo "PYO3_PYTHON=${{ steps.setup-python.outputs.python-path }}" >> "$GITHUB_ENV"
      - name: every generated artifact is byte-fresh (schemas, bindings, error docs, graphs, demo, card, plugins, evidence, metric markers, README stat cross-check)
        run: cargo run -p xtask -- regen --check
      - name: workspace is internally coherent (membership, internal versions, unused dependency declarations, unwired crates, embedded build paths, tests hidden behind a non-default feature)
        run: cargo run -p xtask -- health

  test:
    if: github.event_name == 'schedule' || github.ref_type == 'tag'
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    env:
      CARGO_PROFILE_TEST_DEBUG: "0"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.16.0"
      - name: provision TypeScript 6.0.3 for the emitted-artifact oracle
        shell: bash
        env:
          NODE_VERSION: "24.16.0"
          TYPESCRIPT_VERSION: "6.0.3"
        run: |
          set -euo pipefail
          actual_node_version="$(node --version | tr -d '\r')"
          if [ "$actual_node_version" != "v${NODE_VERSION}" ]; then
            echo "setup-node provisioned ${actual_node_version}, expected v${NODE_VERSION}"
            exit 1
          fi
          npm install --global --ignore-scripts --no-audit --no-fund "typescript@${TYPESCRIPT_VERSION}"
          actual_version="$(tsc --version | tr -d '\r')"
          if [ "$actual_version" != "Version ${TYPESCRIPT_VERSION}" ]; then
            echo "npm provisioned ${actual_version}, expected Version ${TYPESCRIPT_VERSION}"
            exit 1
          fi
      - name: provision Babel runtime 7.24.5 for the async identity oracle
        shell: bash
        env:
          BABEL_RUNTIME_VERSION: "7.24.5"
          BABEL_ASYNC_HELPER_SHA256: "e8c18da3624e6b7a7cf4720bcaa8d108709c22b1ab76e6e5f974587acb05d2c8"
        run: |
          set -euo pipefail
          runtime_root="$RUNNER_TEMP/disrobe-babel-runtime-${BABEL_RUNTIME_VERSION}"
          npm install --prefix "$runtime_root" --ignore-scripts --no-audit --no-fund "@babel/runtime@${BABEL_RUNTIME_VERSION}"
          actual_version="$(node -e 'const path=require("node:path"); process.stdout.write(require(path.join(process.argv[1], "node_modules", "@babel", "runtime", "package.json")).version)' "$runtime_root")"
          if [ "$actual_version" != "$BABEL_RUNTIME_VERSION" ]; then
            echo "npm provisioned @babel/runtime ${actual_version}, expected ${BABEL_RUNTIME_VERSION}"
            exit 1
          fi
          helper="$runtime_root/node_modules/@babel/runtime/helpers/asyncToGenerator.js"
          if [ ! -f "$helper" ]; then
            echo "the pinned Babel runtime did not contain asyncToGenerator.js"
            exit 1
          fi
          actual_sha256="$(node -e 'const crypto=require("node:crypto"); const fs=require("node:fs"); process.stdout.write(crypto.createHash("sha256").update(fs.readFileSync(process.argv[1])).digest("hex"))' "$helper")"
          if [ "$actual_sha256" != "$BABEL_ASYNC_HELPER_SHA256" ]; then
            echo "Babel async helper hash ${actual_sha256}, expected ${BABEL_ASYNC_HELPER_SHA256}"
            exit 1
          fi
          echo "DISROBE_BABEL_RUNTIME_ROOT=$runtime_root/node_modules" >> "$GITHUB_ENV"
      - name: free disk space (linux runner)
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/lib/android /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force 2>/dev/null || true
          df -h /
      - uses: actions/setup-python@v6
        id: setup-python
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: provision cpython 3.8-3.14 for the py-decompile construct matrix
        run: uv python install 3.8 3.9 3.10 3.11 3.12 3.13 3.14
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: provision Go 1.26.3 for graded Go fixtures
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.26.3'
          check-latest: false
          cache: false
      - name: require Go 1.26.3 for cross-architecture grading
        shell: bash
        env:
          GO_VERSION: '1.26.3'
        run: |
          set -euo pipefail
          if [ "$(go env GOVERSION)" != "go${GO_VERSION}" ]; then
            echo "setup-go did not provide Go ${GO_VERSION}"
            go version
            exit 1
          fi
          go version
          echo "DISROBE_REQUIRE_GO=1" >> "$GITHUB_ENV"
      - name: require gcc and clang for the native recompile-equivalence oracles
        shell: bash
        run: |
          set -euo pipefail
          demand() {
            probe="$1"
            var="$2"
            if ! command -v "$probe" >/dev/null 2>&1; then
              echo "$probe is expected on $RUNNER_OS but is not callable, so the tests behind $var would grade nothing"
              exit 1
            fi
            ("$probe" --version 2>&1 || true) | head -1
            echo "$var=1" >> "$GITHUB_ENV"
          }
          demand gcc DISROBE_REQUIRE_NATIVE_TOOLCHAIN
          demand clang DISROBE_REQUIRE_NATIVE_TOOLCHAIN
      - name: provision UPX and require the Linux auto-UPX differential tools
        if: runner.os == 'Linux'
        shell: bash
        env:
          UPX_VERSION: '5.1.1'
          UPX_SHA256: '1ff660454227861e00772f743f66b900072116b9dc24f6ee28b97cce88a7828a'
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/upx-${UPX_VERSION}-amd64_linux.tar.xz"
          curl --proto '=https' --tlsv1.2 --retry 5 --retry-connrefused --location --silent \
            --show-error --fail --output "$archive" \
            "https://github.com/upx/upx/releases/download/v${UPX_VERSION}/upx-${UPX_VERSION}-amd64_linux.tar.xz"
          printf '%s  %s\n' "$UPX_SHA256" "$archive" | sha256sum --check --strict
          stage="$RUNNER_TEMP/upx-${UPX_VERSION}"
          mkdir -p "$stage"
          tar -xJf "$archive" -C "$stage"
          upx_bin="$(find "$stage" -type f -name upx -perm -u+x -print -quit)"
          if [ -z "$upx_bin" ]; then
            echo "the pinned UPX archive contained no executable"
            exit 1
          fi
          "$upx_bin" --version
          dirname "$upx_bin" >> "$GITHUB_PATH"
          echo "DISROBE_REQUIRE_UPX=1" >> "$GITHUB_ENV"
      - name: export PYO3_PYTHON
        shell: bash
        run: echo "PYO3_PYTHON=${{ steps.setup-python.outputs.python-path }}" >> "$GITHUB_ENV"
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
      - name: provision the smt solver the mba corpus is graded against
        shell: bash
        env:
          Z3_VERSION: "4.16.0"
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            ZIP="z3-${Z3_VERSION}-x64-win.zip"
            curl --proto '=https' --tlsv1.2 --retry 5 --retry-connrefused --location --silent \
              --show-error --fail --output "$RUNNER_TEMP/$ZIP" \
              "https://github.com/Z3Prover/z3/releases/download/z3-${Z3_VERSION}/${ZIP}"
            unzip -q -o "$RUNNER_TEMP/$ZIP" -d "$RUNNER_TEMP/z3"
            BIN="$(dirname "$(find "$RUNNER_TEMP/z3" -name 'z3.exe' -type f | head -1)")"
            if [ -z "$BIN" ]; then
              echo "the pinned z3 archive carried no z3.exe, so the differentials would grade nothing"
              exit 1
            fi
            echo "$BIN" >> "$GITHUB_PATH"
            PROBE="$BIN/z3.exe"
          else
            python -m pip install --disable-pip-version-check "z3-solver==${Z3_VERSION}.0"
            SCRIPTS="$(python -c "import sysconfig; print(sysconfig.get_path('scripts'))")"
            echo "$SCRIPTS" >> "$GITHUB_PATH"
            PROBE="$SCRIPTS/z3"
          fi
          if [ ! -x "$PROBE" ]; then
            echo "no z3 executable at $PROBE; the mba equivalence differentials would grade nothing"
            ls -la "$(dirname "$PROBE")" | head -40
            exit 1
          fi
          "$PROBE" --version
          echo "DISROBE_REQUIRE_SOLVER=1" >> "$GITHUB_ENV"
      - name: require the committed packer fixtures so an absent one fails instead of skipping
        shell: bash
        run: |
          for pair in \
            corpus/native/packers/fsg/Hash.packed.fsg.exe \
            corpus/native/packers/nspack/hash.packed.nspack.exe \
            corpus/native/packers/petite/hello.exe; do
            if [ ! -f "$pair" ]; then
              echo "committed packer fixture missing from the checkout: $pair"
              exit 1
            fi
          done
          echo "DISROBE_REQUIRE_PACKER_FIXTURES=1" >> "$GITHUB_ENV"
      - name: provision erlang and elixir so the beam differentials run instead of returning early
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124
        with:
          otp-version: "27.3.4.15"
          elixir-version: "1.18.4"
          version-type: strict
      - name: require erlang so a beam differential fails instead of grading nothing
        shell: bash
        run: |
          for probe in erlc erl; do
            if ! command -v "$probe" >/dev/null 2>&1; then
              echo "$probe is not callable after provisioning, so the beam differentials would grade nothing"
              exit 1
            fi
          done
          expected_otp_version="27.3.4.15"
          otp_version="$(erl -noshell -eval 'Release = erlang:system_info(otp_release), {ok, Version} = file:read_file(filename:join([code:root_dir(), "releases", Release, "OTP_VERSION"])), io:format("~s", [string:trim(binary_to_list(Version))]), halt().')"
          if [ "$otp_version" != "$expected_otp_version" ]; then
            echo "setup-beam provisioned OTP $otp_version, expected exactly $expected_otp_version"
            exit 1
          fi
          echo "otp $otp_version"
          echo "DISROBE_REQUIRE_ERLANG=1" >> "$GITHUB_ENV"
      - name: require elixir 1.18.4, the release corpus/beam/MANIFEST.toml records for the committed beam
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v elixirc >/dev/null 2>&1; then
            echo "elixirc is not callable after provisioning, so the elixir recompile differential would grade nothing"
            exit 1
          fi
          expected_elixir_version="1.18.4"
          elixir_version="$(elixir -e 'IO.write(System.version())')"
          if [ "$elixir_version" != "$expected_elixir_version" ]; then
            echo "setup-beam provisioned Elixir $elixir_version, expected exactly $expected_elixir_version, which is the release corpus/beam/MANIFEST.toml records for Elixir.Hello.beam"
            exit 1
          fi
          echo "elixir $elixir_version"
          echo "DISROBE_REQUIRE_ELIXIR=1" >> "$GITHUB_ENV"
      - name: provision R so the serialization reader is graded against R instead of returning early
        uses: r-lib/actions/setup-r@d3c5be51b12e724e68f33216ca3c148b66d5f0b6
        with:
          r-version: "4.6.0"
          use-public-rspm: true
      - name: require R 4.6.0, the release corpus/r/MANIFEST.toml records for every committed object
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v Rscript >/dev/null 2>&1; then
            echo "Rscript is not callable after provisioning, so the R comparison would grade nothing"
            exit 1
          fi
          expected_r_version="4.6.0"
          r_version="$(Rscript -e 'cat(as.character(getRversion()))')"
          if [ "$r_version" != "$expected_r_version" ]; then
            echo "setup-r provisioned R $r_version, expected exactly $expected_r_version, which is the release corpus/r/MANIFEST.toml records for every file under corpus/r/objects"
            exit 1
          fi
          echo "r $r_version"
          echo "DISROBE_REQUIRE_R=1" >> "$GITHUB_ENV"
      - name: require XLMMacroDeobfuscator 0.2.7, the deobfuscator that grades the recovered XLM formulas
        shell: bash
        run: |
          set -euo pipefail
          expected_xlm_version="0.2.7"
          python -m pip install --disable-pip-version-check --upgrade setuptools
          python -m pip install --disable-pip-version-check "XLMMacroDeobfuscator==${expected_xlm_version}"
          xlm_version="$(python -c 'import importlib.metadata as m; print(m.version("XLMMacroDeobfuscator"))')"
          if [ "$xlm_version" != "$expected_xlm_version" ]; then
            echo "the interpreter carries XLMMacroDeobfuscator $xlm_version, expected exactly $expected_xlm_version, which is the release the XLM grader is pinned to"
            exit 1
          fi
          echo "xlmmacrodeobfuscator $xlm_version"
          echo "DISROBE_REQUIRE_XLM_REFERENCE=1" >> "$GITHUB_ENV"
      - name: require the interpreters and archivers this runner already carries, so an absent one fails instead of skipping
        shell: bash
        run: |
          demand() {
            probe="$1"
            var="$2"
            if ! command -v "$probe" >/dev/null 2>&1; then
              echo "$probe is expected on $RUNNER_OS but is not callable, so the tests behind $var would grade nothing"
              exit 1
            fi
            ("$probe" --version 2>&1 || true) | head -1
            echo "$var=1" >> "$GITHUB_ENV"
          }
          if ! command -v perl >/dev/null 2>&1; then
            echo "perl is expected on $RUNNER_OS but is not callable, so the op-tree tests behind DISROBE_REQUIRE_PERL would grade nothing"
            exit 1
          fi
          if ! perl -MB::Concise -e 'print $^V, qq(\n)'; then
            echo "perl is callable on $RUNNER_OS but its B::Concise module is not, so the op-tree differential would grade nothing"
            exit 1
          fi
          demand ruby DISROBE_REQUIRE_RUBY
          if [ "$RUNNER_OS" != "macOS" ]; then
            demand php DISROBE_REQUIRE_PHP
            seven=""
            seven_candidates=(7z 7za 7zz 7zr)
            if [ "$RUNNER_OS" = "Windows" ]; then
              seven_candidates+=("/c/Program Files/7-Zip/7z.exe" "/c/Program Files (x86)/7-Zip/7z.exe")
            fi
            for candidate in "${seven_candidates[@]}"; do
              [ -x "$candidate" ] || command -v "$candidate" >/dev/null 2>&1 || continue
              if ("$candidate" </dev/null 2>&1 || true) | grep -q "^7-Zip"; then
                if [ -x "$candidate" ]; then
                  seven="$candidate"
                else
                  seven="$(command -v "$candidate")"
                fi
                break
              fi
              echo "$candidate resolves here but does not run and name itself 7-Zip, so it cannot write the reference archives"
            done
            if [ -z "$seven" ]; then
              echo "no 7-zip executable on $RUNNER_OS, so the archive round-trips would grade nothing"
              exit 1
            fi
            if [ "$RUNNER_OS" = "Windows" ]; then
              dirname "$seven" >> "$GITHUB_PATH"
            fi
            echo "using $seven"
            echo "DISROBE_REQUIRE_SEVEN_ZIP=1" >> "$GITHUB_ENV"
          else
            echo "macOS carries no php and its 7-zip name is unconfirmed, so those two stay unset here and their tests announce what they did not grade"
          fi
          if [ "$RUNNER_OS" = "Windows" ]; then
            demand makecab DISROBE_REQUIRE_MAKECAB
          fi
      - name: provision the dotnet sdk the il-equivalence floors are measured with
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"
      - name: confirm the dotnet sdk is callable before the suite depends on it
        shell: bash
        run: dotnet --info
      - name: restore the pinned ilspy comparator before its floor runs
        shell: bash
        run: |
          dotnet tool restore --tool-manifest .config/dotnet-tools.json
          dotnet tool run ilspycmd --allow-roll-forward -- --version
      - name: provision the installer and elf toolchains so their round trips run instead of returning early
        shell: bash
        env:
          WIX_VERSION: "5.0.2"
        run: |
          demand() {
            probe="$1"
            var="$2"
            if ! command -v "$probe" >/dev/null 2>&1; then
              echo "$probe is not callable after provisioning, so the tests behind $var would grade nothing"
              exit 1
            fi
            ("$probe" --version 2>&1 || true) | head -1
            echo "$var=1" >> "$GITHUB_ENV"
          }
          if [ "$RUNNER_OS" = "Windows" ]; then
            dotnet tool install --global wix --version "$WIX_VERSION" \
              || dotnet tool update --global wix --version "$WIX_VERSION"
            export PATH="$HOME/.dotnet/tools:$PATH"
            echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"
            resolved_wix="$(wix --version 2>&1 | head -1 | tr -d '\r')"
            case "$resolved_wix" in
              "$WIX_VERSION"*) : ;;
              *)
                echo "wix resolved to '$resolved_wix' but this job pins $WIX_VERSION; a v7 toolset refuses to run until the Open Source Maintenance Fee licence is accepted, so the msi tests would fail during provisioning"
                exit 1
                ;;
            esac
            demand wix DISROBE_REQUIRE_WIX
          fi
          if [ "$RUNNER_OS" = "Linux" ]; then
            demand readelf DISROBE_REQUIRE_READELF
            sudo apt-get update
            sudo apt-get install -y nsis
            demand makensis DISROBE_REQUIRE_MAKENSIS
          fi
      - name: provision LLVM 18 for the aarch64 dense-switch CLI differential
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes clang-18 lld-18
          echo "/usr/lib/llvm-18/bin" >> "$GITHUB_PATH"
          export PATH="/usr/lib/llvm-18/bin:$PATH"
          clang --version
          ld.lld --version
          clang --target=aarch64-unknown-linux-gnu -x c -c -o /dev/null - <<< 'int dense_switch_probe(void) { return 0; }'
      - name: elixir recompile differential, printing the graded export count
        run: cargo test -p disrobe-pass-beam --test elixir_source_recover -- --nocapture
      - name: R serialization differential, printing the graded object count
        run: cargo test -p disrobe-pass-scriptlang --test real_r_reference_grade -- --nocapture
      - name: XLM formula differential against an independent deobfuscator, printing the graded cell count
        run: cargo test -p disrobe-pass-shell --test xlm_independent_reference -- --nocapture
      - run: cargo test --workspace --all-features --no-fail-fast
        env:
          DISROBE_TYPEREC_CC: ${{ matrix.os != 'ubuntu-latest' && 'optional' || '' }}
      - name: stage this OS leg's cross-platform determinism hash file
        shell: bash
        run: |
          set -euo pipefail
          test -f target/determinism-hashes.txt
          cp target/determinism-hashes.txt "target/determinism-hashes-${{ matrix.os }}.txt"
          cat "target/determinism-hashes-${{ matrix.os }}.txt"
      - uses: actions/upload-artifact@v7
        with:
          name: determinism-hashes-${{ matrix.os }}
          path: target/determinism-hashes-${{ matrix.os }}.txt
      - name: batch worker-pool determinism (--jobs 1 vs --jobs 4, same fixtures, one leg only)
        if: matrix.os == 'ubuntu-latest'
        run: cargo test -p disrobe-cli --test determinism_cross_platform -- --ignored batch_jobs_does_not_change_recovered_output --nocapture
      - name: aarch64 decompiler recompile-execution differential (one leg only)
        if: matrix.os == 'ubuntu-latest'
        run: cargo test -p disrobe-pass-native --test aarch64_recovery_grade -- --ignored --nocapture
      - name: aarch64 dense-switch CLI differential (one explicitly provisioned leg)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p disrobe-cli --test native_aarch64_dense_switch -- --nocapture

  beam-otp28-long-atu8:
    if: github.event_name == 'schedule' || github.ref_type == 'tag'
    name: beam OTP 28 long AtU8
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_PROFILE_TEST_DEBUG: "0"
      DISROBE_REQUIRE_ERLANG: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.96.1
      - uses: Swatinem/rust-cache@v2
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124
        with:
          otp-version: "28.5.0.3"
          version-type: strict
      - name: require exact OTP 28.5.0.3 for the long AtU8 gate
        shell: bash
        run: |
          set -euo pipefail
          for probe in erlc erl; do
            if ! command -v "$probe" >/dev/null 2>&1; then
              echo "$probe is not callable after OTP 28 provisioning"
              exit 1
            fi
          done
          expected_otp_version="28.5.0.3"
          otp_version="$(erl -noshell -eval 'Release = erlang:system_info(otp_release), {ok, Version} = file:read_file(filename:join([code:root_dir(), "releases", Release, "OTP_VERSION"])), io:format("~s", [string:trim(binary_to_list(Version))]), halt().')"
          if [ "$otp_version" != "$expected_otp_version" ]; then
            echo "setup-beam provisioned OTP $otp_version, expected exactly $expected_otp_version"
            exit 1
          fi
          echo "otp $otp_version"
      - name: OTP 28 compiler and beam_lib long-AtU8 integration gate
        run: cargo test -p disrobe-pass-beam --test otp28_long_atu8 -- --ignored --nocapture

  determinism-cross-platform:
    if: github.event_name == 'schedule' || github.ref_type == 'tag'
    name: determinism cross-platform proof
    needs: [test]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v6
        with:
          pattern: determinism-hashes-*
          merge-multiple: true
          path: determinism-hashes
      - name: assert identical input yields byte-identical output on every OS leg
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob
          import sys

          files = sorted(glob.glob("determinism-hashes/determinism-hashes-*.txt"))
          if len(files) < 2:
              sys.exit(f"expected a hash file from every OS leg, found {files}")

          by_os = {}
          for path in files:
              os_name = path.rsplit("determinism-hashes-", 1)[-1]
              if os_name.endswith(".txt"):
                  os_name = os_name[:-4]
              entries = {}
              for line in open(path):
                  line = line.strip()
                  if not line:
                      continue
                  name, digest = line.rsplit(" ", 1)
                  entries[name] = digest
              by_os[os_name] = entries

          oses = sorted(by_os)
          baseline_os = oses[0]
          baseline = by_os[baseline_os]
          mismatches = []
          for os_name in oses[1:]:
              entries = by_os[os_name]
              if entries.keys() != baseline.keys():
                  mismatches.append(
                      f"{os_name} vs {baseline_os}: fixture set differs "
                      f"({sorted(entries)} vs {sorted(baseline)})"
                  )
                  continue
              for fixture, digest in baseline.items():
                  other = entries[fixture]
                  if other != digest:
                      mismatches.append(
                          f"{fixture}: {baseline_os}={digest} != {os_name}={other}"
                      )

          if mismatches:
              sys.exit("cross-platform determinism violated:\n" + "\n".join(mismatches))
          print(f"determinism proof ok: {len(baseline)} fixture(s) byte-identical across {oses}")
          PY

  py-recompile-gate:
    if: github.event_name == 'schedule' || github.ref_type == 'tag'
    name: py recompile-equivalence gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/lib/android /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force 2>/dev/null || true
          df -h /
      - uses: actions/setup-python@v6
        id: setup-python
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: provision cpython 3.14.5 (pinned corpus interpreter)
        run: uv python install 3.14.5
      - name: provision cpython 3.15.0b4 (the prerelease the 3.15 band bar names)
        run: uv python install 3.15.0b4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: export PYO3_PYTHON
        shell: bash
        run: echo "PYO3_PYTHON=${{ steps.setup-python.outputs.python-path }}" >> "$GITHUB_ENV"
      - name: build the disrobe cli the harness drives
        run: cargo build --release -p disrobe-cli --bin disrobe
      - name: per-code-object recompile-equivalence floor (>= 96.60% on the pinned 3.14 corpus)
        run: cargo test -p disrobe-pass-py-decompile --test arbitrary_recompile_gate -- --nocapture
      - name: per-code-object recompile-equivalence floor (>= 95.97% on the 3.15 band)
        env:
          DISROBE_REQUIRE_PY_315: "1"
        run: cargo test -p disrobe-pass-py-decompile --test arbitrary_recompile_gate_315 -- --nocapture

