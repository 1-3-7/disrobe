  execution-differentials:
    if: github.event_name == 'schedule' || github.ref_type == 'tag'
    name: execution differentials
    runs-on: ubuntu-latest
    env:
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@v6
      - name: free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/lib/android /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force 2>/dev/null || true
          df -h /
      - name: install lua5.4 and luajit
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends lua5.4 luajit
          lua5.4 -v
          luajit -v
      - name: install C11 compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential
          cc --version
      - name: install luau 0.725 (matches the committed decompile fixtures)
        run: |
          curl -fsSL -o luau-ubuntu.zip \
            https://github.com/luau-lang/luau/releases/download/0.725/luau-ubuntu.zip
          mkdir -p "$HOME/.local/bin"
          unzip -o luau-ubuntu.zip -d "$HOME/.local/bin"
          chmod +x "$HOME/.local/bin/luau" "$HOME/.local/bin/luau-compile"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/luau" --help >/dev/null 2>&1 || true
          "$HOME/.local/bin/luau-compile" --help >/dev/null 2>&1 || true
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
      - name: provision pinned mruby 3.3.0
        shell: bash
        env:
          MRUBY_COMMIT: "32279e4128527bab4c961854b9cce727a060abea"
          MRUBY_ARCHIVE_SHA256: "c15bf94a6103380034b5617d24649790b09ac68a2477024f6990b2255e3995d3"
          MRUBY_VERSION: "3.3.0"
          MRUBY_BANNER: "mruby 3.3.0 (2024-02-14)"
        run: |
          set -euo pipefail

          archive="${RUNNER_TEMP}/mruby-${MRUBY_COMMIT}.tar.gz"
          source_dir="${RUNNER_TEMP}/mruby-${MRUBY_COMMIT}"
          prefix="${RUNNER_TEMP}/mruby-${MRUBY_VERSION}"

          curl \
            --fail \
            --show-error \
            --location \
            --retry 5 \
            --retry-all-errors \
            --proto '=https' \
            --tlsv1.2 \
            --output "$archive" \
            "https://codeload.github.com/mruby/mruby/tar.gz/${MRUBY_COMMIT}"

          printf '%s  %s\n' "$MRUBY_ARCHIVE_SHA256" "$archive" |
            sha256sum --check --strict -

          mkdir -p "$source_dir" "$prefix/bin"
          tar \
            --extract \
            --gzip \
            --file "$archive" \
            --directory "$source_dir" \
            --strip-components=1 \
            --no-same-owner \
            --no-same-permissions

          (
            cd "$source_dir"
            MRUBY_CONFIG=default ruby -S rake all
          )

          install -m 0755 "$source_dir/build/host/bin/mrbc" "$prefix/bin/mrbc"
          install -m 0755 "$source_dir/build/host/bin/mruby" "$prefix/bin/mruby"

          mrbc_banner="$("$prefix/bin/mrbc" --version)"
          mruby_banner="$("$prefix/bin/mruby" --version)"

          if [[ "$mrbc_banner" != "$MRUBY_BANNER" ]]; then
            printf 'mrbc reported %q, expected %q\n' "$mrbc_banner" "$MRUBY_BANNER" >&2
            exit 1
          fi
          if [[ "$mruby_banner" != "$MRUBY_BANNER" ]]; then
            printf 'mruby reported %q, expected %q\n' "$mruby_banner" "$MRUBY_BANNER" >&2
            exit 1
          fi

          printf '%s\n' "$prefix/bin" >> "$GITHUB_PATH"
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: opcache
          tools: none
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: locate the opcache zend_extension the op_array emitter loads
        run: |
          ext_dir="$(php -r 'echo ini_get("extension_dir");')"
          dll="${ext_dir}/opcache.so"
          if [ ! -f "$dll" ]; then
            echo "opcache.so not found at ${dll}; the php op_array differential cannot emit without it" >&2
            ls -la "$ext_dir" || true
            exit 1
          fi
          echo "DZOA_OPCACHE_DLL=${dll}" >> "$GITHUB_ENV"
          echo "resolved opcache: ${dll}"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: wasmtime re-execution differential (recovered wasm runs identically to clean)
        run: cargo test -p disrobe-pass-wasm-deob --features sandbox -- --nocapture
      - name: lua interpreter re-execution differential
        run: cargo test -p disrobe-pass-lua --test ironbrew2_real_oracle -- --nocapture
      - name: luajit decompile re-execution differential
        run: cargo test -p disrobe-pass-lua --test luajit_decompile_oracle -- --nocapture
      - name: luau decompile re-execution differential
        run: cargo test -p disrobe-pass-lua --test luau_decompile_oracle -- --nocapture
      - name: ruby yarv recompile differential
        run: cargo test -p disrobe-pass-ruby --test yarv_recompile_oracle -- --nocapture
      - name: mruby 3.3.0 recompile and execution differential
        env:
          DISROBE_REQUIRE_MRUBY: "1"
        run: cargo test -p disrobe-pass-ruby --test mruby_recompile_oracle -- --nocapture
      - name: php op_array behavioral differential
        env:
          DISROBE_REQUIRE_PHP: "1"
          DISROBE_REQUIRE_PHP_OPCACHE: "1"
        run: cargo test -p disrobe-pass-php --test oparray_behavioral -- --nocapture
      - name: php loader re-execution differential
        run: cargo test -p disrobe-pass-php --test loader_behavioral -- --nocapture
      - name: node re-execution differential for the js deobfuscator
        run: cargo test -p disrobe-pass-js-deob --test jsconfuser_node_oracle -- --nocapture
      - name: node packager carve checks
        run: cargo test -p disrobe-pass-js-deob --test node_sea_pkg_nexe --test real_node_packagers -- --nocapture
      - name: v8 code-serializer fixture differential
        run: cargo test -p disrobe-pass-js-deob --test v8_codeserializer_real -- --nocapture

  deny:
    name: deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.96.1
      - uses: taiki-e/install-action@cargo-deny
      - run: cargo deny --all-features check

  typos:
    name: typos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: crate-ci/typos@master

  hygiene:
    name: source hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: reject committed scratch scaffolding
        shell: bash
        run: |
          files=$(git ls-files -- crates xtask | grep '\.rs$')
          named=$(printf '%s\n' "$files" | grep -E '_scratch\.rs$' || true)
          if [ -n "$named" ]; then
            echo "scratch scaffolding is committed; promote it to a named permanent target that asserts something, or delete it:"
            printf '%s\n' "$named"
            exit 1
          fi
          helpers=$(printf '%s\n' "$files" | xargs grep -nE '^[[:space:]]*(pub )?(async )?fn (scratch_dump|probe_dump)' || true)
          if [ -n "$helpers" ]; then
            echo "a throwaway dump helper is committed; move it out of the tree or make it assert something:"
            printf '%s\n' "$helpers"
            exit 1
          fi
          echo "no committed scratch scaffolding"
      - name: source comment count stays at or below the string-literal baseline
        shell: bash
        run: |
          baseline=40
          files=$(git ls-files -- crates xtask | grep '\.rs$')
          count=$(printf '%s\n' "$files" | xargs grep -nE '^[[:space:]]*(//|/\*)' | wc -l)
          echo "line-leading comment-shaped lines: $count (baseline $baseline)"
          if [ "$count" -gt "$baseline" ]; then
            echo "this tree carries no source comments. Every one of the $baseline baseline matches is comment-shaped text INSIDE a string literal: embedded Java, Go build pragmas, YARA rule fixtures, emitted IDE plugin templates, the JS fixture text in the js-deob preset-env tests, and the js-deob hazard fixtures whose whole point is that a match sitting in a comment must not be rewritten."
            echo "the count rose, so a real comment was added. Full list:"
            printf '%s\n' "$files" | xargs grep -nE '^[[:space:]]*(//|/\*)'
            exit 1
          fi
          if [ "$count" -lt "$baseline" ]; then
            echo "the count fell to $count, which is an improvement; set baseline=$count in this workflow so it keeps ratcheting down"
            exit 1
          fi
          echo "comment count matches the baseline exactly"

  msrv:
    name: msrv
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        id: setup-python
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: Swatinem/rust-cache@v2
      - name: export PYO3_PYTHON
        run: echo "PYO3_PYTHON=${{ steps.setup-python.outputs.python-path }}" >> "$GITHUB_ENV"
      - run: cargo +1.95.0 check --workspace --all-features

  slim:
    name: slim (no-default-features)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        id: setup-python
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@1.96.1
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: export PYO3_PYTHON
        shell: bash
        run: echo "PYO3_PYTHON=${{ steps.setup-python.outputs.python-path }}" >> "$GITHUB_ENV"
      - name: slim compiles (lib, bin, tests)
        run: cargo check -p disrobe-cli --no-default-features --all-targets
      - name: slim is clippy-clean
        run: cargo clippy -p disrobe-cli --no-default-features --all-targets -- -D warnings -W unreachable_pub -W missing_debug_implementations -W unused
      - name: the graceful-bail seam fires when a pass is compiled out
        run: cargo test -p disrobe-cli --no-default-features --test slim_wasm_bail -- --nocapture
      - name: build the slim release binary
        run: cargo build -p disrobe-cli --release --no-default-features --bin disrobe
      - name: the wasm decompiler tree is absent from the slim binary
        shell: bash
        run: |
          set -euo pipefail
          tree="$(cargo tree -p disrobe-cli --no-default-features -e normal --prefix none | sort -u)"
          for crate in walrus wasm-tools wasmtime; do
            if printf '%s\n' "$tree" | grep -qE "(^| )${crate} v[0-9]"; then
              echo "structural gate failed: ${crate} is in the slim disrobe-cli dependency tree" >&2
              exit 1
            fi
            echo "ok: ${crate} absent from the slim disrobe-cli dependency tree"
          done
      - name: slim binary runs an always-on pass
        shell: bash
        run: |
          set -euo pipefail
          printf 'hello\x00 disrobe SLIM_SMOKE_TOKEN world' > slim-smoke.bin
          ./target/release/disrobe strings slim-smoke.bin | tee slim-smoke.out
          grep -q "SLIM_SMOKE_TOKEN" slim-smoke.out
