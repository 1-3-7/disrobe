name: native gcc oracle

on:
  push:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'push' && github.ref_type == 'branch' && github.ref != 'refs/heads/main' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'push' && github.ref_type == 'branch' && github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  gcc-o0-frame-reload:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with:
          toolchain: 1.96.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - name: install gcc 13
        run: |
          sudo apt-get update
          sudo apt-get install --yes gcc-13
          gcc-13 --version
      - name: grade gcc frame-reload return classification
        env:
          DISROBE_REQUIRE_NATIVE_TOOLCHAIN: "1"
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/native-gcc-oracle.log"
          CARGO_TERM_COLOR=never cargo test -p disrobe-pass-native --test pseudo_c_leaf_oracle --all-features -- --exact gcc_o0_frame_reload_compare_returns_integer --nocapture 2>&1 | tee "$log"
          grep -F "test result: ok. 1 passed" "$log"
          if grep -qiE '^(SKIP|skip[: ]|skipping)' "$log"; then
            echo "the gcc frame-reload case printed a skip line, so it did not grade:" >&2
            grep -iE '^(SKIP|skip[: ]|skipping)' "$log" >&2
            exit 1
          fi
