name: evidence

on:
  workflow_dispatch:
  schedule:
    - cron: '0 7 * * 1'
  push:
    branches: [main]
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'evidence/**'
      - 'corpus/**'
      - 'xtask/src/evidence.rs'
      - 'benches/head-to-head/**'
      - 'crates/disrobe-core/**'
      - 'crates/disrobe-pass-jvm/**'
      - 'crates/disrobe-pass-pickle/**'
      - '.github/workflows/evidence.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"

jobs:
  apk-jadx-cfr:
    name: head-to-head (apk vs jadx + cfr)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: install competitors (jadx + cfr)
        run: bash evidence/competitors/install-linux.sh --only apk
      - name: assert oracle + competitors present (skip == hard fail)
        run: |
          command -v javac
          command -v jadx
          test -f evidence/competitors/jars/cfr.jar
      - name: verify committed apk head-to-head measurement
        run: cargo run --locked -p disrobe-bench-head-to-head -- --check --only apk-jadx-cfr
      - name: upload verified apk measurement
        uses: actions/upload-artifact@v4
        with:
          name: evidence-apk-jadx-cfr
          path: evidence/results/measured/apk-jadx-cfr.json
          if-no-files-found: error

  frisk-apkleaks:
    name: head-to-head (frisk vs apkleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: install competitors (apkleaks + jadx)
        run: |
          bash evidence/competitors/install-linux.sh --only frisk
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: assert competitors present (skip == hard fail)
        run: |
          command -v jadx
          python3 -m pip show apkleaks
      - name: run frisk head-to-head
        run: cargo run -p disrobe-bench-head-to-head
      - name: assert apkleaks was scored and disrobe leads (no silent skip)
        run: |
          python3 - <<'PY'
          import json
          d = json.load(open("evidence/results/measured/frisk-apkleaks.json"))
          assert d["status"] == "ok", d
          tools = {t["name"]: t for t in d["tools"]}
          apkleaks = [t for n, t in tools.items() if n.startswith("apkleaks")]
          assert apkleaks and apkleaks[0]["status"] == "ok", f"apkleaks not scored: {apkleaks}"
          dis = [t for n, t in tools.items() if n.startswith("disrobe")][0]
          print("frisk head-to-head:", [(t["name"], t["display"]) for t in d["tools"]])
          assert dis["value"] >= apkleaks[0]["value"] - 1e-9, "disrobe frisk trails apkleaks"
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: evidence-frisk-apkleaks
          path: evidence/results/measured/frisk-apkleaks.json
          if-no-files-found: error

  gate-harvest:
    name: gate-test harvest (committed corpora)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: run gate harvest (committed corpora only)
        run: cargo run -p disrobe-bench-head-to-head
      - name: assert committed-corpus gates are scored (no silent skip)
        run: |
          python3 - <<'PY'
          import json
          d = json.load(open("evidence/results/measured/gate-harvest.json"))
          gates = {g["id"]: g for g in d["gates"]}
          for gid in ("frisk-planted-recall", "pickle-corpus-coverage"):
              g = gates[gid]
              assert g["status"] == "ok", f"{gid} skipped in CI: {g}"
              print(gid, "->", g["display"])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: evidence-gate-harvest
          path: evidence/results/measured/gate-harvest.json
          if-no-files-found: error

  rollup:
    name: rollup + drift gate
    needs: [apk-jadx-cfr, frisk-apkleaks, gate-harvest]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: stage producer artifacts for validation
        uses: actions/download-artifact@v4
        with:
          pattern: evidence-*
          merge-multiple: false
          path: ci-measured-staging
      - name: require exactly the three producer payloads
        shell: bash
        run: |
          set -euo pipefail
          expected=(
            ci-measured-staging/evidence-apk-jadx-cfr/apk-jadx-cfr.json
            ci-measured-staging/evidence-frisk-apkleaks/frisk-apkleaks.json
            ci-measured-staging/evidence-gate-harvest/gate-harvest.json
          )
          mapfile -t actual < <(find ci-measured-staging -type f -print | sort)
          if [ "${#actual[@]}" -ne "${#expected[@]}" ]; then
            printf 'expected exactly three producer payloads, found %s\n' "${#actual[@]}"
            printf 'found: %s\n' "${actual[@]}"
            exit 1
          fi
          for index in "${!expected[@]}"; do
            if [ "${actual[$index]}" != "${expected[$index]}" ]; then
              printf 'expected payload %s, found %s\n' "${expected[$index]}" "${actual[$index]}"
              exit 1
            fi
          done
          mkdir -p ci-measured
          for source in "${expected[@]}"; do
            if [ ! -s "$source" ]; then
              printf 'producer payload is empty: %s\n' "$source"
              exit 1
            fi
            python3 -m json.tool "$source" >/dev/null
            name="${source##*/}"
            cp -- "$source" "ci-measured/$name"
            cp -- "$source" "evidence/results/measured/$name"
          done
      - name: reject measured-data drift from producer jobs
        run: |
          git diff --exit-code -- \
            evidence/results/measured/apk-jadx-cfr.json \
            evidence/results/measured/frisk-apkleaks.json \
            evidence/results/measured/gate-harvest.json
      - name: verify the committed report against measured data
        run: cargo run --locked -p xtask -- evidence --check
      - uses: actions/upload-artifact@v4
        with:
          name: evidence-report
          path: |
            evidence/results/EVIDENCE.md
            evidence/results/index.json
            evidence/results/measured
            ci-measured
