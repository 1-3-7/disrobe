name: fuzz

on:
  schedule:
    - cron: '0 3 * * 1'  # weekly, monday 03:00 UTC
  workflow_dispatch:
    inputs:
      duration:
        description: 'seconds per fuzz target'
        required: false
        default: '300'

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: 0
  MEMORY_LIMIT_MEGABYTES: 2048
  PER_INPUT_TIMEOUT_SECONDS: 25

jobs:
  seed-reach:
    name: committed seed reach
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SEED_REPLAY_MEMORY_LIMIT_BYTES: 2147483648
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - name: require the Linux memory limiter
        run: command -v prlimit
      - name: replay the semantic seed contract
        run: cargo run --manifest-path fuzz/Cargo.toml --bin seed_replay -- --memory-limit-bytes "$SEED_REPLAY_MEMORY_LIMIT_BYTES" --check xtask/data/fuzz_seed_reach.json

  campaign:
    name: campaign (${{ matrix.target }})
    needs: seed-reach
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - chain_driver
          - chain_spec_parser
          - hex_decode
          - custom_base64
          - container_dispatch
          - native_formats
          - python_bytecode
          - dex_jvm_classfile
          - cil_metadata
          - wasm_sections
          - dr_envelope
          - nested_dispatch
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with:
          toolchain: nightly
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - name: install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: seed the corpus from committed samples
        run: cargo run -p xtask -- fuzz-seeds --target ${{ matrix.target }}
      - name: sustained search under the address sanitizer, with crash deduplication by stack hash
        env:
          DURATION: ${{ github.event.inputs.duration || '300' }}
        run: |
          cargo +nightly fuzz run ${{ matrix.target }} -- \
            -fork=1 \
            -max_total_time="$DURATION" \
            -rss_limit_mb="$MEMORY_LIMIT_MEGABYTES" \
            -timeout="$PER_INPUT_TIMEOUT_SECONDS"
      - name: minimize any crash the search found
        if: failure()
        run: |
          for artifact in fuzz/artifacts/${{ matrix.target }}/*; do
            [ -f "$artifact" ] || continue
            cargo +nightly fuzz tmin ${{ matrix.target }} "$artifact" || true
          done
      - name: upload artifacts on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}/
