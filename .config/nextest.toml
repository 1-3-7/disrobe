nextest-version = "0.9.115"

[profile.pre-push]
default-filter = '''
not (
  binary_id(=xtask::python_bindings_e2e)
  | binary_id(=disrobe-taint::graded_corpus)
  | binary_id(=disrobe-pass-dotnet::default_feature_boundary)
  | binary_id(=disrobe-pass-nativelang::body_recovery_oracle)
  | binary_id(=disrobe-pass-nativelang::body_equivalence)
  | binary_id(=disrobe-pass-nativelang::oracle)
  | binary_id(=disrobe-pass-nativelang::dwarf_dewall)
  | (package(disrobe-pass-js-deob) & binary(it) & test(/^obfuscator_io_e2e::/))
  | (package(disrobe-pass-js-deob) & binary(it) & test(/^obfuscator_io_differential_oracle::/))
  | (package(disrobe-pass-js-deob) & binary(it) & test(/^reeval_corpus_oracle::/))
)
'''
retries = 0
test-threads = 12
slow-timeout = { period = "30s", terminate-after = 4, grace-period = "10s" }
leak-timeout = { period = "2s", result = "fail" }
failure-output = "immediate-final"
success-output = "never"
status-level = "fail"
final-status-level = "fail"

[profile.push-graders]
inherits = "pre-push"
default-filter = "all()"
retries = 0

[profile.push-graders.junit]
path = "junit.xml"

[test-groups]
external-toolchain = { max-threads = 2 }
jvm-toolchain = { max-threads = 6 }
process-global = { max-threads = 1 }

[[profile.pre-push.overrides]]
filter = 'package(disrobe-pass-native) & binary(formats) & test(/^rust_auditable_sbom::/)'
test-group = 'process-global'
slow-timeout = { period = "120s", terminate-after = 5, grace-period = "10s" }

[[profile.pre-push.overrides]]
filter = 'package(disrobe-pass-native) | package(disrobe-pass-py-decompile) | package(disrobe-pass-dotnet) | package(disrobe-pass-jvm) | package(disrobe-pass-beam) | package(disrobe-pass-pyinstaller) | package(disrobe-pass-js-deob)'
test-group = 'external-toolchain'
slow-timeout = { period = "120s", terminate-after = 5, grace-period = "10s" }

[[profile.pre-push.overrides]]
filter = 'package(disrobe-mba) | package(disrobe-cli) | package(disrobe-binfmt)'
slow-timeout = { period = "120s", terminate-after = 5, grace-period = "10s" }

[[profile.default.overrides]]
filter = 'package(disrobe-pass-jvm) & (binary(oracles) | binary(lifting) | binary(protectors))'
test-group = 'jvm-toolchain'
