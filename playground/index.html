    <title>disrobe</title>
    <script>
      (function () {
        try {
          var stored = window.localStorage.getItem("disrobe.theme");
          var theme =
            stored === "slate" || stored === "zinc" || stored === "midnight" ? stored : "zinc";
          document.documentElement.setAttribute("data-theme", theme);
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "zinc");
        }
      })();
    </script>
