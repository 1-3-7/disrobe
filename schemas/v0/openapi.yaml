openapi: '3.1.0'
info:
  title: disrobe daemon
  version: 0.1.0
  description: |
    HTTP API exposed by `disrobe serve`. All analysis is performed server-side;
    results are written to the output directory and referenced by hash.

servers:
  - url: http://localhost:7374
    description: default local daemon

paths:
  /health:
    get:
      operationId: health
      summary: Liveness check
      responses:
        '200':
          description: daemon is running
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /passes:
    get:
      operationId: listPasses
      summary: List registered passes
      responses:
        '200':
          description: pass list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PassDescriptor'

  /analyze:
    post:
      operationId: analyze
      summary: Submit a file for analysis
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnalyzeRequest'
      responses:
        '202':
          description: analysis queued; poll /jobs/{id} or connect via WebSocket
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobAccepted'
        '422':
          $ref: '#/components/responses/ValidationError'

  /jobs/{id}:
    get:
      operationId: getJob
      summary: Poll job status
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobStatus'
        '404':
          $ref: '#/components/responses/NotFound'

  /artifacts/{hash}:
    get:
      operationId: getArtifact
      summary: Retrieve a .dr envelope by BLAKE3 hash
      parameters:
        - name: hash
          in: path
          required: true
          schema:
            type: string
            description: hex-encoded BLAKE3 hash
      responses:
        '200':
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '404':
          $ref: '#/components/responses/NotFound'

components:
  schemas:
    HealthResponse:
      type: object
      required: [status, version]
      properties:
        status:
          type: string
          enum: [ok]
        version:
          type: string

    PassDescriptor:
      type: object
      required: [id, version, requires_rung, produces_rung]
      properties:
        id:
          type: string
          example: pyarmor-unpack
        version:
          type: string
          example: 0.1.0
        requires_rung:
          type: integer
          minimum: 0
          maximum: 4
        produces_rung:
          type: integer
          minimum: 0
          maximum: 4
        requires_capabilities:
          type: integer
          format: int64
        produces_capabilities:
          type: integer
          format: int64

    AnalyzeRequest:
      type: object
      required: [input_path]
      properties:
        input_path:
          type: string
          description: absolute path to the file to analyze
        pass:
          type: string
          description: pass id to run; omit for auto-detection
        emit:
          type: array
          items:
            type: string
            enum: [source, disasm, ast, cfg, ir, manifest, sourcemap, symbols, strings, imports, signatures, report]
          default: [source, report]
        out_dir:
          type: string
          description: output directory; defaults to a temp dir
        llm:
          type: boolean
          default: false

    JobAccepted:
      type: object
      required: [job_id]
      properties:
        job_id:
          type: string
          format: uuid
        ws_url:
          type: string
          description: WebSocket URL for streaming events

    JobStatus:
      type: object
      required: [job_id, state]
      properties:
        job_id:
          type: string
          format: uuid
        state:
          type: string
          enum: [queued, running, complete, failed]
        error_code:
          type: string
          description: DR-*-NNNN error code if state is failed
        artifacts:
          type: array
          items:
            type: object
            required: [hash, emit_kind]
            properties:
              hash:
                type: string
              emit_kind:
                type: string

  responses:
    ValidationError:
      description: request validation failed
      content:
        application/json:
          schema:
            type: object
            required: [error]
            properties:
              error:
                type: string
    NotFound:
      description: resource not found
