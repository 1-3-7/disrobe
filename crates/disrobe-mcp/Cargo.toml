[package]
name = "disrobe-mcp"
description = "Model Context Protocol companion for `disrobe`: exposes envelope verification, symbol-rename recording, annotation-sidecar regeneration, and provenance-map lookup as MCP tools over stdio."
version.workspace = true
readme.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords = ["mcp", "deobfuscator", "decompiler", "reverse-engineering", "rmcp"]
categories = ["development-tools", "command-line-utilities"]

[lints]
workspace = true

[features]
default = ["full"]
full = ["auto", "js", "wasm", "php", "ruby", "shell", "mobile", "lua", "swift", "jvm", "dotnet", "go", "beam", "as3", "nativelang", "scriptlang"]
auto = [
    "dep:disrobe-passes",
    "disrobe-passes/pyarmor",
    "disrobe-passes/native",
    "disrobe-passes/py-deob",
    "disrobe-passes/container",
    "disrobe-passes/sourcedefender",
    "disrobe-passes/pyfreeze",
    "disrobe-passes/nuitka",
    "disrobe-passes/py-disasm",
    "disrobe-passes/py-decompile",
    "disrobe-passes/pyinstaller",
    "disrobe-passes/pickle",
]

js = ["auto", "disrobe-passes/js"]
wasm = ["auto", "disrobe-passes/wasm", "dep:disrobe-pass-wasm-deob"]
php = ["auto", "disrobe-passes/php"]
ruby = ["auto", "disrobe-passes/ruby"]
shell = ["auto", "disrobe-passes/shell"]
mobile = ["auto", "disrobe-passes/mobile"]
lua = ["auto", "disrobe-passes/lua"]
swift = ["auto", "disrobe-passes/swift"]
jvm = ["auto", "disrobe-passes/jvm"]
dotnet = ["auto", "disrobe-passes/dotnet"]
go = ["auto", "disrobe-passes/go"]
beam = ["auto", "disrobe-passes/beam"]
as3 = ["auto", "disrobe-passes/as3"]
nativelang = ["auto", "disrobe-passes/nativelang"]
scriptlang = ["auto", "disrobe-passes/scriptlang"]

[dependencies]
disrobe-core = { workspace = true }
disrobe-ir = { workspace = true }
disrobe-llm-metadata = { workspace = true }
disrobe-binfmt = { workspace = true }
disrobe-pass-native = { workspace = true }
disrobe-pass-wasm-deob = { workspace = true, optional = true }
disrobe-query = { workspace = true }
disrobe-passes = { workspace = true, optional = true }
rmcp = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
base64 = { workspace = true }
blake3 = { workspace = true }
miette = { workspace = true }

[dev-dependencies]
rmcp = { workspace = true, features = ["client", "transport-child-process"] }
disrobe-nir = { workspace = true }
iced-x86 = { workspace = true }
object = { workspace = true }

[[bin]]
name = "disrobe-mcp"
path = "src/main.rs"

[package.metadata.disrobe]
level = 10
group = "front-end"
