[package]
name = "disrobe-mcp"
description = "Model Context Protocol companion for `disrobe`: exposes envelope verification, symbol-rename recording, annotation-sidecar regeneration, and provenance-map lookup as MCP tools over stdio."
version.workspace = true
readme.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords = ["mcp", "deobfuscator", "decompiler", "reverse-engineering", "rmcp"]
categories = ["development-tools", "command-line-utilities"]

[lints]
workspace = true

[dependencies]
disrobe-core = { workspace = true, features = ["chain"] }
disrobe-ir = { workspace = true }
disrobe-llm-metadata = { workspace = true }
rmcp = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
base64 = { workspace = true }
miette = { workspace = true }

[[bin]]
name = "disrobe-mcp"
path = "src/main.rs"
