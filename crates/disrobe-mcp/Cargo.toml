[package]
name = "disrobe-mcp"
description = "Model Context Protocol companion for `disrobe`: exposes envelope verification, symbol-rename recording, annotation-sidecar regeneration, and provenance-map lookup as MCP tools over stdio."
version.workspace = true
readme.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords = ["mcp", "deobfuscator", "decompiler", "reverse-engineering", "rmcp"]
categories = ["development-tools", "command-line-utilities"]

[lints]
workspace = true

[features]
default = ["full"]
full = ["chain", "js", "wasm", "php", "ruby", "shell", "mobile", "lua", "swift", "jvm", "dotnet", "go", "beam", "as3", "nativelang", "scriptlang"]
chain = [
    "disrobe-core/chain",
    "disrobe-binfmt/chain",
    "disrobe-pass-pyarmor/chain",
    "disrobe-pass-native/chain",
    "disrobe-pass-py-deob/chain",
    "disrobe-pass-sourcedefender/chain",
    "disrobe-pass-pyfreeze/chain",
    "disrobe-pass-nuitka/chain",
    "disrobe-pass-py-disasm/chain",
    "disrobe-pass-py-decompile/chain",
    "disrobe-pass-pyinstaller/chain",
    "dep:disrobe-passes",
    "disrobe-passes/pyarmor",
    "disrobe-passes/native",
    "disrobe-passes/py-deob",
    "disrobe-passes/container",
    "disrobe-passes/sourcedefender",
    "disrobe-passes/pyfreeze",
    "disrobe-passes/nuitka",
    "disrobe-passes/py-disasm",
    "disrobe-passes/py-decompile",
    "disrobe-passes/pyinstaller",
    "disrobe-passes/pickle",
]

js = ["chain", "disrobe-passes/js"]
wasm = ["chain", "disrobe-passes/wasm"]
php = ["chain", "disrobe-passes/php"]
ruby = ["chain", "disrobe-passes/ruby"]
shell = ["chain", "disrobe-passes/shell"]
mobile = ["chain", "disrobe-passes/mobile"]
lua = ["chain", "disrobe-passes/lua"]
swift = ["chain", "disrobe-passes/swift"]
jvm = ["chain", "disrobe-passes/jvm"]
dotnet = ["chain", "disrobe-passes/dotnet"]
go = ["chain", "disrobe-passes/go"]
beam = ["chain", "disrobe-passes/beam"]
as3 = ["chain", "disrobe-passes/as3"]
nativelang = ["chain", "disrobe-passes/nativelang"]
scriptlang = ["chain", "disrobe-passes/scriptlang"]

[dependencies]
disrobe-core = { workspace = true, features = ["chain"] }
disrobe-ir = { workspace = true }
disrobe-llm-metadata = { workspace = true }
disrobe-binfmt = { workspace = true }
disrobe-pass-pyarmor = { workspace = true }
disrobe-pass-native = { workspace = true }
disrobe-pass-py-deob = { workspace = true }
disrobe-pass-sourcedefender = { workspace = true }
disrobe-pass-pyfreeze = { workspace = true }
disrobe-pass-nuitka = { workspace = true }
disrobe-pass-py-disasm = { workspace = true }
disrobe-pass-py-decompile = { workspace = true }
disrobe-pass-pyinstaller = { workspace = true }
disrobe-passes = { workspace = true, optional = true }
rmcp = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
base64 = { workspace = true }
blake3 = { workspace = true }
miette = { workspace = true }

[dev-dependencies]
rmcp = { workspace = true, features = ["client", "transport-child-process"] }

[[bin]]
name = "disrobe-mcp"
path = "src/main.rs"
