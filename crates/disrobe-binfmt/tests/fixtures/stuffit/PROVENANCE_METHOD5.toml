[framing]
note = "Method 5 carries no in-band end-of-stream symbol; the uncompressed length in the entry record terminates the stream. Rejecting trailing input bytes is therefore not expressible through the streaming decoder: it reports the whole supplied slice as consumed, so a consumed-versus-length comparison can never fire for this method. The declared compressed length is bounded by the record header CRC and by the archive total-length check instead."

[corruption]
note = "Flipping the low bit of each of the 693 compressed bytes of the largest data fork in turn: 690 were refused, and the 3 accepted at byte indices 2, 59 and 692 each reproduced the reference bytes exactly. No corruption produced different bytes that passed. The test asserts that property rather than a blanket refusal count."
