reference_note = "unar routes method 5 through XADLZHDynamicHandle; its dedicated XADStuffItLZAHHandle line is commented out in XADStuffItParser.m. The substitution decodes this archive correctly, so unar is a working reference here."

second_reference = "the CRC-16 stored in each 112-byte entry record"
second_reference_note = "Those values were written by Aladdin's own encoder when the archive was produced, so they are independent of every modern decoder. MANIFEST_METHOD5.tsv records them in the crc16 column and the test recomputes them over the recovered bytes."

