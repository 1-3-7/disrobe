reference_result = "lsar -json reported format StuffIt 5 with nine forks, five StuffItCompressionMethod 15 named Arsenic and four method 0; unar extracted all nine. Every recovered fork matches unar's bytes and unar's own recorded per-fork offset and length."
reference_manifest = "MANIFEST_SIT5.tsv"

format_source = "https://github.com/MacPaw/XADMaster/blob/master/XADStuffIt5Parser.m"
format_source_note = "Field walk only: archive header at offset 82 for version and flags, entry records marked a5a5a5a5, and the per-entry field order. No implementation was taken from it."
codec_source = "https://docs.rs/compcol/0.6.10/compcol/arsenic/index.html"

[integrity]
note = "StuffIt 5 leaves the per-fork CRC-16 field zero for Arsenic; the format's own field comment reads 'old crc16 (not with algo 15)'. This was confirmed against the fixture rather than assumed: all five Arsenic forks carry crc16 0 and all four stored forks carry a real CRC-16 that the recovered bytes satisfy. Arsenic instead self-terminates with a CRC-32 trailer the decoder verifies, so stored forks are graded on CRC-16 and Arsenic forks on that trailer plus the exact declared output length."
header_crc = "Each entry header carries a CRC-16 over the whole header with the CRC field itself zeroed. It is verified before any field in that header is trusted."

