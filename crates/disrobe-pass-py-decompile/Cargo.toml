[package]
name = "disrobe-pass-py-decompile"
autotests = false
description = "Python bytecode decompiler covering CPython 3.8 through 3.15 and PyPy. Reconstructs typed source from CodeObject via an exception-table-driven frame-tree pre-pass, per-version opcode dispatch, and a round-trip metric that distinguishes real reconstruction bugs from inert compiler-version codegen choices."
version.workspace = true
readme.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
keywords = ["python", "decompiler", "pyc", "cpython", "pypy"]
categories.workspace = true

[lints]
workspace = true

[dependencies]
disrobe-core = { workspace = true }
disrobe-py-marshal = { workspace = true }
disrobe-llm-metadata = { workspace = true, optional = true }
miette = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
disrobe-pass-py-disasm = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
disrobe-pass-py-disasm = { workspace = true }

[features]
default = []
llm-metadata = ["dep:disrobe-llm-metadata"]

[dev-dependencies]
disrobe-testkit = { workspace = true }
tempfile = "3"

[package.metadata.disrobe]
level = 6

[[test]]
name = "it"
path = "tests/it/main.rs"
