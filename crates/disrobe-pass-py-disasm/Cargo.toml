[package]
name = "disrobe-pass-py-disasm"
description = "Python bytecode disassembler (dis.dis-compatible) covering CPython 2.7 through 3.14. Operates on the `CodeObject` produced by disrobe-py-marshal."
version.workspace = true
readme.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
keywords = ["python", "bytecode", "disassembler", "dis", "cpython"]
categories.workspace = true

[lints]
workspace = true

[features]
default = ["alt-runtimes-native"]
alt-runtimes-native = [
    "dep:disrobe-pass-jvm",
    "dep:disrobe-pass-dotnet",
    "dep:disrobe-pass-js-deob",
]
llm-metadata = ["dep:disrobe-llm-metadata"]
chain = ["disrobe-core/chain"]

[dependencies]
disrobe-core = { workspace = true }
disrobe-py-marshal = { workspace = true }
disrobe-pass-jvm = { workspace = true, optional = true }
disrobe-pass-dotnet = { workspace = true, optional = true }
disrobe-pass-js-deob = { workspace = true, optional = true }
disrobe-llm-metadata = { workspace = true, optional = true }
miette = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
unicode-general-category = "1.1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
disrobe-pass-native = { workspace = true }
yaxpeax-arch = { workspace = true }
yaxpeax-arm = { workspace = true }

[dev-dependencies]
disrobe-testkit = { workspace = true }
