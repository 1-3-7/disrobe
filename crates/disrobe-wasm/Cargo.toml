[package]
name = "disrobe-wasm"
description = "C-ABI WebAssembly facade over disrobe's pure-Rust analysis passes (Python disassembly/decompilation, pickle disassembly/safety, WebAssembly analysis, format fingerprinting) for an in-browser playground. No filesystem, no network, pure compute."
version.workspace = true
readme.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
keywords = ["wasm", "webassembly", "decompiler", "playground", "c-abi"]
categories = ["development-tools", "wasm"]

[lints]
workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
disrobe-core = { workspace = true }
disrobe-py-marshal = { workspace = true }
disrobe-pass-wasm-deob = { workspace = true }
disrobe-pass-py-disasm = { path = "../disrobe-pass-py-disasm", default-features = false }
disrobe-pass-pickle = { path = "../disrobe-pass-pickle", default-features = false }
disrobe-pass-py-decompile = { workspace = true }
disrobe-pass-pyarmor = { workspace = true }
disrobe-pass-ruby = { workspace = true }
disrobe-pass-php = { workspace = true }
disrobe-pass-lua = { workspace = true }
disrobe-pass-beam = { workspace = true }
disrobe-pass-as3 = { workspace = true }
disrobe-pass-scriptlang = { workspace = true }
disrobe-pass-shell = { workspace = true }
disrobe-pass-swift-objc = { workspace = true }
disrobe-pass-mobile = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
wasmparser = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4", default-features = false }
