[package]
name = "disrobe-nir-lift"
description = "Lifters that lower each pass's public recovered IR (wasm SSA/CFG, JVM and Dalvik bytecode CFG, .NET CIL method bodies, recovered Python AST) into the architecture-neutral normalized IR (the Mir rung), so the queryable-IR layer can run identical symbol / call / xref / capability / decoder queries across every front end."
