[shapes]
andChainWithAssignment = "a while condition joined with && whose second operand assigns a local before the comparison"
orChain = "a while condition joined with || whose first operand jumps straight into the body"
mixedChain = "a while condition (a || b) && c, where both operands of the || reach the && operand"
forWithCall = "a for condition that calls a static method after a bound check"
doWhileCompound = "a do-while whose && condition shares its first block with the loop body"
fieldCondition = "a while condition that reads an instance field and a static field"
headerAssignsBeforeTest = "a while condition that loads an array element through a post-increment and stores it before the test"
assignInCondition = "a compound assignment inside an if condition outside any loop"
postIncrementIndex = "an array index that post-increments its local outside any loop"
notes = "In orChain, D8 reaches the loop body from the second || operand through a goto-only block, so the release build puts a trampoline edge inside the condition."

