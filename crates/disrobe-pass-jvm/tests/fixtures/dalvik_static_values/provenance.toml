[shapes]
values = "StaticValues: String (empty, and with non-ASCII, quote, backslash, tab and newline), int, long, char, boolean, float (including -0.0f), double, byte and short fields that D8 moves into the class definition's static values array"
defaults = "untouched, computed and last are encoded as explicit zeros; none, nothing and log as nulls; a field left at its default keeps no initialiser"
