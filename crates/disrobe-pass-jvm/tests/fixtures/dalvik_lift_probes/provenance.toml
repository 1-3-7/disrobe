schema = "disrobe.jvm.dalvik-lift-probes-fixture/v1"
source = "LiftProbes.java"
source_sha256 = "c66c8dc7b82571a30baa90f82f58304ff51e0a445ca2661c3cd4ecd35d2809bc"

[javac]
vendor = "Eclipse Temurin"
version = "25.0.4+7-LTS"
command = "javac -g -Xlint:-options --release 8 -d classes LiftProbes.java"

[d8]
version = "9.1.31"
url = "https://dl.google.com/dl/android/maven2/com/android/tools/r8/9.1.31/r8-9.1.31.jar"
sha256 = "3b4de3053885da105e39c15212261d22653d6d1b5eb92323dd04ae913cc8286f"

[shapes]
arrays = "arrays(int): filled-new-array, filled-new-array/range and fill-array-data for int, long, char, byte, short, boolean, float and double arrays"
halvings = "halvings(int): a while header that assigns the loop variable before the exit test"
reads = "reads(int): a while header that stores a call result read by the exit test and the body"
polls = "polls(): a while header whose call folds into the exit test"
strings = "strings(): a string constant with non-ASCII, control, quote, backslash, surrogate-pair and line-separator characters"
order = "order(): call results bound to locals and combined in the reverse of their call order"
temporaries = "temporaries(int): D8 reuses one register for an int, a StringBuilder, a String and a double, and the parameter register for the boxed Object result; the debug build keeps the parameter and local names"
chain = "chain(String, int): an else-if chain whose three arms assign one local and meet at a join that no inner test dominates"
fallback = "fallback(String, String): a try inside a catch handler; the debug build names both catch parameters, and the release build reuses the outer exception register for the inner try's String result"
settle = "settle(int): a try with a catch and a finally whose protected ranges D8 splits across the arms of an if and a conditional expression; the finally copies end each exit path"
rescue = "rescue(String, String): a try inside a catch handler whose try body keeps computing after the last throwing call, so the continuation that follows the inner handler is not the first block after the protected range"
keyed = "keyed(String): javac's string switch (a hashCode switch, equals buckets and an index switch) with a hash collision, a fall-through arm and a default"
spelled = "spelled(String): a string switch whose fall-through arm the release build lowers into a tail shared with the next arm"
guarded = "guarded(int): a synchronized block around a loop; Thread.holdsLock observes the monitor inside and after the block"
guardedReturn = "guardedReturn(int[], int): a synchronized block on a parameter that returns from both arms; D8 trims the monitor handler's protected range"
looped = "looped(int): a synchronized block inside a loop whose break leaves the loop from inside the monitor"
drained = "drained(int): a loop whose break runs a call first, so the break is not part of the loop condition"
workers = "Worker implements Callable and Runnable; Counting extends Worker and gains a javac bridge call() that clashes with its own call() in source"
notes = "The release build keeps every probe method; D8 turns the constant arrays into fill-array-data payloads and the computed int arrays into filled-new-array, and reuses registers across the call results of order()."

