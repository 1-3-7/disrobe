notes = "Both builds come from the same class file compiled with -g. In the release build D8 keeps the loop counter of scale and the running total in registers updated by one block whose later instruction reads a value an earlier one overwrites, materialises 2.0 as const-wide/high16, reuses one register for an int and then a String in describe, reuses the String[] parameter register of main for the int loop counter, and passes a boolean built from two constant branches. The debug build keeps the javac parameter names in the debug info, so the recovered signatures carry them."

