notes = "Each catch clause ignores its exception, so R8 drops the store and the handler entry carries no move-exception. The authored early returns and the switch default share the handler's return statement, so the same address is both the exception handler entry and a normal branch target. Dalvik allows one address to serve both because the exception arrives in a register only when move-exception asks for it; the JVM cannot, because the exception arrives on the operand stack, so one address would need a frame with an empty stack and a frame with a thrown exception at the same time. The recovery gives such a handler its own dispatch entry that discards the exception and jumps to the shared tail."

