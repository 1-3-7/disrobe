[shapes]
notes = "ParamProbe writes a constant into a register that holds a declared parameter and then reads it after the join, which is the shape that separates the two names the renderer used for one register. TempProbe covers temporaries that live across a branch join in category-one, category-two and reference form; each needs a hoisted declaration of the right type before its unit compiles, so it is graded on computed values. LocalProbe holds the one residual shape: D8 reused a register that the signature declares boolean for an int temporary, which no declaration can repair because the name is already spoken for."
