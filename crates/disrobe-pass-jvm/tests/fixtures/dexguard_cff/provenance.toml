notes = "flattened is original rewritten by hand in the DexGuard dispatcher style: a while(true) switch over an int state local whose every write is a constant, with one case per basic block of original. The case bodies need no temporary register, so D8 keeps the state local in a register that only const instructions write and only the dispatcher reads. D8 hoists two dead constants into the dispatcher block and writes the entry state before other initialisers, the shapes the DEX unflattener must accept."

