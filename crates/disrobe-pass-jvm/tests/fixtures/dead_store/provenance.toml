[shapes]
notes = "Every method folds its result back into a register that is also one of its own operands, which is what javac and D8 emit for a left-associative accumulation. AccumulateProbe takes only parameters and touches no field, so its recovered unit compiles and can be graded on computed values: accumulate covers three-address addition, scale covers multiply then add, widen covers category-two arithmetic, and negate covers unary. CastProbe carries the long-to-int cast and a two-operand fold, both of which need a scratch register that the emitter writes without declaring, so that class is graded structurally rather than by recompilation."
behavioural_class = "AccumulateProbe"
structural_class = "CastProbe"

