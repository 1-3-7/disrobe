[package]
name = "disrobe-pass-dotnet"
description = ".NET/CIL deobfuscation pass: CIL disasm, Dotfuscator/SmartAssembly/de4dot/ConfuserEx2 reversers, R2R + Native AOT walkers, ILSpy/dnSpy wraps."
version.workspace = true
readme.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
keywords = ["dotnet", "cil", "deobfuscation", "il", "confuserex"]
categories.workspace = true

[lints]
workspace = true

[dependencies]
disrobe-cfg = { workspace = true }
disrobe-core = { workspace = true }
disrobe-bytes = { workspace = true }
miette = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha1 = { workspace = true }
disrobe-llm-metadata = { workspace = true, optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
disrobe-mba = { workspace = true }
disrobe-binfmt = { workspace = true }
disrobe-pass-native = { workspace = true }
object = { workspace = true }
sha2 = { workspace = true }
pbkdf2 = { workspace = true }
aes = { workspace = true }
des = { workspace = true }
cbc = { workspace = true }
flate2 = { workspace = true }
lzma-rs = "0.3.0"

[features]
default = []
chain = ["disrobe-core/chain"]
llm-metadata = ["dep:disrobe-llm-metadata"]
semantic-reach = []

[dev-dependencies]
des = { workspace = true }
aes = { workspace = true }
cbc = { workspace = true }
flate2 = { workspace = true }

[[test]]
name = "seed_reach"
required-features = ["semantic-reach"]
