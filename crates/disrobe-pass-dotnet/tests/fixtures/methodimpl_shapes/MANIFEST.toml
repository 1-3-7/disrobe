schema = "disrobe.corpus.v1"
crate = "disrobe-pass-dotnet"
generated = "2026-08-19"
toolchain = "ilasm 4.8.9221.0 (Microsoft.NET/Framework64/v4.0.30319), -dll, no /PE64 and no processor switch"
license = "Elastic-2.0"
note = "self-authored ECMA-335 fixture for MethodImpl body and declaration encodings a C# compiler never emits; no vendor or third-party binary bytes"

[target]
image_format = "PE32"
processor = "AnyCPU, ILONLY, 32-bit not required"
runtime = "metadata references mscorlib 4.0.0.0; the fixture is never loaded or executed"
heap_index_width = "small, two bytes for #Strings, #Blob, #GUID and #US"
heap_bytes = { strings = 397, blob = 36, guid = 16, user_strings = 8 }
table_index_width = "small, two bytes for every simple and coded index in this image"

[reference]
reader = "System.Reflection.Metadata from the Microsoft.NETCore.App shared framework"
sdk = "dotnet SDK 9.0.316"
program = "metadata_reference/Program.cs"
dump = "MethodImplShapes.metadata.txt"
note = "the reader is Microsoft's own ECMA-335 implementation and never loads disrobe; the test parses this dump and compares it with disrobe's table parse"

[build]
command = "powershell -File build.ps1"
reproducible = false
reproducibility_note = "ilasm 4.8 has no deterministic switch, so a rebuild changes the module MVID and the PE timestamp; the assembly is pinned by hash and re-derived from MethodImplShapes.il, not by byte equality"
line_endings = "every hash-pinned file carries -text in this directory's .gitattributes, so no checkout rewrites the bytes the hashes above cover; MethodImplShapes.metadata.txt is stored with CRLF as the reader emitted it"

