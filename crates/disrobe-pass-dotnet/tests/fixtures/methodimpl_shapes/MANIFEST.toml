[encodings]
methodimpl_body_methoddef = "MethodImplShapes.MethodDefImplBody and MethodImplShapes.UnrelatedImplBody"
methodimpl_body_memberref_typeref_assemblyref_scope = "MethodImplShapes.AssemblyRefTypeRefImplBody"
methodimpl_body_memberref_typeref_moduleref_scope = "MethodImplShapes.ModuleRefTypeRefImplBody"
methodimpl_body_memberref_typespec = "MethodImplShapes.TypeSpecImplBody"
methodimpl_declaration_memberref = "rows 1 through 5, all declaring [mscorlib]System.Object members"
methodimpl_declaration_methoddef = "row 6, MethodImplShapes.Meter implementing MethodImplShapes.IGauge.Read"
method_flags_final_reuse_slot = "MethodImplShapes.FinalReuseSlotOverride.Equals, 0x00E6"
method_flags_public_virtual_hidebysig = "MethodImplShapes.ReuseSlotOverride.Equals, 0x00C6"
method_flags_newslot_virtual = "MethodImplShapes.NewSlotVirtual.Equals, 0x01C6"
method_flags_final_without_virtual = "MethodImplShapes.FinalWithoutVirtual.Equals, 0x00A6"

[exclusions]
methodimpl_body_memberref_same_module_typeref = "ilasm 4.8.9221.0 cannot author it. A body naming a type this module defines is normalised to a MethodDef row whatever resolution scope is written, including [.module <this module>], and a body naming an undefined type without a scope is refused with 'Reference to undefined class'. The nearest encodings ilasm will produce are the TypeSpec parent and the ModuleRef-scoped TypeRef parent, both committed here."
methodimpl_null_body = "MethodImpl.MethodBody may not be null in assemblable IL. The test reaches this shape by patching the committed bytes in memory."
methodimpl_out_of_range_body_row = "not assemblable. The test reaches this shape by patching the committed bytes in memory."
interface_default_implementation = "ilasm 4.8.9221.0 refuses a non-static instance method with a body in an abstract interface: 'Method cannot have body if it is non-static declared in interface abstract'. A default interface implementation needs the .NET Core ilasm, which is not installed on this host."

[grade]
test = "methodimpl_shapes"
reference = "MethodImplShapes.il, the source the fixture was assembled from, plus MethodImplShapes.metadata.txt for the table encodings"
comparison = "recovered C# method headers from decompile_assembly against the override semantics the IL source declares; parsed MethodImpl, MemberRef and TypeRef rows against the System.Reflection.Metadata dump"
