version.workspace = true
readme.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
keywords = ["go", "golang", "garble", "deobfuscation", "pclntab"]
categories.workspace = true

[lints]
workspace = true

[dependencies]
disrobe-core = { workspace = true }
disrobe-binfmt = { workspace = true }
object = { workspace = true }
iced-x86 = { workspace = true }
gimli = { workspace = true }
flate2 = { workspace = true }
miette = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
disrobe-llm-metadata = { workspace = true, optional = true }

[features]
default = []
chain = ["disrobe-core/chain"]
llm-metadata = ["dep:disrobe-llm-metadata"]

[dev-dependencies]
insta = { workspace = true }
