[package]
name = "disrobe-pass-nativelang"
description = "Natively-compiled language recovery pass: Nim/Zig/Crystal/D binary fingerprinting, symbol demangling (Itanium/dotted/Crystal type-path/D _D length-prefixed with template instances), runtime+GC-metadata and std-symbol recovery, per-function boundary recovery (symbol table + DWARF low_pc/high_pc, recursive-traversal entry points when stripped), DWARF type-DIE reconstruction, source-file/line-range mapping and parameter names, graded source-recovery scoring, and per-function carve, disassembly and pseudo-C/pseudo-Rust body emission for machine-code bodies, graded by recompilation against real nim, zig and crystal builds. Recovers names, boundaries, types, source lines, parameters and function bodies; the original high-level surface syntax (Nim/Zig/Crystal/D source text) stays unrecoverable."
version.workspace = true
readme.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
keywords = ["nim", "zig", "crystal", "dlang", "demangle"]
categories.workspace = true

[lints]
workspace = true

[dependencies]
disrobe-bytes = { workspace = true }
disrobe-core = { workspace = true }
disrobe-nir = { workspace = true }
disrobe-pass-native = { workspace = true }
blake3 = { workspace = true }
object = { workspace = true }
