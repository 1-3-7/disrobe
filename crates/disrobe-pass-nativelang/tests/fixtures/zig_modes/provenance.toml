schema = "disrobe.nativelang.zig-build-modes/v1"
producer = "zig 0.16.0"
producer_reported_version = "0.16.0"
producer_package = "WinGet package zig.zig, distribution zig-x86_64-windows-0.16.0"
source = "arith.zig"
source_sha256 = "f4213e2e1169e469990088c378ee33c299704756d2af6ae1a4163b451e5017a2"
declared_input = "zig 0.16.0 ReleaseFast on x86-64, one artifact per container: ELF System V, PE Microsoft x64, Mach-O"

[[artifacts]]
path = "arith_releasefast_x86_64_linux.elf"
sha256 = "a668dc01b7464e8119923897f711445994e491f2135e21282851890a3a2ec667"
build_mode = "ReleaseFast"
target = "x86_64-linux-gnu"
container = "elf"
build_command = "zig build-exe arith.zig -OReleaseFast -target x86_64-linux-gnu -femit-bin=arith_releasefast_x86_64_linux.elf"
post_build_command = "llvm-objcopy --strip-debug arith_releasefast_x86_64_linux.elf"
post_build_reason = "the zig 0.16.0 debug sections record the absolute path of the compiler installation; removing them keeps the symbol table the carver reads and drops the build host path"
safety_checks = false
absent_markers = ["panicOutOfBounds", "panicUnwrap"]
present_markers = ["compiler_rt", "mem.Allocator.", "start.posixCallMainAndExit"]
graded_functions = [
  "dr_mix",
  "dr_gcd",
  "dr_clamp",
  "dr_popcount",
  "dr_sum_to",
  "dr_select",
  "dr_abs_diff",
]
abstaining_functions = ["dr_rotl"]

[[artifacts]]
path = "arith_releasefast_x86_64_windows.exe"
sha256 = "52b9602c561698a4d9153b4ca3b92e70f57ea3d5534a932da850d7d5a6e4ebeb"
build_mode = "ReleaseFast"
target = "x86_64-windows-gnu"
container = "pe"
build_command = "zig build-exe arith.zig -OReleaseFast -target x86_64-windows-gnu -femit-bin=arith_releasefast_x86_64_windows.exe"
safety_checks = false
present_markers = [".buildid", "RtlExitUserProcess"]
role = "the structural-only detection case: no symbol table and no panic text, so the two markers below are the whole of the evidence"
measured_false_positives = "0 of 241 committed PE binaries outside corpus/native/zig carry either marker"

[[artifacts]]
path = "arith_releasefast_x86_64_macos.macho"
sha256 = "89be3f257dca1bd4b0ffd5009b137885dec449f8566f2b171ea4c42fd6935e51"
build_mode = "ReleaseFast"
target = "x86_64-macos"
container = "macho"
build_command = "zig build-exe arith.zig -OReleaseFast -target x86_64-macos -femit-bin=arith_releasefast_x86_64_macos"
post_build_command = "llvm-strip -S arith_releasefast_x86_64_macos"
post_build_reason = "the Mach-O debug map records the absolute path of the intermediate object; removing it keeps the symbol table and drops the build host path"
safety_checks = false
