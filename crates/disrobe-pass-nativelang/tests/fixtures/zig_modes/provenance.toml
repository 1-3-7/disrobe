schema = "disrobe.nativelang.zig-build-modes/v1"
producer = "zig 0.16.0"
producer_reported_version = "0.16.0"
producer_package = "WinGet package zig.zig, distribution zig-x86_64-windows-0.16.0"
source = "arith.zig"
source_sha256 = "f4213e2e1169e469990088c378ee33c299704756d2af6ae1a4163b451e5017a2"
declared_input = "zig 0.16.0 ReleaseFast on x86-64, one artifact per container: ELF System V, PE Microsoft x64, Mach-O"

[[artifacts]]
path = "arith_releasefast_x86_64_linux.elf"
sha256 = "a668dc01b7464e8119923897f711445994e491f2135e21282851890a3a2ec667"
build_mode = "ReleaseFast"
target = "x86_64-linux-gnu"
container = "elf"
build_command = "zig build-exe arith.zig -OReleaseFast -target x86_64-linux-gnu -femit-bin=arith_releasefast_x86_64_linux.elf"
post_build_command = "llvm-objcopy --strip-debug arith_releasefast_x86_64_linux.elf"
post_build_reason = "the zig 0.16.0 debug sections record the absolute path of the compiler installation; removing them keeps the symbol table the carver reads and drops the build host path"
safety_checks = false
absent_markers = ["panicOutOfBounds", "panicUnwrap"]
present_markers = ["compiler_rt", "mem.Allocator.", "start.posixCallMainAndExit"]
graded_functions = [
  "dr_mix",
  "dr_gcd",
  "dr_clamp",
  "dr_popcount",
  "dr_sum_to",
  "dr_select",
  "dr_abs_diff",
]
abstaining_functions = ["dr_rotl"]

[[artifacts]]
path = "arith_releasefast_aarch64_linux.elf"
sha256 = "c0741c7e61475763ca7c5c96fb82376976715b67f9af421ebe562a09d1cdfc4b"
build_mode = "ReleaseFast"
target = "aarch64-linux-gnu"
container = "elf"
build_command = "zig build-exe arith.zig -OReleaseFast -target aarch64-linux-gnu -femit-bin=arith_releasefast_aarch64_linux.elf"
post_build_command = "llvm-objcopy --strip-debug arith_releasefast_aarch64_linux.elf"
post_build_reason = "the zig 0.16.0 debug sections record the absolute path of the compiler installation; removing them keeps the symbol table the carver reads and drops the build host path"
safety_checks = false
present_markers = ["compiler_rt", "mem.Allocator.", "start.posixCallMainAndExit"]
graded_functions = ["dr_mix"]
role = "the AArch64 automatic body-routing grade"

[[artifacts]]
path = "arith_releasefast_x86_64_windows.exe"
sha256 = "52b9602c561698a4d9153b4ca3b92e70f57ea3d5534a932da850d7d5a6e4ebeb"
build_mode = "ReleaseFast"
target = "x86_64-windows-gnu"
container = "pe"
build_command = "zig build-exe arith.zig -OReleaseFast -target x86_64-windows-gnu -femit-bin=arith_releasefast_x86_64_windows.exe"
safety_checks = false
present_markers = [".buildid", "RtlExitUserProcess"]
role = "the structural-only detection case: no symbol table and no panic text, so the two markers below are the whole of the evidence"
measured_false_positives = "neither marker appears in any of the 223 tracked PE binaries outside the zig fixtures, counted over git ls-files"

[[artifacts]]
path = "arith_releasefast_x86_64_macos.macho"
sha256 = "89be3f257dca1bd4b0ffd5009b137885dec449f8566f2b171ea4c42fd6935e51"
build_mode = "ReleaseFast"
target = "x86_64-macos"
container = "macho"
build_command = "zig build-exe arith.zig -OReleaseFast -target x86_64-macos -femit-bin=arith_releasefast_x86_64_macos"
post_build_command = "llvm-strip -S arith_releasefast_x86_64_macos"
post_build_reason = "the Mach-O debug map records the absolute path of the intermediate object; removing it keeps the symbol table and drops the build host path"
safety_checks = false
present_markers = ["mem.Allocator.", "start.main"]

[[companion_artifacts]]
path = "../../../../../corpus/native/zig/hello.zig.elf"
sha256 = "b85fa149b49bdcf1ec9011d92b55dde9d9cf308d8bc28e83d28323add8852994"
producer = "zig 0.13.0"
build_mode = "safety-checked"
target = "x86_64-linux"
container = "elf"
safety_checks = true
present_markers = ["panicOutOfBounds", "panicUnwrap"]
role = "the second zig build mode the body grade measures"

[measurement]
matrix = "32 builds of zig 0.16.0 over Debug, ReleaseSafe, ReleaseFast and ReleaseSmall for x86_64-linux-gnu, x86_64-windows-gnu, aarch64-linux-gnu and x86_64-macos"
controls = "447 tracked binaries and 223 tracked PE binaries, counted over git ls-files, excluding the zig fixtures"
reached_chain_floor_before = "16 of 32"
reached_chain_floor_after = "26 of 32"
false_positives = "each of the 15 markers appears in 0 of the 447 tracked control binaries"

[excluded]
reason = "a zig build with safety checks off, no symbol table and no panic text carries no zig-attributable bytes"
undetectable_builds = 6
undetectable_shape = "ReleaseSmall on ELF and Mach-O"
evidence = "the 4840-byte x86_64-linux-gnu ReleaseSmall build reports no symbols, and its only toolchain string is `Linker: LLD`, which 36 tracked non-zig binaries also carry"
rejected_markers = [
  "index out of bounds is carried by 43 of the 447 tracked control binaries",
  "integer overflow is carried by 19 of the 447 tracked control binaries",
  ".relro_padding is an LLD section name carried by 36 of the 447 tracked control binaries",
]
withheld_markers = [
  "ZIG_PROGRESS matches 16 of 32 matrix builds and 0 of 447 controls",
  "aborting due to recursive panic matches 16 of 32 matrix builds and 0 of 447 controls",
  "debug.Dwarf matches 12 of 32 matrix builds and 0 of 447 controls",
  "panic.zig matches 12 of 32 matrix builds and 0 of 447 controls",
]
withheld_reason = "no committed fixture carries these four, so nothing in the repository proves they match a real build; adding them also grows the marker list, and the confidence divides by that length"
