[excluded]
reason = "a zig build with safety checks off, no symbol table and no panic text carries no zig-attributable bytes"
measured_on = "a 32-build matrix of zig 0.16.0 over Debug, ReleaseSafe, ReleaseFast and ReleaseSmall for x86_64-linux-gnu, x86_64-windows-gnu, aarch64-linux-gnu and x86_64-macos"
undetectable_builds = 6
undetectable_shape = "ReleaseSmall on ELF and Mach-O"
evidence = "the 4840-byte x86_64-linux-gnu ReleaseSmall build reports no symbols, and its only toolchain string is `Linker: LLD`, which nine committed non-zig binaries also carry"
