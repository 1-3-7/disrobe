[package]
name = "disrobe-pass-pyinstaller"
description = "PyInstaller CArchive + PYZ extractor for the disrobe deobfuscation suite. Our Rust implementation covers PyInstaller 2.x through 6.x, recovers the in-artifact AES key from the marshalled crypto-key code object, decrypts AES-128-CTR (>= 4.0) and AES-128-CFB-8 (< 4.0) encrypted PYZ archives, and reconstructs deterministic `.pyc` files across all CPython versions."
version.workspace = true
readme.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
keywords = ["pyinstaller", "decompile", "extractor", "python", "reverse-engineering"]
categories.workspace = true
build = "build.rs"

[lints]
workspace = true

[dependencies]
disrobe-core = { workspace = true }
disrobe-ir = { workspace = true }
disrobe-binfmt = { workspace = true }
disrobe-pass-native = { workspace = true, optional = true }
disrobe-capabilities = { workspace = true, optional = true }
disrobe-py-marshal = { workspace = true }
aes = { workspace = true }
ctr = { workspace = true }
flate2 = { workspace = true }
bzip2-rs = { workspace = true }
liblzma = { workspace = true }
brotli = { workspace = true }
memmap2 = { workspace = true }
miette = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
indexmap = { workspace = true }
bytes = { workspace = true }

[features]
default = []
chain = ["disrobe-core/chain", "dep:disrobe-pass-native", "dep:disrobe-capabilities"]

[dev-dependencies]
insta = { workspace = true }
divan = { workspace = true }
disrobe-py-marshal = { workspace = true }

[[bench]]
name = "cookie_find"
harness = false
