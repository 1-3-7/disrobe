[[rules]]
name = "slice_const_low_bit"
widths = [1, 2, 4, 8, 16, 32, 64]
proof = "shared_equivalence"
source = "fixed-width extraction of bit zero from a constant"
pattern = { kind = "slice", inner = { kind = "any_const", bind = "c" }, lo = 0, hi = 1 }
rewrite = { build = "slice_const", expr = "c", lo = 0, hi = 1 }

[[rules]]
name = "slice_const_next_bit"
widths = [2, 4, 8, 16, 32, 64]
proof = "shared_equivalence"
source = "fixed-width extraction of bit one from a constant"
pattern = { kind = "slice", inner = { kind = "any_const", bind = "c" }, lo = 1, hi = 2 }
rewrite = { build = "slice_const", expr = "c", lo = 1, hi = 2 }
