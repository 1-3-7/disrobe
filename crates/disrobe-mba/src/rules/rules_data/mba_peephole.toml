widths = [1, 2, 4, 8, 16, 32, 64]
proof = "shared_equivalence"
source = "SMT-LIB fixed-size bit-vector bvshl constant evaluation"
pattern = { kind = "binary", op = "shl", left = { kind = "any_const", bind = "value" }, right = { kind = "any_const", bind = "amount" } }
rewrite = { build = "fold_shl_const", value = "value", amount = "amount" }

[[rules]]
