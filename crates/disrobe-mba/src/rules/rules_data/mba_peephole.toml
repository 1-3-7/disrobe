[[rules]]
name = "shl_count_at_or_above_width_is_zero"
widths = [1, 2, 4, 8, 16, 32, 64]
proof = "shared_equivalence"
source = "SMT-LIB fixed-size bit-vector bvshl with a count at least the operand width"
pattern = { kind = "binary", op = "shl", left = { kind = "any_expr", bind = "x" }, right = { kind = "any_const", bind = "amount" } }
when = [{ check = "shift_count_at_least_width", expr = "amount" }]
rewrite = { build = "const", value = 0 }

[[rules]]
name = "shr_count_at_or_above_width_is_zero"
widths = [1, 2, 4, 8, 16, 32, 64]
proof = "shared_equivalence"
source = "SMT-LIB fixed-size bit-vector bvlshr with a count at least the operand width"
pattern = { kind = "binary", op = "shr", left = { kind = "any_expr", bind = "x" }, right = { kind = "any_const", bind = "amount" } }
when = [{ check = "shift_count_at_least_width", expr = "amount" }]
