source = "Boolean absorption x or (y and x)"
pattern = { kind = "binary", op = "or", left = { kind = "any_expr", bind = "x" }, right = { kind = "binary", op = "and", left = { kind = "any_expr", bind = "other" }, right = { kind = "any_expr", bind = "same" } } }
when = [{ check = "equal", left = "x", right = "same" }]
