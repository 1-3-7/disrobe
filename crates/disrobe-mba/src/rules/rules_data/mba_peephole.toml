[[rules]]
name = "shl_zero_count_identity"
widths = [1, 2, 4, 8, 16, 32, 64]
proof = "shared_equivalence"
source = "fixed-width logical shift identity"
pattern = { kind = "binary", op = "shl", left = { kind = "any_expr", bind = "x" }, right = { kind = "any_const", bind = "z" } }
when = [{ check = "is_zero", expr = "z" }]
rewrite = { build = "use", expr = "x" }

