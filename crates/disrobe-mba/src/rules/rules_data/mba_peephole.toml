[[rules]]
name = "and_absorption_left"
widths = [1, 2, 4, 8, 16, 32, 64]
proof = "shared_equivalence"
source = "Boolean absorption x and (x or y)"
pattern = { kind = "binary", op = "and", left = { kind = "any_expr", bind = "x" }, right = { kind = "binary", op = "or", left = { kind = "any_expr", bind = "same" }, right = { kind = "any_expr", bind = "other" } } }
when = [{ check = "equal", left = "x", right = "same" }]
rewrite = { build = "use", expr = "x" }

[[rules]]
name = "and_absorption_right"
