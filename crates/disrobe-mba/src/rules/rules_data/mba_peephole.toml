[[rules]]
name = "shl_in_range_count_normalizes_to_multiplication"
widths = [1, 2, 4, 8, 16, 32, 64]
proof = "shared_equivalence"
source = "fixed-width logical left shift as multiplication by two to the count"
pattern = { kind = "binary", op = "shl", left = { kind = "any_expr", bind = "x" }, right = { kind = "any_const", bind = "amount" } }
when = [{ check = "shift_count_below_width", expr = "amount" }]
rewrite = { build = "shl_const_as_mul", expr = "x", amount = "amount" }

[[rules]]
name = "ite_zero_selects_otherwise"
widths = [1, 2, 4, 8, 16, 32, 64]
proof = "shared_equivalence"
source = "fixed-width conditional with a zero condition"
pattern = { kind = "ite", cond = { kind = "any_const", bind = "c" }, then = { kind = "any_expr", bind = "then" }, otherwise = { kind = "any_expr", bind = "otherwise" } }
when = [{ check = "is_zero", expr = "c" }]
rewrite = { build = "use", expr = "otherwise" }

[[rules]]
name = "ite_nonzero_selects_then"
widths = [1, 2, 4, 8, 16, 32, 64]
proof = "shared_equivalence"
source = "fixed-width conditional with a nonzero condition"
pattern = { kind = "ite", cond = { kind = "any_const", bind = "c" }, then = { kind = "any_expr", bind = "then" }, otherwise = { kind = "any_expr", bind = "otherwise" } }
when = [{ check = "is_non_zero", expr = "c" }]
rewrite = { build = "use", expr = "then" }

[[rules]]
name = "ite_equal_branches"
widths = [1, 2, 4, 8, 16, 32, 64]
proof = "shared_equivalence"
source = "conditional branch identity when both outcomes are equal"
pattern = { kind = "ite", cond = { kind = "any_expr", bind = "cond" }, then = { kind = "any_expr", bind = "then" }, otherwise = { kind = "any_expr", bind = "otherwise" } }
when = [{ check = "equal", left = "then", right = "otherwise" }]
rewrite = { build = "use", expr = "then" }

[[rules]]
name = "slice_const"
widths = [1, 2, 4, 8, 16, 32, 64]
proof = "shared_equivalence"
source = "bounded fixed-width extraction from a constant"
pattern = { kind = "any_const_slice", bind = "slice" }
rewrite = { build = "fold_const_slice", expr = "slice" }

