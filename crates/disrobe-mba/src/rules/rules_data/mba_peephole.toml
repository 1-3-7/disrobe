[[rules]]
name = "and_complement_zero"
widths = [1, 2, 4, 8, 16, 32, 64]
proof = "shared_equivalence"
source = "Boolean complement law"
pattern = { kind = "binary", op = "and", left = { kind = "any_expr", bind = "x" }, right = { kind = "any_expr", bind = "y" } }
