source = "fixed-width logical shift annihilator"
pattern = { kind = "binary", op = "shl", left = { kind = "any_const", bind = "z" }, right = { kind = "any_expr", bind = "x" } }
when = [{ check = "is_zero", expr = "z" }]
rewrite = { build = "const", value = 0 }

[[rules]]
name = "shr_zero_input_annihilates"
widths = [1, 2, 4, 8, 16, 32, 64]
