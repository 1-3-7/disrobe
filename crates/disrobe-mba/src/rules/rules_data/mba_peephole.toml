source = "Boolean algebra annihilator"
pattern = { kind = "binary", op = "or", left = { kind = "any_expr", bind = "x" }, right = { kind = "any_const", bind = "m" } }
when = [{ check = "is_all_ones", expr = "m" }]
rewrite = { build = "all_ones" }

[[rules]]
name = "or_self_idempotent"
widths = [1, 2, 4, 8, 16, 32, 64]
proof = "shared_equivalence"
source = "Boolean algebra idempotence"
pattern = { kind = "binary", op = "or", left = { kind = "any_expr", bind = "x" }, right = { kind = "any_expr", bind = "y" } }
