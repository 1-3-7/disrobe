[[rules]]
name = "shl_constant_folds"
widths = [1, 2, 4, 8, 16, 32, 64]
proof = "shared_equivalence"
source = "SMT-LIB fixed-size bit-vector bvshl constant evaluation"
pattern = { kind = "binary", op = "shl", left = { kind = "any_const", bind = "value" }, right = { kind = "any_const", bind = "amount" } }
rewrite = { build = "fold_shl_const", value = "value", amount = "amount" }

[[rules]]
name = "shr_constant_folds"
widths = [1, 2, 4, 8, 16, 32, 64]
proof = "shared_equivalence"
source = "SMT-LIB fixed-size bit-vector bvlshr constant evaluation"
pattern = { kind = "binary", op = "shr", left = { kind = "any_const", bind = "value" }, right = { kind = "any_const", bind = "amount" } }
rewrite = { build = "fold_shr_const", value = "value", amount = "amount" }

[[rules]]
name = "shl_count_at_or_above_width_is_zero"
widths = [1, 2, 4, 8, 16, 32, 64]
proof = "shared_equivalence"
source = "SMT-LIB fixed-size bit-vector bvshl with a count at least the operand width"
pattern = { kind = "binary", op = "shl", left = { kind = "any_expr", bind = "x" }, right = { kind = "any_const", bind = "amount" } }
when = [{ check = "shift_count_at_least_width", expr = "amount" }]
rewrite = { build = "const", value = 0 }

[[rules]]
name = "shr_count_at_or_above_width_is_zero"
widths = [1, 2, 4, 8, 16, 32, 64]
proof = "shared_equivalence"
source = "SMT-LIB fixed-size bit-vector bvlshr with a count at least the operand width"
pattern = { kind = "binary", op = "shr", left = { kind = "any_expr", bind = "x" }, right = { kind = "any_const", bind = "amount" } }
when = [{ check = "shift_count_at_least_width", expr = "amount" }]
rewrite = { build = "const", value = 0 }

[[rules]]
name = "shl_in_range_count_normalizes_to_multiplication"
widths = [1, 2, 4, 8, 16, 32, 64]
proof = "shared_equivalence"
source = "fixed-width logical left shift as multiplication by two to the count"
pattern = { kind = "binary", op = "shl", left = { kind = "any_expr", bind = "x" }, right = { kind = "any_const", bind = "amount" } }
when = [{ check = "shift_count_below_width", expr = "amount" }]
rewrite = { build = "shl_const_as_mul", expr = "x", amount = "amount" }

[[rules]]
name = "ite_zero_selects_otherwise"
widths = [1, 2, 4, 8, 16, 32, 64]
proof = "shared_equivalence"
source = "fixed-width conditional with a zero condition"
pattern = { kind = "ite", cond = { kind = "any_const", bind = "c" }, then = { kind = "any_expr", bind = "then" }, otherwise = { kind = "any_expr", bind = "otherwise" } }
when = [{ check = "is_zero", expr = "c" }]
rewrite = { build = "use", expr = "otherwise" }

[[rules]]
name = "ite_nonzero_selects_then"
widths = [1, 2, 4, 8, 16, 32, 64]
proof = "shared_equivalence"
source = "fixed-width conditional with a nonzero condition"
pattern = { kind = "ite", cond = { kind = "any_const", bind = "c" }, then = { kind = "any_expr", bind = "then" }, otherwise = { kind = "any_expr", bind = "otherwise" } }
when = [{ check = "is_non_zero", expr = "c" }]
rewrite = { build = "use", expr = "then" }

[[rules]]
name = "slice_const_low_bit"
widths = [1, 2, 4, 8, 16, 32, 64]
proof = "shared_equivalence"
source = "fixed-width extraction of bit zero from a constant"
pattern = { kind = "slice", inner = { kind = "any_const", bind = "c" }, lo = 0, hi = 1 }
rewrite = { build = "slice_const", expr = "c", lo = 0, hi = 1 }

[[rules]]
name = "slice_const_next_bit"
widths = [2, 4, 8, 16, 32, 64]
proof = "shared_equivalence"
source = "fixed-width extraction of bit one from a constant"
pattern = { kind = "slice", inner = { kind = "any_const", bind = "c" }, lo = 1, hi = 2 }
rewrite = { build = "slice_const", expr = "c", lo = 1, hi = 2 }

[[rules]]
name = "compose_const_low_bit"
widths = [1, 2, 4, 8, 16, 32, 64]
proof = "shared_equivalence"
source = "fixed-width composition with a one-bit low constant field"
pattern = { kind = "compose", low = { kind = "any_const", bind = "low" }, high = { kind = "any_const", bind = "high" }, low_bits = 1 }
rewrite = { build = "compose_const", low = "low", high = "high", low_bits = 1 }

[[rules]]
name = "compose_const_low_byte"
widths = [1, 2, 4, 8, 16, 32, 64]
proof = "shared_equivalence"
source = "fixed-width composition with an eight-bit low constant field"
pattern = { kind = "compose", low = { kind = "any_const", bind = "low" }, high = { kind = "any_const", bind = "high" }, low_bits = 8 }
rewrite = { build = "compose_const", low = "low", high = "high", low_bits = 8 }
