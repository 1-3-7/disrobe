[package]
name = "disrobe-playground"
description = "Anti-gaming accuracy playground: manifest-pinned oracles, per-oracle-kind reporting, and a circular-test detector that rejects self-referential accuracy checks."
version.workspace = true
readme.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
keywords = ["deobfuscator", "testing", "oracle", "anti-gaming", "reverse-engineering"]
categories = ["development-tools::testing"]

[lints]
workspace = true

[features]
default = ["chain", "auto"]
auto = [
    "disrobe-core/chain",
    "disrobe-pass-native/chain",
    "dep:disrobe-passes",
    "disrobe-passes/full",
]
chain = ["auto"]

[dependencies]
disrobe-core = { workspace = true, features = ["chain"] }
disrobe-pass-native = { workspace = true }
disrobe-similarity = { workspace = true }
disrobe-pass-wasm-deob = { workspace = true }
disrobe-pass-py-decompile = { workspace = true }
disrobe-passes = { workspace = true, optional = true }
disrobe-py-marshal = { workspace = true }
blake3 = { workspace = true }
sha2 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
walkdir = "2.5.0"
thiserror = { workspace = true }

[dev-dependencies]
tempfile = "3"

[package.metadata.disrobe]
level = 9
group = "engine"
