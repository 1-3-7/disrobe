[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "disrobe-pytrace"
version = "0.1.0"
description = "Python-level audit-hook + sys.settrace fallback for capturing PyArmor v6/v7 user-code bytecode. Companion to the disrobe deobfuscator suite. The true C-level PyEval_EvalCode intercept is reserved for v0.2."
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Security",
    "Topic :: Software Development :: Disassemblers",
]

[tool.maturin]
features = ["pyo3/extension-module"]
module-name = "disrobe_pytrace"
strip = true
