[package]
name = "disrobe-pyarmor-pytrace"
description = "Python-level audit-hook + sys.settrace fallback for capturing PyArmor v6/v7 user-code bytecode. Walks gc.get_objects() for orphan code objects matching the wrapper basename. C-eval gap (settrace misses runtime-DLL direct calls) is covered by disrobe-pyarmor-cextract."
version.workspace = true
readme.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
keywords = ["pyarmor", "deobfuscation", "tracer", "python", "pyo3"]
categories = ["command-line-utilities", "development-tools", "parser-implementations"]

[lib]
name = "disrobe_pytrace"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { workspace = true }

[lints]
workspace = true
