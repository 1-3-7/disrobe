[package]
name = "disrobe-pass-mobile"
description = "Cross-platform mobile bundle extractors: React Native + Hermes bytecode, Flutter Dart AOT and kernel, Xamarin/MAUI, Cordova/Capacitor, NativeScript."
version.workspace = true
readme.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
keywords = ["mobile", "hermes", "flutter", "dart", "react-native"]
categories.workspace = true

[lints]
workspace = true

[dependencies]
disrobe-binfmt = { workspace = true, optional = true }
disrobe-bytes = { workspace = true }
disrobe-cfg = { workspace = true }
disrobe-core = { workspace = true }
disrobe-nir = { workspace = true }
disrobe-pass-jvm = { workspace = true, optional = true }
object = { workspace = true }
yaxpeax-arch = { workspace = true }
yaxpeax-arm = { workspace = true }
zip = { workspace = true }
miette = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
blake3 = { workspace = true }
sha2 = { workspace = true }

[features]
default = []
chain = ["disrobe-core/chain"]
jni = ["dep:disrobe-pass-jvm"]
native-image = ["dep:disrobe-binfmt"]

[dev-dependencies]
disrobe-testkit = { workspace = true }
boa_engine = { workspace = true }
oxc_allocator = { workspace = true }
oxc_parser = { workspace = true }
oxc_span = { workspace = true }
