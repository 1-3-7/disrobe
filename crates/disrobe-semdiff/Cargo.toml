[package]
name = "disrobe-semdiff"
description = "Semantic cross-artifact diff over the architecture-neutral normalized IR (the Mir rung): functions are matched by name and fingerprinted by a relocation-invariant signature (op sequence with call targets normalized to callee symbol name, plus the relative control-flow edge set), so two builds of the same source diff to nothing while a single changed function is reported and no other."
version.workspace = true
