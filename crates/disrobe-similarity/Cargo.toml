[package]
name = "disrobe-similarity"
description = "Cross-image function matching for stripped binaries, anchored on the data a function references (string literals, unusual constants, named import calls). A pair is reported as a match only when the reference set is identical and occurs exactly once on each side, so an anchor shared by a third function is refused with its candidate set instead of guessed."
