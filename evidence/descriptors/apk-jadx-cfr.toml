id = "apk-jadx-cfr"
ecosystem = "android"
title = "APK / DEX decompilation: disrobe vs JADX vs CFR"
claim = "On their respective committed EdgeCases inputs, one real javac run scores every tool by the same rule, and a main-class method counts clean only from a recovered file that javac type-checked end to end. A leg publishes a lead only when the compiler certified both of its sides, so a file javac stopped parsing ends its leg for both tools instead of scoring either one."
oracle_strength = "recompile-only"
ci = true

[oracle]
kind = "headtohead-import"
external = "real javac (JDK), per-method recompile error-free against a STUBBED (empty) classpath so a wrong recovered signature cannot resolve against the original classes; the SAME oracle and the same certification rule score every tool, and a file the compiler stopped parsing certifies no method for either side"
reproduce = "cargo run --locked -p disrobe-bench-head-to-head -- --check --only apk-jadx-cfr"
note = "Needs javac, jadx, and cfr on PATH, with cfr.jar provisioned by evidence/competitors/install-linux.sh. Recompile-only: each method body compiles clean, not asserted byte-equivalent. The DEX leg compares disrobe with JADX on EdgeCases.dex; the JAR leg compares disrobe with CFR on EdgeCases-baseline.jar, because CFR cannot read DEX. The STRONG asserted JVM number is the 131/131 per-method recompile gate (jvm-javac descriptor). Both decompilers emit synthetic accessor/lambda/bridge methods, so the per-tool emitted-method count differs by design; the claim therefore compares clean-method counts within each leg while reporting recompile-clean rates alongside them. A recovered file that javac stops parsing yields no method-level verdict at all, so its row publishes the method count the tool emitted and no rate, and its leg publishes no lead; the row is neither a zero nor a win for the other side. Each leg carries its own floor and its own reason, because the JAR leg certifies every method it recovers and the DEX leg certifies a third of them, and one floor over both would state something true of neither."

[measured]
result_file = "apk-jadx-cfr.json"

[[measured.pairs]]
id = "dex"
label = "Android DEX"
metric = "recompile-clean main-class methods (clean / emitted)"
disrobe = "disrobe (in-house Dalvik, DEX input)"
competitor = "jadx (DEX input)"
competitor_label = "JADX"
disrobe_floor = 34.0
floor_reason = "This leg carried the 95.0 floor while it was uncertified, so the floor was never tested against a measurement. The recovered DEX source did not parse at all: the emitter printed the D8 nest-access and interface-companion names verbatim, and a leading hyphen is not a legal Java identifier, so javac stopped at line 2 and type-checked nothing. With the names rewritten the leg certified for the first time at 20 of 132, and it measures 45 of 131 now. Read that rise as a routing change, not as better recovery: the DEX path now translates the dex to class files and renders those through the JVM renderer, which declares its locals, instead of using the direct Dalvik source renderer, which did not. No individual method is recovered better than it was; a different renderer emits them. The 82 per cent of diagnostics that were one defect, the Dalvik body renderer assigning locals it never declares, are gone because that renderer is no longer on this path. The floor is pinned just under the new measurement as a ratchet against regression, not as a target, and the JVM renderer certifies 131 of 131 on the JAR leg, so the remaining gap is per-method recovery quality rather than the shape of the output."

[[measured.pairs]]
id = "jar"
label = "JVM classfile"
metric = "recompile-clean main-class methods (clean / emitted)"
disrobe = "disrobe (in-house JVM, JAR input)"
competitor = "cfr (JAR input)"
competitor_label = "CFR"
