note = "recompile-only: each method body compiles clean, not asserted byte-equivalent. The STRONG asserted JVM number is the 131/131 per-method recompile gate (jvm-javac descriptor). Both decompilers emit synthetic accessor/lambda/bridge methods, so the per-tool emitted-method count differs by design; the comparable number is the recompile-clean rate plus the absolute clean-method count."

