id = "binfmt-extract"
ecosystem = "binfmt"
title = "Container, archive, firmware, and encrypted-volume extraction"
claim = "disrobe detects 103 container, archive, firmware, and encrypted-volume formats. 102 carry a generic in-tree payload extractor and LUKS1 carries a bounded raw-volume-key route plus a typed keyless wall. 28 generic routes write member bytes from an input this repository commits that bsdtar 3.8.8, 7-Zip 26.02 or the format's own decompressor confirms; 13 more extract from a committed input that no installed reference tool confirms; the committed DMG and PAR2 inputs reach detection only; 59 generic routes have no committed input. LUKS1 is graded separately against tracked plaintext."
oracle_strength = "coverage-self-reported"
ci = true

[oracle]
kind = "recovery-import"
external = "the delivered count is the generic formats whose member bytes, extracted from a committed input, match bsdtar 3.8.8, 7-Zip 26.02 or the format's own decompressor; the 13 extractions no installed reference tool confirms are not counted. The committed DMG and PAR2 inputs reach detection only. The LUKS1 route is separately compared with tracked plaintext and an independently generated encrypted fixture. Individual format tests may use external byte manifests, but the 59 generic formats with no committed input carry no measurement at all"
reproduce = "cargo test -p disrobe-binfmt published_container_counts_match_this_enum"

[source]
recovery_group = "Detection and extraction breadth (counts, not percentages)"
recovery_bar = "Containers"
