id = "binfmt-extract"
ecosystem = "binfmt"
title = "Container, archive, and firmware in-tree extraction"
claim = "disrobe declares 100 container, archive, and firmware formats and carries an in-tree payload extractor for each, with no metadata-only or external-tool-gated formats. 33 of the 100 are driven to member bytes on disk by an input this repository commits. The other 67 have no committed input, so they are unverified rather than shown to fail."
oracle_strength = "coverage-self-reported"
ci = true

[oracle]
kind = "recovery-import"
external = "the delivered count is disrobe extracting from its own committed corpus and counting the formats that wrote bytes, not an independent check. A member-byte diff against an external extractor is the proof this row does not yet have, and the 67 formats with no committed input carry no measurement at all"
reproduce = "cargo test -p disrobe-binfmt published_container_counts_match_this_enum"

[source]
recovery_group = "Detection and extraction breadth (counts, not percentages)"
recovery_bar = "Containers"
