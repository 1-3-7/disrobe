id = "dalvik-realapk-coverage"
ecosystem = "android"
title = "Dalvik body-lowering coverage on real FOSS APKs"
claim = "disrobe lowers a Dalvik method body (rather than a throw-stub) for the large majority of methods on real FOSS APKs."
oracle_strength = "coverage-self-reported"
ci = false

[oracle]
kind = "recovery-import"
external = "none external: this counts methods for which the lifter returned a body vs a throw-stub (self-reported coverage, NOT verifier-attested)"
