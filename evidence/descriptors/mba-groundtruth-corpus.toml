id = "mba-groundtruth-corpus"
ecosystem = "mba"
title = "Mixed-boolean-arithmetic recovery graded against originals the recovery path never reads"
claim = "across the 316 committed mixed-boolean-arithmetic cases, every answer disrobe returns agrees with the held-out original, and a case whose simplification exceeds a 2 second per-entry budget is named as a refusal rather than counted either way. A reference run answered 247 cases, refused 69, and an external bitvector solver proved 236 of the answers equal to the original while refuting none."
oracle_strength = "coverage-self-reported"
ci = true

[oracle]
kind = "recovery-import"
external = "The originals are held out of the input the pass receives. MBA-Obfuscator (ICICS 2021, MIT, pinned at commit 8574ef8) produced 100 of the 316 cases from integer kernels selected by this repository; their obfuscated form is third-party and the original is the pre-transform kernel. The other 216 cases come from a forward rewriter under evidence/generators/mba that links no disrobe crate, as the workspace health check verifies over the resolved dependency graph. Grading combines a behavioural differential against check vectors computed by the generator's own evaluator with z3 or bitwuzla proofs that the recovered expression equals the held-out original over every input."
reproduce = "cargo test -p disrobe-mba --test evidence_corpus_gate"
note = "The tier is coverage-self-reported because the published number is a population count, not a correctness rate. Seeded wrong recoveries provide controls: returning one more than the truth is rejected on every graded entry, while replacing addition with exclusive-or is rejected except where that substitution preserves the value. Before proving recovered expressions, the solver leg confirms that it can refute a non-equivalent pair. Budget refusals are concentrated in 64-bit polynomial and non-polynomial output from the external obfuscator and in multiplication kernels. They measure the current simplifier's ceiling under the 2 second per-entry budget and are reported by name. The graded count varies slightly with machine load, so the gate enforces a floor rather than an exact figure. A second lane uses published datasets that ship their originals (MBA-Blast, MBA-Solver, Loki). It is fetched at a pinned sha256 rather than committed because none carries a licence this repository may redistribute; it graded 1470 of 1572 entries with 0 disagreements locally and is reported as a local figure, not a continuous-integration figure."

[source]
recovery_group = "Ground-truth corpora whose originals the recovery path never reads (counts)"
