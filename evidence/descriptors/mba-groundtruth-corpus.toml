id = "mba-groundtruth-corpus"
ecosystem = "mba"
title = "Mixed-boolean-arithmetic recovery graded against originals the recovery path never reads"
claim = "across the 316 committed mixed-boolean-arithmetic cases, every answer disrobe returns agrees with the held-out original, and a case whose simplification exceeds a 2 second per-entry budget is named as a refusal rather than counted either way. A reference run answered 247 cases, refused 69, and an external bitvector solver proved 236 of the answers equal to the original while refuting none."
oracle_strength = "coverage-self-reported"
ci = true

[oracle]
kind = "recovery-import"
external = "the originals are held out of the input the pass receives. 100 of the 316 cases were produced by MBA-Obfuscator (ICICS 2021, MIT, pinned at commit 8574ef8) run over integer kernels this repository chose, so their obfuscated form is third-party and the original is the pre-transform kernel. The other 216 come from a forward rewriter under evidence/generators/mba that links no disrobe crate at all, which the workspace health check proves over the resolved dependency graph. Grading has two legs: a behavioural differential against check vectors the generator computed with its own evaluator, so a wrong answer cannot agree with a value the recovery path produced, and z3 or bitwuzla proving the recovered expression equal to the held-out original over every input, which is exact rather than sampled."
reproduce = "cargo test -p disrobe-mba --test evidence_corpus_gate"
note = "The tier is coverage-self-reported because the published number is a population count, not a correctness rate. What the corpus does establish is that the grading is not vacuous: a seeded-wrong recovery returning one more than the truth is rejected on every graded entry, one that swaps addition for exclusive-or is rejected on all but the handful of expressions where the substitution happens to preserve the value, and the solver leg refuses to run unless it can first refute a pair that is not equivalent. The budget refusals are concentrated in 64-bit polynomial and non-polynomial output from the external obfuscator and in multiplication kernels; they are a measured ceiling of the current simplifier under a 2 second budget, reported by name, and not a failure of the corpus. The graded count moves a little with machine load, so the gate enforces a floor on it rather than an exact figure, which stops a run that refuses everything from passing by grading nothing. A second lane over published datasets that ship their originals (MBA-Blast, MBA-Solver, Loki) is fetched at a pinned sha256 rather than committed, because none of them carries a licence this repository may redistribute; it graded 1470 of 1572 entries with 0 disagreements locally and is reported as a local figure, never a continuous-integration one."

[source]
