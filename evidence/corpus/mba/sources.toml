title = "Ground-truth sources for the mixed-boolean-arithmetic corpus"
note = """
Every entry in cases.jsonl is a triple: an obfuscated expression, a held-out original in
truth.jsonl, and metadata naming the source, the seed, the bit width and the variable count. The
producing code lives under evidence/generators/mba and shares no crate with disrobe-mba, so a bug in
the recovery path cannot hide inside the thing that grades it. cargo run -p xtask -- health proves
that disjointness over the resolved dependency graph.
Sources are ranked. A real external obfuscator outranks a public dataset, which outranks the
in-house forward rewriter. The in-house rows exist for width and variable-count coverage and are
regression evidence, not proof of capability.
"""

[[source]]
id = "external-obfuscator"
rank = 1
kind = "third-party obfuscator run over originals we chose"
tool = "MBA-Obfuscator (Liu, Zhu, Zhao, Yu, ICICS 2021)"
upstream = "https://github.com/nhpcc502/MBA-Obfuscator"
commit = "8574ef8537f884ed7bd38da7b7bc630e8e8fc8f6"
licence = "MIT"
reproduce = "uv run --python 3.12 --with z3-solver --with sympy --with numpy python evidence/generators/mba/fetch_external.py"
raw_input = "evidence/corpus/mba/external/mba-obfuscator.jsonl"
transforms = ["l", "p", "np_zero", "np_recur", "np_replace"]
widths = [8, 64]
note = """
The originals are twelve integer kernels this repository chose; the obfuscated forms are whatever the
upstream tool emitted, so the ground truth is not disrobe-authored. Three-variable kernels exceeded a
90 second per-case budget upstream and were skipped rather than waited out, which is why the kept set
is fifty tool rows rather than sixty.
"""

[[source]]
id = "public-dataset"
rank = 2
kind = "published datasets that ship their originals"
reproduce = "python evidence/generators/mba/fetch_datasets.py && ./target/release/disrobe-evidence-mba datasets --input target/mba-datasets --out target/mba-dataset-corpus"
note = """
These files are fetched at a pinned sha256 and are never committed, because none of them carries a
licence this repository may redistribute under. The fetch script holds the pins, the ingest path is
the same one the committed sources use, and every pair is re-verified as an identity before it is
accepted.
"""

