[[source]]
id = "in-house"
rank = 3
kind = "forward rewriter written from the published identity tables"
reproduce = "cargo run -p disrobe-evidence-mba -- generate --root ."
widths = [2, 4, 8, 16, 32, 64]
families = ["linear", "polynomial", "mixed"]
note = """
Eighteen kernels over one to eight variables, expanded by a rewriter that applies two-variable
boolean-arithmetic identities from Zhou, Main, Gu and Johnson (WISA 2007) and Warren, Hacker's
Delight. Every expansion is re-checked against the original before it is kept: exhaustively when the
input space is at most twenty bits, otherwise over structured plus four thousand seeded vectors.
This source proves regression, never capability, because the rewriter and the recovery path both
draw on the same published identities even though they share no code.
"""

[unattempted]
note = """
Two stronger sources were attempted and did not land this round.
Tigress is gated behind a registration form asking for a name, an institution and an email address,
followed by a licence acceptance step, so it cannot be automated and needs the owner to register.
o-mvll ships prebuilt plugins for Linux and macOS only; the Windows Subsystem for Linux on this
machine reports HCS_E_SERVICE_NOT_AVAILABLE because the virtual machine platform feature is not
installed, so the Linux plugin cannot run here. obfuscator-llvm is source only and needs a full LLVM
build, which does not fit the disk ceiling this workspace runs under.
"""
