[workspace]
resolver = "3"
members = [
    "crates/disrobe-binfmt",
    "crates/disrobe-cli",
    "crates/disrobe-core",
    "crates/disrobe-ir",
    "crates/disrobe-llm-metadata",
    "crates/disrobe-mcp",
    "crates/disrobe-pass-as3",
    "crates/disrobe-plugin-host",
    "crates/disrobe-pass-beam",
    "crates/disrobe-pass-dotnet",
    "crates/disrobe-pass-go",
    "crates/disrobe-pass-js-deob",
    "crates/disrobe-pass-jvm",
    "crates/disrobe-pass-lua",
    "crates/disrobe-pass-mobile",
    "crates/disrobe-pass-native",
    "crates/disrobe-pass-nuitka",
    "crates/disrobe-pass-php",
    "crates/disrobe-pass-pickle",
    "crates/disrobe-playground",
    "crates/disrobe-pass-py-decompile",
    "crates/disrobe-pass-py-deob",
    "crates/disrobe-pass-py-disasm",
    "crates/disrobe-pass-pyarmor",
    "crates/disrobe-pass-pyfreeze",
    "crates/disrobe-pass-pyinstaller",
    "crates/disrobe-pass-ruby",
    "crates/disrobe-pass-shell",
    "crates/disrobe-pass-sourcedefender",
    "crates/disrobe-pass-swift-objc",
    "crates/disrobe-pass-wasm-deob",
    "crates/disrobe-py-marshal",
    "crates/disrobe-pyarmor-cextract",
    "crates/disrobe-pyarmor-pytrace",
    "crates/disrobe-python",
    "crates/disrobe-validator",
    "xtask",
]

[workspace.package]
version = "0.9.0"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"
repository = "https://github.com/1-3-7/disrobe"
homepage = "https://github.com/1-3-7/disrobe"
readme = "README.md"
authors = ["1-3-7"]
keywords = ["deobfuscator", "decompiler", "reverse-engineering", "binary-analysis"]
categories = ["development-tools", "command-line-utilities"]

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"
unreachable_pub = "warn"
missing_debug_implementations = "warn"
unused = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "warn"
panic = "warn"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "allow"
print_stderr = "allow"
multiple_crate_versions = "allow"
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
similar_names = "allow"
too_many_lines = "allow"
cognitive_complexity = "allow"
struct_excessive_bools = "allow"
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_sign_loss = "allow"
cast_precision_loss = "allow"
cast_lossless = "allow"
needless_pass_by_value = "allow"
return_self_not_must_use = "allow"

[workspace.dependencies]
aes = "0.8.4"
anstyle = "1.0.14"
ar = "0.9.0"
async-trait = "0.1.89"
axum = { version = "0.8.9", features = ["ws"] }
base64 = "0.22.1"
blake3 = "1.8.5"
boa_engine = "0.20.0"
brotli = "8.0.2"
bytecheck = "0.8.2"
bytes = "1.11.1"
bzip2-rs = "0.1.2"
cab = "0.6.0"
camino = "1.2.2"
capstone = "0.13.0"
cbc = "0.1.2"
ciborium = "0.2.2"
clap = "4.6.1"
clap_complete = "4.6.5"
clap_mangen = "0.2.33"
color-eyre = "0.6.5"
console = "0.16.3"
cpp_demangle = "0.5.1"
ctr = "0.9.2"
des = "0.8.1"
disrobe-binfmt = { path = "crates/disrobe-binfmt", version = "0.9.0" }
disrobe-core = { path = "crates/disrobe-core", version = "0.9.0" }
disrobe-ir = { path = "crates/disrobe-ir", version = "0.9.0" }
disrobe-llm-metadata = { path = "crates/disrobe-llm-metadata", version = "0.9.0" }
disrobe-mcp = { path = "crates/disrobe-mcp", version = "0.9.0" }
disrobe-pass-as3 = { path = "crates/disrobe-pass-as3", version = "0.9.0" }
disrobe-pass-beam = { path = "crates/disrobe-pass-beam", version = "0.9.0" }
disrobe-pass-dotnet = { path = "crates/disrobe-pass-dotnet", version = "0.9.0" }
disrobe-pass-go = { path = "crates/disrobe-pass-go", version = "0.9.0" }
disrobe-pass-js-deob = { path = "crates/disrobe-pass-js-deob", version = "0.9.0" }
disrobe-pass-jvm = { path = "crates/disrobe-pass-jvm", version = "0.9.0" }
disrobe-pass-lua = { path = "crates/disrobe-pass-lua", version = "0.9.0" }
disrobe-pass-mobile = { path = "crates/disrobe-pass-mobile", version = "0.9.0" }
disrobe-pass-native = { path = "crates/disrobe-pass-native", version = "0.9.0" }
disrobe-pass-nuitka = { path = "crates/disrobe-pass-nuitka", version = "0.9.0" }
disrobe-pass-php = { path = "crates/disrobe-pass-php", version = "0.9.0" }
disrobe-pass-pickle = { path = "crates/disrobe-pass-pickle", version = "0.9.0" }
disrobe-pass-py-decompile = { path = "crates/disrobe-pass-py-decompile", version = "0.9.0" }
disrobe-pass-py-deob = { path = "crates/disrobe-pass-py-deob", version = "0.9.0" }
disrobe-pass-py-disasm = { path = "crates/disrobe-pass-py-disasm", version = "0.9.0" }
disrobe-pass-pyarmor = { path = "crates/disrobe-pass-pyarmor", version = "0.9.0" }
disrobe-pass-pyfreeze = { path = "crates/disrobe-pass-pyfreeze", version = "0.9.0" }
disrobe-pass-pyinstaller = { path = "crates/disrobe-pass-pyinstaller", version = "0.9.0" }
disrobe-pass-ruby = { path = "crates/disrobe-pass-ruby", version = "0.9.0" }
disrobe-pass-shell = { path = "crates/disrobe-pass-shell", version = "0.9.0" }
disrobe-pass-sourcedefender = { path = "crates/disrobe-pass-sourcedefender", version = "0.9.0" }
disrobe-pass-swift-objc = { path = "crates/disrobe-pass-swift-objc", version = "0.9.0" }
disrobe-pass-wasm-deob = { path = "crates/disrobe-pass-wasm-deob", version = "0.9.0" }
disrobe-playground = { path = "crates/disrobe-playground", version = "0.9.0" }
disrobe-plugin-host = { path = "crates/disrobe-plugin-host", version = "0.9.0" }
disrobe-py-marshal = { path = "crates/disrobe-py-marshal", version = "0.9.0" }
divan = "0.1.21"
eyre = "0.6.12"
fastwebsockets = "0.10.0"
flate2 = "1.1.9"
futures = "0.3.32"
fxhash = "0.2.1"
gimli = "0.32.3"
goblin = "0.10.5"
human-panic = "2.0.5"
hyper = "1.9.0"
iced-x86 = "1.21.0"
indexmap = { version = "2.14.0", features = ["serde"] }
indicatif = "0.18.4"
insta = "1.47.2"
insta-cmd = "0.6.0"
liblzma = "0.4.6"
lsp-server = "0.7.9"
lsp-types = "0.97.0"
md5 = "0.7"
memchr = "2.8.0"
memmap2 = "0.9.10"
miette = "7.6.0"
msi = "0.10.0"
msvc-demangler = "0.11.0"
num_cpus = "1.17.0"
object = "0.37.3"
once_cell = "1.21.4"
owo-colors = "4.3.0"
oxc = "0.40.1"
oxc_allocator = "0.40.1"
oxc_ast = "0.40.1"
oxc_codegen = "0.40.1"
oxc_parser = "0.40.1"
oxc_semantic = "0.40.1"
oxc_span = "0.40.1"
pdb = "0.8.0"
plist = "1.9.0"
postcard = { version = "1.1.3", features = ["use-std"] }
postcard-schema = { version = "0.2.5", features = ["use-std"] }
proptest = "1.11.0"
prost = "0.13.5"
prost-types = "0.13.5"
protoc-bin-vendored = "3.2.0"
pyo3 = { version = "0.24", features = ["abi3", "abi3-py39", "extension-module"] }
pyo3-ffi = { version = "0.24", features = ["abi3", "abi3-py39", "extension-module"] }
rand = { version = "0.10.1", default-features = false, features = ["std", "std_rng", "sys_rng", "thread_rng"] }
rayon = "1.12.0"
rc4 = "0.1.0"
regex = "1.12.3"
reqwest = { version = "0.12.28", default-features = false, features = ["blocking", "json", "rustls-tls", "gzip"] }
rkyv = "0.8.16"
rmcp = { version = "0.16", features = ["server", "macros", "transport-io"] }
rmp-serde = "1.3.1"
rpm = "0.18.4"
rustc-demangle = "0.1.27"
serde = { version = "1.0.228", features = ["derive", "rc"] }
serde_json = "1.0.150"
sevenz-rust2 = "0.13.2"
sha2 = "0.10.9"
tar = "0.4.46"
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["full"] }
toml = "0.9.12"
tonic = "0.13.1"
tonic-build = "0.13.1"
tonic-health = "0.13.1"
tonic-reflection = "0.13.1"
tower = "0.5.3"
tower-http = { version = "0.6.11", features = ["cors", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
utoipa = "5.5.0"
wait-timeout = "0.2.1"
walrus = "0.24.5"
wasm-tools = "1.250.0"
wasmparser = "0.250.0"
wasmtime = "36.0.10"
yaxpeax-arch = "0.3.2"
yaxpeax-arm = "0.3.1"
zip = { version = "2.4.2", default-features = false, features = ["aes-crypto", "zstd", "deflate64", "deflate", "deflate-zlib"] }
zstd = "0.13.3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"

[profile.bench]
inherits = "release"
debug = true
strip = "none"

[profile.dev]
opt-level = 1

[profile.test]
opt-level = 1
