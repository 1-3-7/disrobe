[workspace.package]
version = "0.10.5"
edition = "2024"
rust-version = "1.95"
license = "Elastic-2.0"
repository = "https://github.com/1-3-7/disrobe"
homepage = "https://github.com/1-3-7/disrobe"
readme = "README.md"
authors = ["1-3-7"]
keywords = ["deobfuscator", "decompiler", "reverse-engineering", "binary-analysis"]
categories = ["development-tools", "command-line-utilities"]

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"
unreachable_pub = "warn"
missing_debug_implementations = "warn"
unused = { level = "warn", priority = -1 }
unexpected_cfgs = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "warn"
panic = "warn"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "allow"
print_stderr = "allow"
missing_panics_doc = "warn"
return_self_not_must_use = "warn"
# Cast lints stay allowed: this is a binary-parsing and disassembly workspace where
# `as` casts on fixed-width parsed fields (widening a u8/u16/u32 header field, masking a
# byte out of a u32, folding a hash, narrowing a format-bounded count, viewing a packed
# field as signed) are deliberate and correct. Auditing every cast warning with the lints
# set to warn surfaced 1694 casts; all but a handful of file-controlled allocation sizes
# were intentional and bounded by the format or a guard, and those genuine cases were
# fixed at the source (clamping the allocation, not the cast). Enforcing these would mean
# ~1700 per-call allows with no safety gain, so they are a documented decision, not silent.
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_sign_loss = "allow"
cast_precision_loss = "allow"
cast_lossless = "allow"
# Decorative style thresholds kept allowed: each still fires across this codebase
# (module_name_repetitions 801, missing_errors_doc 771, too_many_lines 87, similar_names 70,
# multiple_crate_versions 57 from transitive deps, must_use_candidate 48,
# needless_pass_by_value 48, struct_excessive_bools 20, cognitive_complexity 16). They are
# subjective style for a large reverse-engineering codebase, not correctness, so they are a
# documented decision. The two that were already clean (missing_panics_doc,
# return_self_not_must_use) are enforced as warn above.
multiple_crate_versions = "allow"
module_name_repetitions = "allow"
missing_errors_doc = "allow"
must_use_candidate = "allow"
similar_names = "allow"
too_many_lines = "allow"
cognitive_complexity = "allow"
struct_excessive_bools = "allow"
needless_pass_by_value = "allow"

