[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "disrobe"
version = "0.10.0"
description = "deobfuscator and decompiler suite, Python bindings"
readme = "README.md"
license = { text = "Elastic-2.0" }
requires-python = ">=3.9"
classifiers = [
    "License :: Other/Proprietary License",
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Disassemblers",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://github.com/1-3-7/disrobe"
Repository = "https://github.com/1-3-7/disrobe"
Issues = "https://github.com/1-3-7/disrobe/issues"

[tool.maturin]
manifest-path = "../../crates/disrobe-python/Cargo.toml"
features = ["pyo3/extension-module"]
python-source = "."
module-name = "disrobe.disrobe"
