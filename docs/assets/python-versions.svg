  <line x1="28.00" y1="430.00" x2="892.00" y2="430.00" stroke="#333333" stroke-width="1"/>
  <text x="28.00" y="442.00" font-size="10" fill="#828282" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" text-anchor="start" font-weight="400">Deterministic tools reproduce identical output for identical input and cannot contaminate a benchmark. pychd is LLM-assisted and non-reproducible; its own README flags likely benchmark</text>
  <text x="28.00" y="456.00" font-size="10" fill="#828282" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" text-anchor="start" font-weight="400">contamination, and its deterministic fallback leaves complex bodies as pass. disrobe is fully deterministic and reconstructs bodies.</text>
