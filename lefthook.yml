pre-commit:
  parallel: true
  commands:
    fmt:
      glob: '*.rs'
      run: cargo fmt --all -- --check
    clippy:
      glob: '*.rs'
      run: cargo clippy --workspace --all-targets -- -D warnings
    typos:
      run: typos
    no-root-garbage:
      run: |
        bad=$(git diff --cached --diff-filter=A --name-only -- ':!*/*' | while read f; do
          case "$f" in
            Cargo.toml|Cargo.lock|README.md|NOTICE|LICENSE|CONTRIBUTING.md|LEGAL.md|clippy.toml|deny.toml|rust-toolchain.toml|rustfmt.toml|typos.toml|committed.toml|justfile|lefthook.yml|.gitignore|.gitattributes) ;;
            *) echo "$f" ;;
          esac
        done)
        if [ -n "$bad" ]; then
          echo "[lefthook] refusing to commit root-level files not on allowlist: $bad" >&2
          exit 1
        fi
    no-zero-byte:
      run: |
        bad=$(git diff --cached --diff-filter=A --name-only | while read f; do
          test -f "$f" || continue
          test -s "$f" || echo "$f"
        done)
        if [ -n "$bad" ]; then
          echo "[lefthook] refusing to commit zero-byte files: $bad" >&2
          exit 1
        fi

commit-msg:
  commands:
    committed:
      run: committed {1}

pre-push:
  commands:
    prepush:
      run: cargo run -p xtask -- prepush
