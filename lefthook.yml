pre-commit:
  parallel: true
  commands:
    fmt:
      glob: '*.rs'
      run: rustfmt --edition 2024 --check {staged_files}
    typos:
      run: typos {staged_files}
    staged-files:
      run: sh .githooks/staged_files.sh

commit-msg:
  commands:
    rules:
      run: sh .githooks/commit-msg {1}
    committed:
      run: committed --commit-file {1}

pre-push:
  commands:
    prepush:
      run: sh .githooks/pre-push
      use_stdin: true
