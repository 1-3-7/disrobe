mutation = { path = "crates/disrobe-binfmt/tests/real_lzh_pmarc.rs", test = "a_single_flipped_bit_in_a_pm1_or_pm2_body_fails_the_stored_crc16" }

[[uncovered]]
ecosystem = "go"
reason = "No hermetic exact-equality grader has a mutation control without a tighter wall-clock guard."

