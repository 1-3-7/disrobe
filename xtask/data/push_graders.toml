reason = "The closest exact grader compiles toolchain-spawning support and has no landing-commit Linux run."

[[uncovered]]
ecosystem = "ruby"
reason = "The closest exact grader has no mutation control; graders with controls spawn Ruby or mruby."

[[uncovered]]
