[changelog]
header = """
# Changelog

All notable changes to this project are documented in this file.

The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.1.0/),
and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).
"""
body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}
- {{ commit.message | split(pat="\n") | first | trim }}\
{% if commit.remote.username %} (by @{{ commit.remote.username }}){% endif %}\
{% endfor %}
{% endfor %}\n
"""
footer = """
<!-- generated by git-cliff -->
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = false
split_commits = false
protect_breaking_commits = false
filter_commits = false
topo_order = false
sort_commits = "newer"
tag_pattern = "v[0-9].*"

commit_preprocessors = [
  { pattern = '\((\w+\s)?#([0-9]+)\)', replace = "([#${2}](https://github.com/1-3-7/disrobe/issues/${2}))" },
]

commit_parsers = [
  { message = "^feat", group = "<!-- 0 -->Added" },
  { message = "^add", group = "<!-- 0 -->Added" },
  { message = "^chain", group = "<!-- 0 -->Added" },
  { message = "^change", group = "<!-- 1 -->Changed" },
  { message = "^refactor", group = "<!-- 1 -->Changed" },
  { message = "^perf", group = "<!-- 1 -->Changed" },
  { message = "^deprecat", group = "<!-- 2 -->Deprecated" },
  { message = "^remove", group = "<!-- 3 -->Removed" },
  { message = "^revert", group = "<!-- 3 -->Removed" },
  { message = "^fix", group = "<!-- 4 -->Fixed" },
  { message = "^security", group = "<!-- 5 -->Security" },
  { message = "^audit", group = "<!-- 5 -->Security" },
  { body = ".*security", group = "<!-- 5 -->Security" },
  { message = "^docs", group = "<!-- 6 -->Documentation" },
  { message = "^test", group = "<!-- 6 -->Documentation" },
  { message = "^ci", group = "<!-- 7 -->Tooling" },
  { message = "^build", group = "<!-- 7 -->Tooling" },
  { message = "^chore", group = "<!-- 7 -->Tooling" },
  { message = "^disrobe", group = "<!-- 0 -->Added" },
  { message = ".*", group = "<!-- 8 -->Other" },
]
