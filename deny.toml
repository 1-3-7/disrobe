    { crate = "fallible-iterator", reason = "0.2 vs 0.3 via gimli majors" },
    { crate = "scroll", reason = "0.11 vs 0.13 via goblin vs other binary parsers" },
    { crate = "cfb", reason = "0.10 vs 0.14 via msi vs ole container readers" },
    { crate = "wasmparser", reason = "0.240 vs 0.250 via wasm-tools sub-crate pins" },
    { crate = "wasm-encoder", reason = "matched majors of the wasmparser straddle" },
    { crate = "wasmprinter", reason = "matched majors of the wasmparser straddle" },
    { crate = "wit-bindgen", reason = "component-model tooling straddle" },
