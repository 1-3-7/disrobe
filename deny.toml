[graph]
all-features = true
no-default-features = false

[output]
feature-depth = 1

[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
ignore = [
    { id = "RUSTSEC-2025-0057", reason = "fxhash is unmaintained; disrobe uses it only for non-cryptographic hashing in deterministic chain registries; migration to rustc-hash is scheduled for v0.10" },
    { id = "RUSTSEC-2026-0186", reason = "memmap2 unsound unchecked pointer offset; disrobe memory-maps input files read-only for parsing and never exposes the unchecked-offset API to attacker-controlled arithmetic; no upstream fix released yet" },
    { id = "RUSTSEC-2023-0071", reason = "Marvin Attack timing sidechannel leaks a PRIVATE key during RSA decrypt/sign; no safe upgrade exists upstream (rsa maintainers confirm no patch yet). disrobe's Authenticode module only verifies a signer's PKCS#7 signature against their public key extracted from the certificate chain, it never holds or operates on a private key, so the leaked-secret threat model does not apply to this usage" },
]
unmaintained = "workspace"
yanked = "deny"

[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "Elastic-2.0",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "CC0-1.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.93
exceptions = [
    { allow = ["bzip2-1.0.6"], crate = "libbz2-rs-sys" },
]


[[licenses.clarify]]
crate = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[bans]
multiple-versions = "deny"
wildcards = "deny"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
allow = []
deny = [
    { crate = "openssl", reason = "use rustls instead" },
    { crate = "openssl-sys", reason = "use rustls instead" },
    { crate = "sevenz-rust", reason = "abandoned; use sevenz-rust2" },
    { crate = "xz2", reason = "abandoned; use liblzma" },
    { crate = "serde_yaml", reason = "archived; use serde_yaml_ng" },
    { crate = "criterion", reason = "lead-maintainer AWOL; use divan" },
]
skip = [
    { crate = "arrayvec", reason = "0.5 via the pretty Wadler pretty-printer vs 0.7 across the disassembler/parser stack; tiny fixed-capacity vector, no advisory, used only over emitter-owned output" },
    { crate = "bitflags@1.3.2", reason = "transitive; modern direct deps use bitflags 2" },
    { crate = "heck@0.4.1", reason = "transitive via the ntfs crate's strum_macros 0.24; our direct deps use heck 0.5" },
    { crate = "syn@1.0.109", reason = "transitive proc-macro chains still on syn 1" },
    { crate = "thiserror@1.0.69", reason = "transitive; our direct dep is thiserror 2" },
    { crate = "thiserror-impl@1.0.69", reason = "proc-macro half of thiserror 1 straddle" },
    { crate = "indexmap@1.9.3", reason = "transitive; our direct dep is indexmap 2" },
    { crate = "hashbrown", reason = "five transitive majors (0.12..0.17) via std-backports & icu" },
    { crate = "itertools", reason = "0.13 vs 0.14 split across object / ruff toolchains" },
    { crate = "unicode-width", reason = "0.1 vs 0.2 via clap / textwrap toolchains" },
    { crate = "winnow", reason = "0.7 vs 1.0 via toml_edit vs other parsers" },
    { crate = "foldhash", reason = "0.1 vs 0.2 via hashbrown majors" },
    { crate = "rand", reason = "0.8 / 0.9 / 0.10 via crypto (rsa) vs general consumers" },
    { crate = "rand_core", reason = "matched majors of the rand straddle" },
    { crate = "rand_chacha", reason = "matched majors of the rand straddle" },
    { crate = "getrandom", reason = "0.2 / 0.3 / 0.4 via the rand straddle & wasm shims" },
    { crate = "constant_time_eq", reason = "0.3 vs 0.4 via blake3 vs crypto deps" },
    { crate = "cpufeatures", reason = "0.2 vs 0.3 via sha2 vs other digest deps" },
    { crate = "block-buffer", reason = "0.10 vs 0.12 via the RustCrypto digest trait-crate generation straddle" },
    { crate = "cipher", reason = "0.4 vs 0.5 via the RustCrypto cipher trait-crate generation straddle" },
    { crate = "crypto-common", reason = "0.1 vs 0.2 via the RustCrypto trait-crate generation straddle" },
    { crate = "inout", reason = "0.1 vs 0.2 via the RustCrypto cipher trait-crate generation straddle" },
    { crate = "mio", reason = "0.8 legacy transitive async vs 1.x modern tokio stack" },
    { crate = "yaxpeax-arch", reason = "0.2 vs 0.3 across the yaxpeax disassembler crate family" },
    { crate = "toml", reason = "0.8 vs 0.9 via utoipa / config consumers" },
