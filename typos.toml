[default]
extend-ignore-re = [
    "(?Rm)^.*# spellchecker:disable-line$",
    "(?s)(#|//)\\s*spellchecker:off.*?(?:\\s*(#|//)\\s*spellchecker:on)?\\s*$",
]

[default.extend-words]
# project terms
disrobe = "disrobe"
disrobed = "disrobed"
deobf = "deobf"
PyArmor = "PyArmor"
bytenode = "bytenode"
asar = "asar"
flate = "flate"
miette = "miette"
rkyv = "rkyv"
postcard = "postcard"
wasmtime = "wasmtime"
wasmparser = "wasmparser"
walrus = "walrus"
bytecheck = "bytecheck"
landlock = "landlock"
seccompiler = "seccompiler"
napi = "napi"
maturin = "maturin"
oxc = "oxc"
divan = "divan"
fastwebsockets = "fastwebsockets"
yaxpeax = "yaxpeax"
mlua = "mlua"
rmcp = "rmcp"
sigstore = "sigstore"
minisign = "minisign"
zigbuild = "zigbuild"
lefthook = "lefthook"

[files]
extend-exclude = [
    "corpus/**",
    "fuzz/corpus/**",
    "docs/book/book/**",
    "target/**",
    "**/*.dr",
    "**/*.lock",
]
