notes = "String recovery at `crates/disrobe-pass-jvm/src/dalvik_strdec.rs` runs a constrained dalvik register machine over the dex's OWN decrypt routine: it executes the class `<clinit>` to rebuild the encrypted `String[]` static table, then runs the `decrypt(int)` body per table index (sget-object the table, aget the element, per-char XOR against the embedded key, String.valueOf the result), recovering the plaintext with no invented cipher. The reflective call sites (Class.getDeclaredMethod(\"decrypt\", int.class) + Method.invoke) are matched and resolved to the concrete decrypt target. `protectors/dexguard.rs::peel` wraps this behind explicit authorization and surfaces the recovered strings; the dalvik engine also runs unconditionally on the `disrobe jvm decompile <dex>` path (manifest fields reflection_strings_recovered / reflection_string_recovery). Recovery is graded against the authored plaintext list in `tests/dexguard_reflection_strings.rs`, an external ground truth, not against disrobe's own output. A DexGuard build whose decrypt key is runtime-only (System.getProperty/env/clock/SecureRandom) is reported as RuntimeKeyUnavailable and left opaque. Sourcing note: commercial DexGuard is paid Guardsquare software whose protected output is unsafe to produce on a non-sandboxed box, and the javac+d8 toolchain is not installed (agents do not install or download tooling), so this is a self-authored benign sample that exhibits the same reflection-string-decryption technique; the dex is assembled byte-for-byte by the project's own dex_builder (dex 035, adler32 + sha-1 valid) and parses through the project's own dex reader. CFF un-flattening for DexGuard switch-on-state dispatchers is handled separately at `dalvik_dexguard.rs`."

