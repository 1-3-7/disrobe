second_reference_verdict = "Deark cannot grade these members. Its modules/lha.c gives -pm0- the decompress_uncompressed handler but lists -pm1- and -pm2- in other_known_cmpr_methods, the table of methods it recognises without decoding. This is read from the pinned source; the deark binary did not build on the recovery host."
independent_evidence = [
  "Each member carries the CRC-16/ARC that PMarc 1.24 or PMARC2 wrote when the archive was created; the LZH layer verifies it against the recovered bytes.",
  "pmarc124_pm1_long.pma and pmarc2_long.pma hold the same LONG.TXT compressed by two different codecs from two different archivers; both recover to the same SHA-256.",
  "The recovered COPYING.TXT and GPL-2. members are the pre-2007 GNU LGPL-2 and GPL-2 texts, padded with NUL bytes to a 128-byte record boundary.",
]

