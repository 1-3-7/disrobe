[per_file_capture]
toolchain = "wimlib-imagex 1.14.4 (github.com/ebiggers/wimlib, GPLv3/LGPL), official windows-x86_64 binary"
build = [
    "make a directory holding hello.txt, readme.md, large.txt (90000 bytes of repeated ascii so the stream compresses across 3 chunks), and sub/nested.bin",
    "wimlib-imagex capture <dir> files_xpress.wim disrobe-x --compress=fast      # XPRESS main compression",
    "wimlib-imagex capture <dir> files_lzx.wim    disrobe-l --compress=maximum   # LZX main compression",
]
purpose = "Real non-solid WIM images with a populated blob lookup table and a compressed metadata dentry tree, used to validate the in-tree per-file image-stream walk (lookup table + dentry recursion) and byte-exact resource decode end to end through extract_to. The metadata resource is compressed (exercises the XPRESS-Huffman and LZX chunk codecs on the dentry tree) and large.txt is a compressed multi-chunk data stream; the small files are stored verbatim as wimlib emits them."
oracle = "the captured source files under files_expected/ are the independent ground truth; the in-tree decoder must reproduce each inner file byte-for-byte. Self-authored benign content."

