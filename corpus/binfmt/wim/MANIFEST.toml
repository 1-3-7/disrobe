toolchain = "wimlib (github.com/ebiggers/wimlib, GPLv3/LGPL) LZMS compressor compiled with clang 22 (x86_64-pc-windows-msvc)"
purpose = "Real LZMS-compressed payloads produced by wimlib's own LZMS encoder, used to validate the in-tree LZMS decoder and WIM chunk-table path byte-exact. Self-authored benign content (English pander text plus deterministic PRNG bytes)."

[provenance]
encoder = "wimlib's lzms_compressor_ops (src/lzms_compress.c + lzms_common.c + compress_common.c + lcpit_matchfinder.c + divsufsort.c)"
build = [
    "git clone --depth 1 https://github.com/ebiggers/wimlib",
    "clang -O2 -D_CRT_SECURE_NO_WARNINGS -I include -I . disrobe_lzms_emit.c src/lzms_compress.c src/lzms_common.c src/compress_common.c src/lcpit_matchfinder.c src/divsufsort.c -o disrobe_lzms_emit.exe",
    "disrobe_lzms_emit wim <file_size> 50 <out.wim>   # emits the .wim and its .expected plaintext sidecar",
    "disrobe_lzms_emit raw <size> <level> <out.bin>   # emits a 16-byte header (DRLZMS01 || u32 uncompressed_len || u32 compressed_len) then compressed then plaintext",
]
oracle = "wimlib's LZMS encoder is the independent producer; disrobe's decoder must reproduce the exact plaintext (sidecar / embedded original). The chunk-table offsets follow the documented WIM non-solid layout (num_chunks-1 cumulative offsets, 32768-byte chunks)."

