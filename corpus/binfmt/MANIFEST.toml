[wave5_embedded_linux_filesystems]
description = "Embedded-Linux read-only filesystem walkers (detect + walk + byte-exact member extraction). Each walker is graded by a spec-faithful in-tree oracle: an independent encoder lays out the raw on-disk format per its published spec, the walker parses it, and the recovered member bytes are asserted equal to the original payload. The encoder is not the walker run backwards, so the oracle is non-circular. Real-tool fixtures (genromfs, mkfs.minix, img2simg, btrfs send, mkntfs, mkfs.erofs, mkfs.jffs2, mkfs.ubifs, mkyaffs2image) live under corpus/binfmt and are gitignored; the host running this wave has no Hyper-V/WSL backend available, so the labeled spec-builder oracle is authoritative here and the real-tool fixtures are the regeneration target when a Linux toolchain is present."

[[wave5_walkers]]
format = "romfs (genromfs)"
status = "byte-exact"
layout = "linear 16-byte-aligned file headers, big-endian; directory via spec.info first-child chain"
note = "regular files, executable flag, nested directories, symlinks recovered byte-exact"

[[wave5_walkers]]
format = "minixfs v1/v2/v3"
status = "byte-exact"
layout = "boot block + superblock at 1024; v1 14/30-char names + 16-bit zones, v2/v3 32/60-char names + 32-bit zones; direct + single-indirect + double-indirect zone resolution"
note = "all three versions and the single-indirect path validated byte-exact"

