[rar_payload]
description = "RAR archives store hello.txt, lorem.txt and docs/notes.txt. expected/ holds the verbatim source files used as the ground truth for byte-exact member extraction. lorem.txt is 32800 bytes of repeated text so normal-mode compression actually shrinks it. The two filter-* RAR5 archives each hold one member chosen to trigger a post-LZ filter: x86code.bin is a self-authored compiled x86-64 PE (fibonacci/collatz/ackermann, no I/O) whose dense E8/E9 call/jmp opcodes make the RAR5 analyzer apply the x86 (E8E9) filter; delta.bin is interleaved 3-channel byte ramps that trigger the delta filter. expected/x86code.bin and expected/delta.bin are the verbatim originals. RAR 2.9/3.x applies its e8e9/delta/audio transforms through the rarvm bytecode rather than fixed filter ids, so the rar4 fixtures use plain-text members that exercise the standard (non-vm) lz path."

