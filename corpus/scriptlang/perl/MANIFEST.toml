header_fields = "magic:u32, archname:asciiz, byteloader_version:asciiz, ivsize:u32, ptrsize:u32"
archname = "MSWin32-x86-multi-thread"
byteloader_version = "0.06"
ivsize = 4
ptrsize = 4
intsize = 4
longsize = 4
byteorder = "1234 (little-endian)"

