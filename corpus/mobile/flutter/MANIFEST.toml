notes = """
Real RustDesk 1.4.9 Android build. lib/arm64-v8a/libapp.so (12190624 bytes) and
lib/arm64-v8a/libflutter.so (10714752 bytes) are read directly out of this APK zip by
crates/disrobe-pass-mobile/tests/real_flutter_rustdesk.rs, which grades the RAW static
