name strings, an independent whole-file `package:*.dart` uri oracle). This build's Dart
snapshot version does not match the Dart 3.12.2 android-arm64 product tuple pinned in
crates/disrobe-pass-mobile/src/flutter/dart_graph_layout.rs. The declaration-graph path
