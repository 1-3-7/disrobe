graded separately against the pinned pinned_graph_fixture/ set. Reproduce with:
mkdir -p "$TMPDIR/disrobe-scratch/rustdesk-flutter-cache" && curl -sSL -o
"$TMPDIR/disrobe-scratch/rustdesk-flutter-cache/rustdesk-1.4.9-aarch64-signed.apk"
"https://github.com/rustdesk/rustdesk/releases/download/1.4.9/rustdesk-1.4.9-aarch64-signed.apk"
then run: cargo test -p disrobe-pass-mobile --test real_flutter_rustdesk. Never fetched or
