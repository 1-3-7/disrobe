notes = """
Self-authored Dart AOT snapshots of audit_ledger.dart, one per Dart minor release from 3.3
(Flutter 3.19) to 3.12 (Flutter 3.44). The source writes string, Latin-1 and two-byte string,
double, 64-bit integer, const list, symbol and type-argument literals and passes them through
never-inlined calls, so each one reaches the object pool and a call site. Each release is
compiled by the official Dart SDK (gen_kernel_aot) and the official Flutter engine
android-arm64-release gen_snapshot of a Flutter release that shipped that Dart, the way
`flutter build apk` compiles a release build (--strip, no DWARF stack traces). The toolchains
are the published archives recorded below, fetched by URL and checked against the sha256
recorded here (the Dart SDK archive also against its published .sha256sum, the engine archive
against its storage md5). They compile only this source; no third-party code is built.
Each build writes three files: the stripped ELF; *.sizes.json, what
--print-instructions-sizes-to wrote (every code object in instructions-table order with its
owner class, library and size); and *.symbols, what --save-debugging-info wrote (the DWARF and
static symbols gen_snapshot keeps for the stripped ELF). Adding the two reference flags leaves
the ELF byte-identical (checked by rebuilding with and without them).
tests/real_flutter_release_lift.rs grades code names against the DWARF and the sizes listing,
pool literals against the literals this source writes, and the calling convention of each
release against its argument registers. oracle.json carries the expected renderings.
"""
kernel_command = "dartaotruntime bin/snapshots/gen_kernel_aot.dart.snapshot --platform <platform_dill> --aot -Ddart.vm.product=true --filesystem-scheme org-dartlang-fixture --filesystem-root <directory holding audit_ledger.dart> -o audit_ledger.aot.dill org-dartlang-fixture:///audit_ledger.dart"
build_command = "gen_snapshot --deterministic --snapshot_kind=app-aot-elf --elf=audit_ledger_arm64.so --strip --save-debugging-info=audit_ledger_arm64.symbols --print-instructions-sizes-to=audit_ledger_arm64.sizes.json audit_ledger.aot.dill"

