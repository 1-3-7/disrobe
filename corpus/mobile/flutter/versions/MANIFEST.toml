notes = """
Self-authored Dart AOT snapshots, one per Dart minor release that Flutter stable shipped
from Flutter 3.19 (Dart 3.3) to Flutter 3.41 (Dart 3.11). receipt_validator.dart is the
pinned_graph_fixture source with the Flutter widget replaced by a plain main, so it needs
only the Dart SDK. Each release is compiled twice from the same kernel by the official
Flutter engine android-arm64-release gen_snapshot of that Flutter release: plain, and the
way `flutter build apk --obfuscate --split-debug-info` compiles (DWARF stack traces,
obfuscation, stripped ELF). The toolchains are the published archives below, fetched by URL
and checked against the sha256 recorded here (the Dart SDK archive also against its
published .sha256sum, the engine archive against its storage md5). They compile only this
source; no third-party code is built or committed. build.sh rebuilds every artifact.
clusters*.txt is what gen_snapshot --print_cluster_information wrote to stderr for that
build: the VM snapshot and then the isolate snapshot, each cluster's allocation and fill
offset, size and object count. tests/dart_graph_releases.rs grades disrobe's cluster walk
against it. The snapshot hash and feature tuple of every build are read from the ELF.
*.sizes.json is what --print-instructions-sizes-to wrote for that build: every code object in
instructions-table order with its owner class, library and size. The source build is
unstripped, so its ELF carries its own DWARF; the obfuscated build's DWARF is the
--save-debugging-info ELF (*.symbols), and *.obfuscation_map.json is what
--save-obfuscation-map wrote. These reference outputs come from rebuilding each release with
the extra flags; every ELF came out byte-identical to the sha256 recorded below.
tests/real_flutter_release_lift.rs grades disrobe's code names against them.
"""
kernel_command = "dartaotruntime bin/snapshots/gen_kernel_aot.dart.snapshot --platform <platform_dill> --aot -Ddart.vm.product=true --filesystem-scheme org-dartlang-fixture --filesystem-root <directory holding receipt_validator.dart> -o receipt_validator.aot.dill org-dartlang-fixture:///receipt_validator.dart"

