notes = """
PHP corpus generated on Windows 11 with PHP 8.3.31 (NTS / Zend Engine v4.3.31).
Three tiers:
  baseline/hello.php - smoke fixture for token-stream + signature tests.
  megafile/edge_cases.php - PHP 8.x megafile: strict_types, enums, readonly
    classes, union/intersection types, never/nullable, match expression, nullsafe
    operator, constructor property promotion, traits, interfaces, generators with
    yield from, fibers, WeakMap, first-class callable, named args, attributes
    (Route, Cached), throw expressions, anonymous classes, all magic methods,
    namespaces, group use. PHP-8 features make this incompatible with naneau
    obfuscator (PhpParser v1 limit).
  megafile/pre80_edge_cases.php - PHP 5.4/7-compat variant for the obfuscator
    pipeline. Classes, traits-substitute, switch/case fall-through, closures
    in array_map/filter/reduce, try/catch with multiple handlers, regex,
    json round-trip, sort/usort, magic methods.
  better-php-obfuscator/edge_cases.obf.php - real output of naneau/php-obfuscator
    0.0.5 (variable-name scrambling) over pre80_edge_cases.php.
  phar/{hello.phar, edge_cases.phar} - real PHP-built Phar archives (PHP CLI
    `Phar::buildFromDirectory` + `createDefaultStub`).
  phar/bzip2.phar - real PHP-built Phar with every member bzip2-compressed
    (`compressFiles(Phar::BZ2)`, PHP_BZ2 enabled); benign sources under
    phar-bz2/src/. Non-circular oracle for the in-tree phar bzip2 decompress:
    PHP compresses, disrobe decompresses, members must equal the on-disk
    sources byte-for-byte (`tests/real_phar.rs`). Rebuild via phar-bz2/build.php.
TOOL-GENUINE-WALL: ionCube, SourceGuardian, Zend Guard - these ship encrypted
  Zend opcode arrays; the decryption key lives inside the licensed native loader
  (.so/.dll), NOT in the PHP envelope, so source is NOT recoverable without that
  runtime key. `crates/disrobe-pass-php/src/protectors/{ioncube,sourceguardian,
  zend_guard}.rs` are HONEST DETECT-ONLY: they recognize the real era/version
  markers, locate the structural ciphertext boundary, scrape printable envelope
  strings for triage, and report a documented `wall_reason`. They NEVER fabricate
  recovered source. `tests/{ioncube,sourceguardian,zend_guard}_detect.rs`,
  `tests/{ioncube,sourceguardian,zend_guard}_decode.rs`, and
  `tests/{ioncube,sourceguardian,zend_guard}_synthetic_envelope_detect.rs` assert
  detect-only / structural-only behavior (family/era/marker, auth gate, no
  recovered source). The public CLI decode path uses the auth-gated `encoder`
  module returning `DecodeOutcome::StructuralOnly`.
  (A prior revision shipped a homemade RC4/XOR-keystream "decode" with circular
  self-encode/decode round-trip tests over `megafile/edge_cases.php`; that was a
  fake capability - real ionCube/SG/ZendGuard use no such public scheme - and has
  been removed.)
DZOA-CONTAINER-HONESTY: `decompile.rs` parses + lifts a Zend op_array via
  disrobe's OWN canonical container (magic `DZOA`). The lifter (temporary folding
  into expressions, if/while/foreach/ternary/short-circuit recovery from the
  opcode jumps) is graded against PHP's real opcache opcode dump. The emitter
  compiles every benign oparray/src sample into DZOA and
  `tests/oparray_behavioral.rs` compares every parsed block with that dump. The
  named behavioral subset is lifted back to PHP without source access, then the
  test runs it and compares stdout with the original program. Anonymous closures
  stay opcode-only because the current PHP printer repeats their `{closure}`
  declarations. Local variable names stay $vN: original identifiers are
  not carried in the opcode stream. Fully-const array literals are elided by the
  textual opcache dump (printed as `array(...)`), so the behavioral samples build
  arrays with a non-const element; that is an emit_dzoa.php transport limit, not a
  lifter limit. This is still NOT a real-world ionCube/SG/ZendGuard op_array
  decompiler: those commercial encoders return `DecodeOutcome::StructuralOnly`
  because their op_arrays are encrypted with a runtime loader key that is absent
  from the envelope, so no real-world commercial-encoder op_array decompile is
  claimed.
TOOL-DEAD-DOCUMENT: bcompiler (EOL ~PHP 5.3) - fixtures remain synthesized + documented.
TOOL-CAPTURE-MANUAL: FOPO web obfuscator (online, CAPTCHA-protected) - fixture
  remains in-test synth via `build_fopo`.
"""

