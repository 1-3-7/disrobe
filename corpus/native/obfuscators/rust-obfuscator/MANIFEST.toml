verified = "the cryptify decrypt's env-var-name literal 'CRYPTIFY_KEY' is present in the obfuscated binary and ABSENT from the clean baseline - a reliable, false-positive-free signature. disrobe previously detected NOTHING (empty obfuscator hits, same as clean); it now reports Cryptify. NOTE on recovery: the secret IS the ciphertext XOR 'xnasff3wcedj' (proven recoverable, ciphertext at file offset 0x16750), but blind whole-binary XOR-scan is noise-dominated (no obf-vs-clean discriminator) - full string recovery requires decrypt-call-site code analysis, deferred as honest future work; this lands clean detect-and-report"

