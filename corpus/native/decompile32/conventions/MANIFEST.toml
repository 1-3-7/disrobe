schema = "disrobe.corpus.v1"
crate = "disrobe-pass-native"
generated = "2026-10-15"
toolchain = "clang 19.1.7 and LLD 19.1.7 (LLVM release); gcc 16.2.0 (MSYS2 ucrt64 Rev3, x86_64-w64-mingw32 driver with -m32) and LLD 19.1.7; Microsoft C/C++ Optimizing Compiler 19.44.35229 for x86 and Microsoft Incremental Linker 14.44.35229.0 (MSVC 14.44.35207, Windows SDK 10.0.26100.0); clang 19.1.7 and LLD 19.1.7 targeting i386-unknown-linux-gnu"
note = "self-authored C built for x86-32 with four toolchains at three optimisation levels; graded by crates/disrobe-pass-native/tests/oracles/x86_32_decompile_behaviour.rs, which compiles the recovered C with clang for i686-pc-windows-msvc and calls it beside the original function (the PE DLL loaded at its preferred base, the ELF image mapped at its link address) on 1000 generated inputs"

[provenance]
environment = "each build runs in a fresh temporary directory holding only the source; INCLUDE and LIB point at the MSVC 14.44.35207 and Windows SDK 10.0.26100.0 x86 directories for cl and link; no CRT or libc is linked (link and lld-link run with /NOENTRY /NODEFAULTLIB, and ld.lld is given only the object), and the fixed base 0x10000000 lets the recovered C and the original share absolute addresses"
reproducible = "rebuilding with the per-fixture build commands yields the same bytes (/Brepro, /brepro, --build-id=none); no debug information or host path is embedded"

