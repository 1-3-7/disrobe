description = "integer functions under each x86-32 convention: cdecl leaves and callers, 64-bit add, subtract and widening multiply returned in edx:eax, stdcall callees and their caller, fastcall callees and their caller, thiscall methods over a struct and their caller (attribute builds only), PC-relative globals, and two floating-point functions whose x87 return is refused"

