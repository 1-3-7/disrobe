    libclang blocked on this box - documented). UNCHANGED. NOT faked.

Disrobe also ships: full MZfarbrausch header parser, variant fingerprinting (K7 vs Classic), and the
DisFilter forward + inverse port (dis_filter / dis_unfilter) from fg's public source."""

