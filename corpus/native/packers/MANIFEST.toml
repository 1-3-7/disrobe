file is now replaced by the true hash A2FB9DCB82F6...; input_sha256 likewise corrected to the full
64-hex digest).

CCA decoder status: clean-room and verbatim-verified against fg's public-domain depacker_simple.cpp
AND now witnessed against this REAL classic stream (no longer self-tested circularly). The genuine
engineering result this wave:

  1. locate_classic_stream() structurally derives the CCA range-coder stream offset from the depacker
     stub's `mov dword [ebp], image_base+stream_rva` source-pointer seed (C7 45 00 <imm32>). For this
     fixture imm32 = 0x3f00d4, image_base = 0x3f0000, so stream_offset = 0xD4 (in the PE header tail,
     NOT inside the named 'kkrunchy' section raw data - the prior assumption that `packed` was the bare
     stream was wrong). The locator is asserted to return exactly 0xD4 and to decode a non-trivial
     payload (locate_classic_stream_finds_real_range_coder_seed test).

  2. decompress_kkrunchy_classic() decodes 1312 bytes of GENUINE decompressed payload from the located
     stream. Anti-circular witness: the decoded payload contains the verbatim import bootstrap
     (kernel32.dll / GetStdHandle / WriteFile / ExitProcess plaintext + the import-resolver x86
     prologue `mov edi,0x401000; ...`). The integration test classic_cca_recovers_real_fixture_payload
     asserts all four import markers are present in the decoded bytes - this proves the decoder
     decoded REAL packer output, not its own encoder.

  3. unpack_kkrunchy() now routes Classic023A through locate -> decompress and returns the recovered
     payload in packed_payload. Measured byte recovery vs the 1024 B original: 17.77% (1777 bp),
     up from the 6.44% k7 structural baseline. Test floor set to the measured value floored to the
     nearest 100 bp (1700 bp) per the anti-gaming rule; never asserted above the real stream's yield.

HONEST BARRIER (full .text byte-identity not reached): the decoder is reference-correct in every
constant verified against the live 0.23a stub disassembly (model bases LIT=35/CODE=0/PREV=2/LOW=3/
GAMMA0=291/GAMMA1=547, range>>11, shifts 4/5, offset (raw-2)<<4 + tree16 + 1, len++ at offs>=96/>=2048,
gamma terminator at raw<=1 - the stub's `dec ecx; dec ecx; js` confirms the stop is raw<=1, corrected
from the prior raw==0). It decompresses the import-bootstrap region (RVA 0xae0..0xff0) cleanly, then a
residual decoder-state divergence in the match-dense DisFilter region (located at decoded offset ~915,
19-stream container) prevents the embedded DisFilter-encoded .text from unfiltering byte-identically.
Best contiguous .text content alignment measured at 60.4% (309/512 bytes). The recovered payload is the
real decompressed kkrunchy runtime scaffold + import table, NOT the page-aligned original .text, hence
the 17.77% whole-file figure. Closing the residual drift requires either tracing the exact LWM/length
context arithmetic of the live stub byte-for-byte or x86-emulating the stub (the KkrunchyEmulator seam).
This is recorded transparently rather than faked, mirroring the MEW stream_decoded=false / FSG
near-byte-exact transparency pattern."""

