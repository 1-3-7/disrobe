unicorn-engine stub emulation or full RE of the runtime-patched fetcher. Coordinator marked
unicorn-engine BLOCKED for GPL-2.0 + libclang reasons during W4D, so byte recovery defers to a follow-up
wave. The unpacker ships as **structural recovery** plus an algorithmically-verified aPLib decoder ready
to plug into a future stream-fetcher implementation: it parses every fixed landmark (DOS+NT headers,
two-section table, gamma2 decoder prologue, IAT-rebuild plaintext, 25-byte EP-stub trailer) exactly,
recovers the original AddressOfEntryPoint RVA and the kernel32.dll!LoadLibraryA + GetProcAddress
bootstrap pair plus the per-DLL import-name plaintext zone, and reports stream_decoded=false when the
aPLib pass cannot consume the byte-tagged stream.
