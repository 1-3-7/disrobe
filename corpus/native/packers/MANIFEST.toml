[[packers]]
name = "MEW"
version = "11 SE 1.2 (Northfox 2004)"
install_method = "not-obtained-but-not-required - pre-packed fixtures sourced from PackingData corpus"
install_path = ""
status = "lzma-rebuilder-byte-recovery"
fixture_source = "github.com/chesvectain/PackingData (MIT-licensed pre-packed real binaries; originals from PackingData/Notpacked/)"
limitation = """
MEW 11 SE 1.2 compresses the original image as two leading aPLib chunks (IAT-name tail + rebuilder code)
followed by an LZMA1 stream (lc=4, lp=0, pb=2). The default build decodes this layout with the pure-Rust
decode_mpress_lzma port (crates/disrobe-pass-native/src/packers/mpress_lzma.rs) driven from
unpack_mew - no external process, no Cargo feature gate, no unsafe. The decompressed image populates
raw_image and sets stream_decoded=true; the honest recovery verdict is MewRecovery::Decompressed.

The real per-fixture ceiling is set by what the LZMA stream physically contains: the trailing IAT and
relocation zones that the MEW runtime stub rebuilds in memory are NOT present in the LZMA stream, so
reloc/resource-heavy binaries top out lower. Measured best-alignment byte-recovery against the originals:
Clockres 95.05%, AccessEnum 91.80%, Autologon 64.46%. These are honest ceilings, not targets - Autologon
is reloc-heavy and its rebuilt zones lie outside the stream. The textbook byte-tagged aPLib decoder
(aplib_decode_bytetagged) remains a documented fallback that genuinely fails at step ~9 on the real
streams; it is not the primary path. The unpacker also parses every fixed landmark (DOS+NT headers,
two-section table, gamma2 decoder prologue, IAT-rebuild plaintext, 25-byte EP-stub trailer) exactly and
recovers the original AddressOfEntryPoint RVA plus the kernel32.dll!LoadLibraryA + GetProcAddress
bootstrap pair and the per-DLL import-name plaintext zone.
"""

