Two distinct kkrunchy backends, handled differently per their tractability:

  - classic 0.23a (CCA: range coder + LZ + Elias-gamma): clean-room decoder shipped in kkrunchy_cca.rs,
    reference-verified against fg's public-domain depacker_simple.cpp AND witnessed against the REAL
