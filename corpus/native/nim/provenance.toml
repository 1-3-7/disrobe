schema = "disrobe.nativelang.source-build/v1"
producer = "nim 2.0.8"
source = "hello.nim"
source_sha256 = "527d7013eecca1c2dd13c20ba7ed5da61caef562846a11600556619dd33208e7"
toolchains = [
  "Nim 2.0.8",
  "Zig 0.13.0 clang 18.1.6 cross C compiler and linker for x86_64-linux-gnu",
]
target = "x86_64-linux-gnu"
memory_manager = "orc"
build_mode = "release with runtime checks"

[[artifacts]]
path = "hello.nim.elf"
sha256 = "62ee44dc5adede2d9fb0905f9551d774bde7d8c3a340941bfb17601ae1b2214a"
path_rewrite = "the seven DWARF paths of the Zig glibc stubs had the build host home directory; each was replaced in place with a same-length neutral prefix (C:\\workdir_\\.local\\tools\\), matching the C:\\workdir prefix of the other build paths"
build_command = "nim c -d:release --mm:orc --cpu:amd64 --os:linux --cc:clang --clang.exe:zig --clang.linkerexe:zig --out:hello.nim.elf hello.nim"
