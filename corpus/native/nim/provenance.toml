schema = "disrobe.nativelang.source-build/v1"
producer = "nim 2.0.8"
source = "hello.nim"
source_sha256 = "527d7013eecca1c2dd13c20ba7ed5da61caef562846a11600556619dd33208e7"
toolchains = [
  "Nim 2.0.8",
  "Zig 0.13.0 clang 18.1.6 cross C compiler and linker for x86_64-linux-gnu",
]
toolchain_archives = [
  "Nim 2.0.8 official nim-lang/nightlies commit 5935c3bfa9fec6505394867b23510eb5cbab3dbf archive sha256 ad073af8fe578edab89a0c71809c7f252a85ba1905f32b5351a92323657e15e1",
  "Zig 0.13.0 official ziglang.org Windows x64 archive sha256 d859994725ef9402381e557c60bb57497215682e355204d754ee3df75ee3c158",
]
target = "x86_64-linux-gnu"
memory_manager = "orc"
backend = "c"
build_mode = "release with runtime checks, --opt:none, and native debugger information"

[[artifacts]]
path = "hello.nim.elf"
sha256 = "b5f4b876815ed58e7ea9b8791c2b2773ee3ef56eff92bd2dd52bc67d2b9648d0"
path_rewrite = "40 same-length in-place path-prefix rewrites are recorded with exact offsets and sections in nim-path-rewrite-record.json; the ledger retains neutral /src, /nimcache, /nim-2.0.8, /zig-0.13.0, and /zigcache prefixes, and executable sections are unchanged."
path_rewrite_record_sha256 = "942f47153f7d83454c7e60c46162f65cadac6a9ece37328b6f1239e8c2d278e7"
build_command = "nim c -d:release --opt:none --debugger:native --mm:orc --cpu:amd64 --os:linux --cc:clang --parallelBuild:1 --clang.exe:<wrapper> --clang.linkerexe:<wrapper> --nimcache:<nimcache> --out:hello.nim.elf hello.nim"
compiler_wrapper = "zig cc -target x86_64-linux-gnu with -ffile-prefix-map mappings in this order: <source-root>=/src, <nimcache>=/nimcache, <nim-root>=/nim, and <zig-root>=/zig; each mapping is passed in slash and backslash spellings"
runtime_license = "copying.txt (MIT)"
