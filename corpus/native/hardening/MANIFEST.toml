    "clang --target=x86_64-linux-gnu -O2 -fPIC -ffreestanding -fno-builtin -fno-stack-protector -shared -nostdlib -fuse-ld=lld -Wl,-soname,libc.so.6 elf_libc_stub.c -o libc-x86_64-linux-gnu.so.6",
