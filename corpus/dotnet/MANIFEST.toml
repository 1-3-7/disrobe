[[paid-protectors.entry]]
name = "Agile.NET"
peel = "peel_agile_net"
strategy = "report-only-encrypted-resource"
status = "DETECT-AND-STRUCTURE-ONLY"
note = "Detects the AgileDotNet/CliSecure watermark, locates the code-header (signature + 16-byte key + method count) after the metadata stream, and recovers strings via the in-assembly managed XOR decryptor over #US. The body-decrypt primitives (single-XOR <=4.5, dual-XOR 5.0, additive big-endian XTEA 5.4 Pro) are transcribed faithfully from the documented method-decryption algorithm but are NOT wired to end-to-end body recovery: that needs the per-method codeOffs/codeSize from the method table the runtime loader walks (codeHeaderOffset+totalCodeSize+codeHeaderSize), absent without a real protected sample to ground the table layout. No real Agile.NET sample is in corpus."

