[[paid-protectors.entry]]
name = "MaxToCode"
peel = "peel_maxtocode"
strategy = "detect-only-native-or-vm"
status = "DETECT-AND-STRUCTURE-ONLY-NATIVE-KEY-WALL"
note = """
Native loader restores each zero-RVA method body from an encrypted section. disrobe recovers the \
static structure (zero-RVA method enumeration, encrypted-section name/rva/size/sha) and detects the \
family by real markers; the encrypted section is recorded as opaque ciphertext with no claimed \
record framing, since the per-body decryption key is computed by the unmanaged JIT-hooked loader at \
runtime and is absent from the on-disk image. The bodies stay honestly walled as \
MaxKeyOrigin::NativeStubWall with bodies_recovered == 0 and no fabricated recovery. This is an \
information-theoretic native-key wall, not an unfinished feature. Graded by \
tests/maxtocode_section_emu.rs."""
