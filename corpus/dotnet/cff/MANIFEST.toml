[predicate_recovery]
note = "ConfuserEx x86Predicate and ExpressionPredicate are no longer walled. Both encode the switch key (and every per-block key) and recover it before the rem.un index: x86 via an embedded native x86 stub called from the header, Expression via a pure inverse expression inlined into the header. The deflatten interpreter tracks all locals symbolically (so the Expression inverse folds to a constant) and routes the header call through a KeyOracle: a native int->int stub is emulated with the in-house stub_emu x86 interpreter, a pure managed int->int helper is virtually executed with the CIL emulator. The recovered key drives the dispatcher exactly as the NormalPredicate path does."
verified = "both predicate exes execute under the .NET runtime and print byte-identical output to CffPred.clean.exe (behavioral oracle); the recovered CFG of all eight benign methods equals the clean CFG built by disrobe's own Cfg::build (structural oracle), 56/56 coalesced block-signatures per predicate (100%)"

[walled]
note = "A decryptor or switch key derived from runtime-only state (a function input not present statically) keeps the real predicate and both edges (correct devirtualization, not a guess); a decryptor whose key is genuinely absent from the artifact is surfaced as RuntimeKeyUnavailable rather than fabricated."
