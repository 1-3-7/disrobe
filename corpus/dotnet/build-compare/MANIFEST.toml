reference = "reference/BuildCompareReference.cs, compiled with the same csc.dll against the net9.0 reference pack, reads both builds through System.Reflection.Metadata and System.Reflection.Emit.OpCodes and prints the expected findings; command: dotnet BuildCompareReference.dll <old> <new> > <pair>/reference.txt"
rebuild = "python -I corpus/dotnet/build-compare/build.py --dotnet <dotnet.exe> (add --check to rebuild into a scratch directory and compare)"

