[[sample]]
file = "obf_statesum_loop.real.js"
source = "src_statesum_loop.js"
produced_by = "real-js-confuser"
options = "{ target: 'node', controlFlowFlattening: true, compact: true }"
recovered = "devirtualized with the runtime-trip-count loop relooped into a structured while: sumTo(n) accumulates in while(i<=n) where n is the runtime process.argv input. the partial evaluator detects the symbolic loop condition, promotes the loop-carried with-slots (acc, i) to fresh local variables, replays the body once to emit the structured loop body with the real runtime predicate, and prunes the path it does not take. the loop is recovered as a real while with the runtime bound, not unrolled or passed through. byte-identical across an input battery (real_runtime_tripcount_loop_relooped_keeps_runtime_bound, runtime_tripcount_loop_is_relooped_not_unrolled)"

[[sample]]
file = "obf_deadcode.real.js"
source = "src_deadcode.js"
produced_by = "real-js-confuser"
options = "{ target: 'node', deadCode: true, compact: true }"
recovered = "the deadCode injections are removed: js-confuser plants `if(\"<rand>\" in <emptyDummyFunction>){ <dead>() }` guards whose `in` test against an empty function is always false, plus the `<dead>` function declarations they call. the pass identifies the empty dummy functions structurally, deletes the statically-false guards, and removes the dead function declarations once they are unreferenced. byte-identical across an input battery (real_dead_code_branches_removed_behavior_matches_node)"

[[sample]]
file = "obf_deadcode_cff.real.js"
source = "src_deadcode.js"
produced_by = "real-js-confuser"
options = "{ target: 'node', controlFlowFlattening: true, deadCode: true, compact: true }"
recovered = "deadCode combined with controlFlowFlattening: the dead `\"<rand>\" in <fn>` guards are buried inside the generator/with/switch state machine with the dummy as a with-slot function value. the partial evaluator folds `in` against the concrete function value (false for any non-standard key), so the dead branch is eliminated during devirtualization and the dispatcher collapses to the real if/else decision tree. byte-identical across an input battery (real_dead_code_with_cff_behavior_matches_node)"

[[sample]]
file = "obf_integrity.real.js"
source = "src_integrity.js"
produced_by = "real-js-confuser"
options = "{ target: 'node', deadCode: true, lock: { integrity: true }, compact: true }"
recovered = "the self-integrity wrappers are unwrapped: js-confuser moves each function body into a renamed helper and wraps the original name in a guard that murmur-hashes the helper's source and runs it only when the hash matches, trapping in while(true){} otherwise. since the intact program always passes its own check, the wrapper is a pure self-check with no observable effect; the pass rewrites each wrapper to delegate directly to the real helper and drops the tamper trap. the deadCode guards are also removed. byte-identical across an input battery (real_integrity_self_check_unwrapped_behavior_matches_node)"

[residual_walls]
runtime_derived_string_key = "a string-concealing decoder whose alphabet table is assigned from a runtime call (not a static literal) is flagged runtime_keyed and left untouched; no literal is fabricated because the key is not statically present"
runtime_derived_rgf_payload = "an rgf array entry whose eval payload is a runtime expression (atob/Function over runtime state) rather than a static string literal is counted as a runtime wall and not inlined"
