title = "JSConfuser recovery corpus (state-sum CFF, RGF eval-payload, base91 string concealing)"
oracle = "node execution of the original source, compared byte-for-byte against node execution of the deobfuscated source (crates/disrobe-pass-js-deob/tests/jsconfuser_node_oracle.rs). expected.json records the original-source stdout. the obfuscated and recovered forms must both reproduce it; recovery is additionally proven by asserting the obfuscation markers are gone and a recovery counter is non-zero, so a no-op pass-through fails."
node_version = "24.16.0"
js_confuser_version = "2.0.1"

[[sample]]
file = "obf_checksum.stringconceal.js"
source = "src_checksum.js"
produced_by = "real-js-confuser"
options = "{ target: 'node', stringConcealing: true, compact: true }"
recovered = "base91 string pool decoded back to literals at every accessor call site; the top-level concealed pool is fully recovered and the program is byte-identical under node"
notes = "the base91 alphabet and the pool array are static in the output, so the decode (basE91 then utf-8) is reproduced in-tree. js-confuser nests a second inner pool; the in-tree pass recovers the outer pool layer and behavior is preserved end to end"

