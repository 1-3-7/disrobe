recovered = "LZString stringCompression output is decoded statically: the generated compressed UTF-16 pool is resolved, `decompressFromUTF16` is replaced by the recovered literal dictionary, and the recovered program remains byte-identical under node"
notes = "generated with js-confuser 2.0.1. this fixture uses the real bracket-property call shape `LZ[\"decompressFromUTF16\"](compressedString)`, so the gate catches both the LZString decoder and the static assignment resolver"

[[sample]]
file = "obf_tokenizer.rgf.js"
source = "src_tokenizer.js"
produced_by = "real-js-confuser"
options = "{ target: 'node', rgf: true, compact: true }"
recovered = "each rgf eval-payload (a static string passed to _rgf_eval) is parsed, the embedded replacement function is extracted, and the dispatch wrapper is rewritten to the real function with its real parameters and body; the eval scaffolding and integrity guard are removed"
notes = "the payloads are static string literals, so the inner functions are statically present. a payload built from a runtime atob/Function expression is walled (no body fabricated)"

[[sample]]
file = "obf_statesum.real.js"
source = "src_statesum.js"
produced_by = "real-js-confuser"
options = "{ target: 'node', controlFlowFlattening: true, compact: true }"
recovered = "fully devirtualized: the in-tree partial evaluator (crates/disrobe-pass-js-deob/src/jsconfuser/cff_vm) models the generator state machine, resolves the with(stateObject) scope proxy to its object slots, tracks the state-sum across iterations through the object-slot and arithmetic case labels and relative-add transitions, recurses into the nested sub-machines, and emits straight-line code. the generator/with/dispatcher envelope is gone and stdout is byte-identical under node (real_jsconfuser_cff_is_devirtualized_to_straight_line). this program has no runtime input, so it reduces to its observable effect"
notes = "the real js-confuser 2.0.1 controlFlowFlattening emitter wraps the state-sum dispatcher in a function* generator guarded by a with(stateObject) scope proxy, with object-slot case labels, mutually-dependent register transitions, and nested sub-machines read back through the generator return value. the partial evaluator devirtualizes all of it for real instead of walling"

[[sample]]
file = "obf_statesum.spec.js"
source = "src_statesum.js"
produced_by = "spec-constructed-per-documented-algorithm"
algorithm = "state-sum control-flow flattening: the dispatched block id is the SUM of several state variables (block = s0+s1+...+sN), case labels are arithmetic over those variables, and each block's successor is encoded as relative compound-adds to the state variables. this is the documented JSConfuser controlFlowFlattening state model, hand-applied to the benign source"
recovered = "both state machines are devirtualized: the running state-sum is tracked from the initial values, each arithmetic case label is resolved to its block, the relative-add transitions rebuild the successor edges, and the reachable blocks are emitted as straight-line code; the while/switch dispatcher is gone and behavior is byte-identical under node"
notes = "the documented/non-generator state-sum form, kept as a minimal regression fixture for the linearizer alongside the real generator-wrapped output in obf_statesum.real.js"

