recovered = "devirtualized with the runtime input preserved: the source reads process.argv[2], so the recovered straight-line code keeps Number(process.argv[2]) symbolic and reproduces the original computation byte-for-byte across an input battery (real_runtime_branchless_cff_devirtualized_keeps_runtime_input). proves the partial evaluator is not output-capture: the result is a function of runtime data, not a folded constant"

