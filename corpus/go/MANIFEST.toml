build = "cp versions/src/main.go <staging-gopath>/src/fixture/main.go; GOPATH=<staging-gopath> GO111MODULE=off CGO_ENABLED=0 GOOS=<os> GOARCH=<arch> go<version> build -trimpath -gcflags=all=-l -buildmode=<mode> -o <output> fixture"
