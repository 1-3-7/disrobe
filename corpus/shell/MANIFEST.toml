[bash.node_bash_obfuscate]
source = "github:willshiao/node-bash-obfuscate@master (npm bash-obfuscate, MIT)"
status = "REAL-FIXTURE"
shadeshell_note = "Forward-backlog #11 named 'ShadeShell' as a FOSS shell obfuscator. No such repo exists: zero GitHub repos match shadeshell, and the only code hits for the string are an unrelated gRPC home-automation service (Amazingct/SHADE) plus n-gram/expired-domain noise. The nearest real Shade-named shell obfuscator, s-r-e-e-r-a-j/CodeShade, only wraps the npm bash-obfuscate engine for its bash mode. node-bash-obfuscate is therefore the real obfuscator implemented here; no signature was fabricated for the non-existent name."
technique = "chunk the script into fixed-size variable chunks, build a Idz='chunk'; lookup table where every id ends in z, then eval a $-reference concatenation joined by the newline variable $z"
oracle = "obfuscate clean_original.sh with `bash-obfuscate clean_original.sh -c <n> -r false`, then byte-compare stdout + exit code of the recovered script against clean_original.sh under sandboxed bash and dash; the original is ground truth, never the tool output"
fixtures = [
  "bash/node-bash-obfuscate/clean_original.sh",
  "bash/node-bash-obfuscate/obfuscated_chunk4.sh",
  "bash/node-bash-obfuscate/obfuscated_chunk8.sh",
]

