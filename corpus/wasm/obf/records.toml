origin.built.difference = "clang 22.1.6 at -O2 lays out the unrolled even-sum loop differently from the committed printout: the rebuild uses 4 locals and places the 2x-unrolled loop inside the guard block, where the committed file uses 5 locals and places it after that block; no other level (-O0, -O1, -O3, -Os, -Oz), with or without -Wl,--no-stack-first, reproduces it, so the committed printout stays the graded clean reference"

