purpose = "Authored Solidity and Vyper contracts compiled by the reference compilers; graders compare disrobe evm selectors, mutability, argument types, events, errors and the creation/runtime split with the compilers' own ABI, method identifiers and deployed bytecode. The EIP-1167 and EIP-7511 clones are written from the EIP texts with the implementation address 0xbebe...be."

[provenance]
build = [
    "DISROBE_SOLCJS_ROOT=<dir holding solcjs-<version>> sh corpus/evm/build.sh  (runs node corpus/evm/build.cjs per build; standard JSON; fails on a 'can be restricted to' warning)",
    "<venv>/python -I corpus/evm/build_vyper.py --vyper <venv>/Scripts/vyper  (vyper -O gas and -O codesize)",
]
oracle = "solc and vyper ABI, method identifiers and deployedBytecode/bytecode_runtime SHA-256 in each reference.json; require messages and constant/immutable getter names read from solc's AST"

