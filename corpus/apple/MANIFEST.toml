produced_by = "real-tool-fixtures.yml recipe apple-formats, run 38700419708 on macos-15 (Xcode 16.4) from corpus/apple/src/classes at 348c6c0dc: clang -fobjc-arc -O1 for Legacy.m and swiftc -O for Views.swift into an arm64 iOS 15 dylib with install name @rpath/Fixture.dylib"
