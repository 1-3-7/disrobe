produced_by = "real-tool-fixtures.yml recipe apple-formats, run 38688977800 on macos-15 (Xcode 16.4 16F6, macOS 15.7.9, iOS SDK 18.5) from the sources at d0d19f673"
reference = "xcrun assetutil --info for the asset catalog; the Foundation XML form of the keyed archive; the authored xib and swift sources for the NIBs and the archive"
graded_by = "crates/disrobe-pass-swift-objc/tests/asset_catalog_reference.rs (asset catalog)"

[runner_dylib]
