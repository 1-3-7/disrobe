[obfuscators.patchwork]
tool_version = "patchwork 0.8.0"
runtime = "python 3.14.5"
note = "two-stage loader: stage1 .py decrypts an embedded stage2 (base85 + xor-ctr/byte-perm/bit-rotate cipher chain + zlib + marshal), stage2 holds the user module plus per-function lazy blobs. Source rewrites = identifier rename, shared encrypted string/bytes pool, integer rewrite families, mixed boolean-arithmetic, opaque predicates, junk branches. 0.8.0 adds the 'Abyss' per-function AST virtualizer: eligible functions are lowered to a fixed 26-opcode stack VM with per-build randomly remapped opcode bytes, the instruction lists merged into one sealed packet stream (per-byte transform + 2-of-2 XOR secret share + base85, FNV-tagged, layout-permuted), the whole asset doc XOR'd under a 24-48 byte key, and the body replaced by `return __pw_ab_dispatch__(fid, locals())`. Recovery peels both stages to the user code object, reinserts lazy function bodies, decompiles, devirtualizes Abyss (unseal the asset doc, recover the opcode map from the surviving dispatch runtime, symbolically execute the stack VM, and reconstruct structured control flow), and reverses the source rewrites. Renaming is irreversible so output is bytecode-equivalent with mangled names unless built --no-rename. Fixtures built at seed 424242; behavior matches the originals byte-for-byte. orig_*.py are the ground-truth sources for the equivalence oracle. The *_abyss fixtures are built with --abyss and exercise each opcode family (arith, compare-chain, for/while/break/continue, list comprehension, lowered f-string, bool short-circuit, walrus, slice/subscript/dict/set/tuple); marshal is version-bound so they are py 3.14 artifacts."

