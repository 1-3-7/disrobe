schema_version = 1
tool = "Nuitka"
host_platform = "win_amd64"
source_app = "self-authored sample_app"
note = """
Real Nuitka-compiled PE binaries of a self-authored sample app, committed so the
end-to-end variant classification and Nuitka-marker detection run in ci. Exercised
by crates/disrobe-pass-nuitka/tests/real_committed.rs, which reads each binary
(hard fail on absence, no skip) and grades against the markers Nuitka genuinely
emits at the outer layer: the standalone exe carries __compiled__ /
nuitka_module_loader, the onefile bootstrap carries NUITKA_ONEFILE_* strings (the
__compiled__ markers live in its embedded payload, not the outer stub). The
standalone exe is the start binary only; running it needs its sibling .dist tree,
but static classification reads the markers in the exe alone.
"""

