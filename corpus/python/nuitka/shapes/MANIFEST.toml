schema_version = 1
generated_at = "2026-09-29"
tool = "Nuitka"
tool_version = "4.1.1"
python_runtime = "CPython 3.14.7"
host_platform = "win_amd64"
c_backend = "MSVC 14.44.35207 (cl 19.44, Visual Studio 2022 Build Tools, x64)"
source_app = "shapes and pkgsurf"
source_app_description = """
Self-authored programs that exercise the C-body lifter and the module surface. \
shapes.src.py holds an if/else join, nested for loops, a closure over two free \
variables, a try with a tuple handler, a negative power base and a boolean callee. \
pkgsurf is a package whose submodule defines a function with *args and **kw and a \
function returning `a or b`. Only the generated module C sources and their constant \
blobs are kept; the compiled extensions, objects and build scaffolding are not \
committed because no test reads them. Rebuilding with the commands below reproduces \
every kept file byte for byte.
"""
licence = """
The .src.py programs are authored for this repository and fall under its licence. \
The .c files are Nuitka output and keep their generated header: in part copyright \
2026 Kay Hayen, GNU Affero General Public License version 3 with the Nuitka runtime \
exception. The .const blobs are Nuitka data-composer output for the same programs.
"""

[[builds]]
name = "shapes"
command = "py -3.14 -m nuitka --module shapes.py --output-dir=out --no-pyi-file --assume-yes-for-downloads"
source = "shapes.src.py (built as shapes.py)"
build_dir = "shapes.build"

[[builds]]
name = "pkgsurf"
command = "py -3.14 -m nuitka --mode=package pkgsurf --output-dir=out --assume-yes-for-downloads"
source = "pkgsurf/__init__.src.py and pkgsurf/tools.src.py (built as pkgsurf/__init__.py and pkgsurf/tools.py)"
build_dir = "pkgsurf.build"

