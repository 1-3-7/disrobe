command = "python build.py <aapt2> <node>"
purpose = "Authored React Native APKs and an IPA for tests/react_native_assets.rs. The packaged bundles are the self-authored corpus/mobile/hermes/behaviour/rnassets.js compiled by hermesc (v89, v94, v98) or written out as Metro's minifier shapes it (rnassets.min.js); each asset file sits where React Native's own asset copy step puts the packager asset it belongs to, and aapt2 compiled and linked the Android resource table."

[provenance]
records = "the packager asset records are line 2 of corpus/mobile/hermes/behaviour/rnassets.hermes-stdout.txt, printed by the reference hermes interpreter running the bundle"
paths = "asset_paths.js runs reference/saveAssets.js with reference/filterPlatformAssetScales.js, reference/getAssetDestPathAndroid.js and reference/getAssetDestPathIOS.js, copied unchanged from the dist/commands/bundle directory of npm @react-native/community-cli-plugin 0.87.1 (tarball sha256 d1d1b4309bb34273e1c2d519fdb900fe3e037251c773c38166494e212be6309b), and reference/AndroidPathUtils.js from npm @react-native/asset-utils 0.87.1 (tarball sha256 bbc0beedfa3c553ef2c7dfe99280d4850899caeefaf6cf2968f47cba1c065f03); both are MIT, licence text in reference/LICENSE. The harness hands saveAssets a recording file system and node's posix path module, as on the macOS and Linux hosts React Native builds run on, and prints one JSON array of written paths per record"
minified = "rnassets.min.js is hand-written in the shape Metro's minifier emits (bare keys, !0, .75, factories with one-letter parameters); node running it prints exactly behaviour/rnassets.hermes-stdout.txt"
omitted = "res/drawable-xxxhdpi/node_modules_scope_icons_assets_iconback.webp and the iOS assets/node_modules/@scope/icons/assets/Icon-Back@3x.webp are left out, as in a build whose densities moved to a split, so a correct locator reports them missing"
font = "the ttf asset is a 12-byte sfnt header with no tables, not a usable font; aapt2 copies raw resources unchanged"
shortening = "rnassets-short.map.txt is the --resource-path-shortening-map aapt2 optimize wrote for rnassets-short.apk, sorted; it is the reference for where each linked file went"

