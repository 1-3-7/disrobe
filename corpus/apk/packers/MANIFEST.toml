schema_version = 1
crate = "disrobe-pass-mobile"
generated = "2026-10-15"
toolchain = "OpenJDK 25.0.4 javac (--release 8, -g:none) and javax.crypto, R8 9.1.31 D8 (--release, --min-api 21), zig 0.13.0 (aarch64-linux-gnu shared library), aapt2 2.20 (manifest check only)"
command = "python build.py <jdk bin> <r8 jar> <zig> <aapt2>"
purpose = "Authored mimics of Android packer layouts for tests/apk_packers.rs. No packer, protector, third-party app or malware was run or copied: build.py writes each APK to match file names, manifest application classes, stub classes and, where public research documents it, the payload container of one packer. Detection anchors and formats come from published research (DexHunter, PackerGrind, Quarkslab, VB2014, DEF CON 22, DIMVA 2018) and, for the open-source Jiagu loader, its Apache-2.0 source."

[provenance]
reference = "original.dex, second.dex and large.dex are compiled from the Java sources inside build.py; a recovery must reproduce them byte for byte"
manifest_check = "each <apk>.xmltree.txt is `aapt2 dump xmltree --file AndroidManifest.xml <apk>` over the written APK"
dex_check = "dexdump -c reports 'Checksum verified' for original.dex, second.dex and large.dex"
encrypted_placeholders = "payloads the research describes as decrypted with a run-time key are RC4 under the literal key 'runtime-only-key', so a static recovery that claims them is wrong"

