schema_version = 1
crate = "disrobe-pass-jvm"
generated = "2026-06-03"
toolchain = "Android build-tools 34.0.0 (apksigner 0.9, aapt2, zipalign, d8), platform android-34, Eclipse Temurin JDK 25.0.3+9 keytool"
purpose = "Real apksigner-signed APK fixtures for the in-house APK Signature Scheme v1/v2/v3/v4 verifier (A6). Built locally, benign; classes.dex is corpus/jvm/dex/Hello.dex."

[provenance]
build = [
    "aapt2 compile + link a minimal AndroidManifest.xml (package com.disrobe.fixture) + strings.xml -> base-unsigned.apk",
    "inject corpus/jvm/dex/Hello.dex as classes.dex, then zipalign -f 4",
    "keytool RSA-2048 keystore (CN=Disrobe Fixture); apksigner sign with the listed schemes",
]
oracle = "apksigner verify --min-sdk-version 24 is the independent accept/reject oracle the in-house verifier must match."

[[fixture]]
path = "fixture-v2v3-signed.apk"
schemes = ["v1", "v2", "v3"]
apksigner_verdict = "Verifies (v2=true, v3=true; v1=false post-zipalign)"
note = "primary positive fixture; in-house verifier recomputes the chunked-SHA256/SHA512 content digest and matches the signed v2/v3 block digest"

[[fixture]]
path = "fixture-v2v3-signed.apk.idsig"
schemes = ["v4"]
note = "apksigner v4 signature side-file (APK Signature Scheme v4) for the v2v3 fixture"

[[fixture]]
path = "fixture-v1-signed.apk"
schemes = ["v1"]
apksigner_verdict = "Verifies (v1=true JAR signing only)"
note = "v1-only positive fixture; META-INF/FIXTUREK.{SF,RSA} present"

[[fixture]]
path = "fixture-tampered.apk"
schemes = ["v2", "v3"]
apksigner_verdict = "DOES NOT VERIFY - CHUNKED_SHA256 digest mismatch"
note = "byte-flipped copy of fixture-v2v3-signed.apk; negative oracle, in-house verifier must report integrity failure"
