[source]
obfuscator = "IronBrew2"
version = "2.7.0"
upstream = "github.com/Trollicus/ironbrew-2"
license = "MIT"
language = "C# (.NET) obfuscator emitting a Lua 5.1 register-VM"
target = "Lua 5.1"
provenance = "Built from source with dotnet and run on the author's own benign Lua scripts (originals below). Samples are produced by the real IronBrew2 tool, never by disrobe. No third-party or malicious code."

[note]
modes = "Each original is obfuscated twice. `.min` runs IronBrew2 with ControlFlow, Mutate, SuperOperators and BytecodeCompress all OFF; `.max` is the stock 2.7.0 default settings (all four ON)."
oracle = "Non-circular: the recovered Lua is run under a real Lua interpreter and its stdout compared to the known original's stdout. There is no encode-then-decode self-test."
recovery_status = ".min: full opcode + control-flow recovery, every sample validated output-equivalent against its original. .max: bytestring/key/constant/opcode-permutation/super-operator recovery (hello and arith reach output-equivalence; control/tables/edge recover the opcode table but the control-flow-flattening + number-mutation layer is not yet fully reversed and is flagged honestly)."

