schema_version = "1"
crate = "disrobe-pass-lua"
description = "self-authored benign Lua and Luau programs compiled to matching LuaJIT or Luau bytecode, used to grade the register lifters by running the original source and the recovered source through the matching interpreter and asserting identical stdout"

[toolchains]
luajit = "LuaJIT 2.1.1720049189 (DEVCOM.LuaJIT)"
luau = "luau-lang/luau 0.725 (luau.exe runtime + luau-compile.exe)"
luac_reference = "n/a (inputs are source text, not luac bytecode)"

[luajit]
description = "compiled with `luajit -b src/<name>.lua <name>.luajit` (stripped, the -b default) and `luajit -b -s` for the .stripped variant; the .lj20 variant is the 2.1 chunk with its version byte set to 0x01 to exercise the LuaJIT 2.0 code path (the bc op encoding for these programs is identical between 2.0 and 2.1)"
oracle = "run src/<name>.lua and the recovered source through luajit, assert identical stdout (file:line in error() messages normalized)"

[[luajit.fixtures]]
path = "arith_loops.luajit"
input = "src/arith_loops.lua"
sha256 = "3cd9d88a4227bf9afa6e88a60ec5891ae9c34f845ac7f2f58a95c3fcbb104916"
command = "luajit -b src/arith_loops.lua arith_loops.luajit"

[[luajit.fixtures]]
path = "arith_loops.stripped.luajit"
input = "src/arith_loops.lua"
sha256 = "a113fe6dc498bb359da5a9f4bca72b8a53b38888584f2ff1a8c087e6229cc08e"
command = "luajit -b -s src/arith_loops.lua arith_loops.stripped.luajit"

[[luajit.fixtures]]
path = "arith_loops.lj20.luajit"
input = "src/arith_loops.lua"
sha256 = "30e7c0ba6844a8cedd89166d81af5f246591df5df9d9859d689fb502686a6f21"
command = "luajit -b -s then version byte patched 0x02 -> 0x01 (LuaJIT 2.0)"

[[luajit.fixtures]]
