notes = """
Real BEAM bytecode generated on Windows 11 with Erlang/OTP 29 (erts-17.0)
+ Elixir 1.18.4 (compiled with OTP 27). Two-tier coverage:
  hello.* (smoke fixtures) - single export, minimal Code chunk.
  megafile/edge_cases.{erl,ex} - broad coverage: gen_server behaviour,
    records, maps, bit-syntax, list/binary comprehensions, processes
    (spawn/link/monitor), receive/after, ets/dets, try/catch/of/after,
    fun closures, BIFs, big ints. Elixir megafile adds GenServer/Supervisor/
    Agent/Task/Stream/Enum/with/pipe/protocols/macros/structs/anonymous-
    multi-clause/sigils/heredocs/Renderable protocol (4 impls).
  .ez archive built by zipping ebin/ tree (zip-of-beams format).
"""

