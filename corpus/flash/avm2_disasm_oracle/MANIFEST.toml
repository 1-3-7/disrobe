target_crate = "disrobe-nir-lift"
fetched_utc = "2026-08-13T00:00:00Z"
notes = """
Real AVM2 bytecode and an independent disassembly of it, for the NIR AVM2 lifter completeness
gate in crates/disrobe-nir-lift/tests/avm2_opcode_completeness.rs.

The programs are compiled from Haxe source by Haxe 4.3.7 targeting SWF. Neither the bytecode
nor the reference listing comes from this project's own decoder.

  haxe -cp . -main OpcodeBreadth -swf opcode_breadth.swf
  haxe -cp . -main ControlShapes -swf control_shapes.swf

The reference disassembly is exported by JPEXS Free Flash Decompiler 26.2.1:

  java -jar ffdec.jar -format script:pcode -export script <dir> <program>.swf

Each <program>.pcode.txt is the export directory concatenated in one pass: scripts sorted by
their relative path, each preceded by a line reading "; script <relative path>", LF endings,
otherwise the exporter's bytes unchanged.

avm2_instruction_set.txt is the same decompiler's whole one-byte AVM2 opcode space, one row per
slot. Each row is the two-digit hex opcode, a tab, then the mnemonic, or a single hyphen when the
slot is unallocated. It gives the gate an opcode denominator that does not come from this project.

The gate hash-pins every file here, so a changed corpus fails rather than rescoring. The Haxe
sources are committed beside the bytecode so the corpus can be rebuilt.
"""

